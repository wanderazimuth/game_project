<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Castle Siege</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#8fd0f5;touch-action:none;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;height:76px;display:none;align-items:center;justify-content:center;gap:6px;padding:6px;
  background:linear-gradient(#5a3d22,#3d2814);border-top:3px solid #c9a227;overflow-x:auto}
.bar button{flex:none;height:60px;min-width:62px;padding:2px 8px;border-radius:10px;border:2px solid #8a6a3a;background:#6e4c2a;color:#fff;
  font:bold 12px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.bar button b{font-size:22px;line-height:1.1}
.bar button.sel{border-color:#ffd84a;background:#8f6a36;box-shadow:0 0 10px #ffd84a}
.bar button:disabled{opacity:.4}
.bar button.go{background:#b0302a;border-color:#ffd84a;min-width:96px;font-size:14px}
.sw{width:26px;height:20px;border-radius:3px;margin-bottom:2px;border:1px solid rgba(0,0,0,.4)}
#msg{position:fixed;inset:0;z-index:20;background:rgba(20,10,0,.6);display:flex;align-items:center;justify-content:center}
#msg .box{background:#3d2814;border:3px solid #c9a227;border-radius:16px;padding:22px 26px;max-width:92vw;text-align:center;color:#fff}
#msg h1{color:#ffd84a;font-size:2rem;margin-bottom:6px}
#msg p{font-size:1rem;margin:6px 0;color:#f3e3c3}
#msg input{font:bold 2.4rem system-ui;width:5.2em;text-align:center;letter-spacing:.3em;padding:6px;border-radius:12px;border:3px solid #c9a227;margin-top:8px}
.code{font:900 3rem system-ui;letter-spacing:.3em;color:#ffd84a;margin:8px 0}
#msg button{margin-top:12px;font:bold 1.2rem system-ui;padding:12px 26px;border-radius:12px;border:2px solid #ffd84a;background:#b0302a;color:#fff;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="buildBar"></div>
<div class="bar" id="battleBar"></div>
<div id="msg"><div class="box" id="msgBox"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,SC,OX,OY;
const CS=32,COLS=44,ROWS=14,TOP=230,GY=TOP+ROWS*CS,WW=COLS*CS,WH=GY+56,G=900,VMAX=1180;
function resize(){
  DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  const ah=H-76;SC=Math.min(W/WW,ah/WH);OX=(W-WW*SC)/2;OY=ah-WH*SC;
}
addEventListener('resize',resize);resize();
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const E=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.fill()};
const P=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fill()};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

// ── Sound ─────────────────────────────────────────────────────────────────────
let AC,NB;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}
}
function snd(f,d,type='square',v=.04,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}
function noise(d,v,f=0){
  if(!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),t=AC.currentTime;s.buffer=NB;
  let n=s;if(f){n=AC.createBiquadFilter();n.type='lowpass';n.frequency.value=f;s.connect(n)}
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(g).connect(AC.destination);s.start(t);s.stop(t+d);
}
const tune=(notes,gap=100,type='square')=>notes.forEach((f,i)=>setTimeout(()=>snd(f,.16,type,.045),i*gap));

// ── Castle grid ───────────────────────────────────────────────────────────────
// row 0 sits on the ground; rows go up. Your castle is on the left, the enemy's on the right.
const MAT={
  glass:{hp:1, n:'Glass',c:'#bfe8ff'},
  wood: {hp:3, n:'Wood', c:'#b07a42'},
  stone:{hp:6, n:'Stone',c:'#9a9ca6'},
  metal:{hp:12,n:'Metal',c:'#6f7d8c'},
};
const ZONES=[{c0:0,c1:9,cat:11},{c0:34,c1:43,cat:32}];
const localToCol=(side,u)=>side===0?9-u:34+u;   // u = 0 is the wall facing the enemy
let grid=new Array(COLS*ROWS).fill(null),kings=[];
const blk=(c,r)=>c<0||c>=COLS||r<0||r>=ROWS?null:grid[r*COLS+c];
const setBlk=(c,r,b)=>{grid[r*COLS+c]=b};
const kingAt=(c,r)=>kings.find(k=>k.c===c&&k.r===r&&k.hearts>0);
const occ=(c,r)=>r<0||!!blk(c,r)||!!kings.find(k=>k.c===c&&k.r===r);
const cellX=c=>c*CS,cellY=r=>GY-(r+1)*CS;
const sideOf=c=>c<=ZONES[0].c1?0:c>=ZONES[1].c0?1:-1;
function settleNow(){
  for(let moved=true;moved;){
    moved=false;
    for(let r=1;r<ROWS;r++)for(let c=0;c<COLS;c++){const b=blk(c,r);if(b&&!occ(c,r-1)){setBlk(c,r-1,b);setBlk(c,r,null);moved=true}}
    for(const k of kings)if(k.r>0&&!occ(k.c,k.r-1)){k.r--;moved=true}
  }
}
function clearSide(side){const z=ZONES[side];for(let r=0;r<ROWS;r++)for(let c=z.c0;c<=z.c1;c++)setBlk(c,r,null)}
function genCastle(side,lv){
  // a list of blocks in the order they should be built: king's room, front wall, towers, extras
  const weights=side===0||twoP?{wood:4,stone:5,metal:1}:
    lv<=1?{glass:3,wood:6,stone:1}:lv===2?{glass:2,wood:5,stone:3}:lv===3?{wood:4,stone:5,metal:1}:{wood:3,stone:5,metal:Math.min(6,1+lv/2)};
  const M=()=>{let t=0;for(const k in weights)t+=weights[k];let x=Math.random()*t;for(const k in weights){x-=weights[k];if(x<=0)return k}return 'wood'};
  const L=[],add=(u,r,m=M())=>{if(u>=0&&u<=9&&r<ROWS&&!L.some(o=>o.u===u&&o.r===r))L.push({u,r,m})};
  const ku=4+((Math.random()*3)|0),big=Math.min(6,lv);
  add(ku-1,0);add(ku+1,0);add(ku-1,1);add(ku+1,1);add(ku-1,2);add(ku,2);add(ku+1,2);
  const fh=3+((Math.random()*(2+big))|0);
  for(let r=0;r<fh;r++)add(0,r);
  if(lv>=2)for(let r=0;r<fh-1;r++)add(1,r);
  const bh=4+((Math.random()*(2+big))|0);
  for(let r=0;r<bh;r++)add(9,r);if(lv>=3)for(let r=0;r<bh-1;r++)add(8,r);
  for(let u=2;u<ku-1;u++){const h=1+((Math.random()*(1+big/2))|0);for(let r=0;r<h;r++)add(u,r)}
  add(ku,3);if(lv>=2){add(ku-1,3);add(ku+1,3)}if(lv>=4){add(ku,4);add(ku-1,4,'stone');add(ku+1,4,'stone')}
  for(let u=ku+2;u<9;u++){const h=1+((Math.random()*(1+big/2))|0);for(let r=0;r<h;r++)add(u,r)}
  if(lv>=5)for(let u=2;u<9;u++)if(Math.random()<.5)add(u,ROWS-9+((Math.random()*3)|0),'wood');
  return {L,ku};
}
function buildCastle(side,lv){
  clearSide(side);
  const {L,ku}=genCastle(side,lv);
  const k=kings[side];k.c=localToCol(side,ku);k.r=0;
  for(const o of L)setBlk(localToCol(side,o.u),o.r,{m:o.m,hp:MAT[o.m].hp,fire:0,burnT:0,fell:0});
  settleNow();
}

// ── Game state ────────────────────────────────────────────────────────────────
let mode='menu',twoP=false,bside=0,level=1,tool='stone',design=null,turn=0,phase='aim',waitT=0,aiT=0,endT=0,winner=-1;
let projs=[],parts=[],texts=[],aim=null,shake=0,fallT=0,falling=false,catArm=[0,0],banner=null;
let ammo={},sel='rock';
const AMMO={
  rock: {e:'🪨',n:'Boulder',start:Infinity},
  bomb: {e:'💣',n:'Bomb',   start:2},
  fire: {e:'🔥',n:'Fire pot',start:2},
  triple:{e:'☄️',n:'Triple',start:2},
};
const showBanner=(a,b,t=2.5)=>{banner={a,b,t}};
const PNAME=['🔵 Player 1','🔴 Player 2'];
const human=side=>side===0||twoP;   // in 2 player mode nobody is the computer
const mine=side=>!net||side===net.me; // online: you only aim on your own turn
function newGame(two){
  level=1;twoP=two;
  kings=[{side:0,c:5,r:0,hearts:3,inv:0},{side:1,c:38,r:0,hearts:3,inv:0}];
  grid.fill(null);
  buildCastle(0,1);if(twoP)buildCastle(1,1);
  startBuild();
}
function startBuild(){
  mode='build';bside=net?net.me:0;
  if(!twoP)buildCastle(1,level);
  kings[1].hearts=3;kings[0].hearts=3;
  projs=[];parts=[];texts=[];
  hideMsg();renderBuildBar();show('buildBar');
  if(net)showBanner('Build your castle! 🏰','Then tap Ready ✅',3.5);
  else if(twoP)showBanner(PNAME[0]+': build your castle! 🏰','Then tap Done and pass to Player 2',3.5);
  else showBanner('Level '+level+': build your castle! 🏰','Keep your King 👑 safe — tap to add blocks',3.5);
}
function saveDesign(){
  design=[0,1].map(side=>{
    const z=ZONES[side],L=[];
    for(let r=0;r<ROWS;r++)for(let c=z.c0;c<=z.c1;c++){const b=blk(c,r);if(b)L.push({c,r,m:b.m})}
    return {L,kc:kings[side].c,kr:kings[side].r};
  });
}
function restoreDesign(side){
  const d=design[side];
  clearSide(side);for(const o of d.L)setBlk(o.c,o.r,{m:o.m,hp:MAT[o.m].hp,fire:0,burnT:0,fell:0});
  kings[side].c=d.kc;kings[side].r=d.kr;settleNow();
}
function startBattle(first=0){
  saveDesign();
  mode='battle';turn=first;phase='aim';winner=-1;endT=0;waitT=0;
  ammo=[{},{}];for(const k in AMMO){ammo[0][k]=AMMO[k].start;ammo[1][k]=AMMO[k].start}sel='rock';
  kings.forEach(k=>{k.hearts=3;k.inv=0;k.ko=0});
  show('battleBar');renderBattleBar();
  showBanner('⚔️ BATTLE! ⚔️',net?(turn===net.me?'You go first — drag back and let go!':'They go first — get ready!'):twoP?PNAME[0]+' goes first — drag back and let go!':'Drag back and let go to fling!',3);
  tune([392,523,659,784],110);
}
function nextTurn(){
  if(winner>=0)return;
  turn=1-turn;phase='aim';waitT=0;sel='rock';
  if(net)showBanner(turn===net.me?'Your turn!':PNAME[turn]+"'s turn…",'',1.2);
  else if(twoP)showBanner(PNAME[turn]+"'s turn!",'',1.2);
  else if(turn===1){aiT=1.3;showBanner('Enemy turn…','',1.2)}
  else showBanner('Your turn!','',1.2);
  renderBattleBar();
}

// ── Firing ────────────────────────────────────────────────────────────────────
const catPos=side=>({x:ZONES[side].cat*CS+16+(side?-6:6),y:GY-74});
function launch(side,vx,vy,kind){
  const p=catPos(side);
  catArm[side]=1;
  const mk=(vx,vy,r,dmg)=>projs.push({x:p.x,y:p.y,vx,vy,r,dmg,kind,side,rot:0});
  if(kind==='triple'){const a=Math.atan2(vy,vx),v=Math.hypot(vx,vy);for(const d of[-.07,0,.07])mk(Math.cos(a+d)*v,Math.sin(a+d)*v,8,2)}
  else mk(vx,vy,kind==='rock'?12:11,kind==='rock'?4:0);
  phase='flying';waitT=0;
  if(human(side)&&ammo[side][kind]!==Infinity)ammo[side][kind]--;
  if(net&&side===net.me)netSend({t:'shot',vx,vy,kind});
  noise(.25,.08,600);snd(180,.2,'triangle',.05,.5);
  renderBattleBar();
}
function aiShoot(){
  const k=kings[0],sp=catPos(1);
  const ammoAI=level>=2&&Math.random()<.3?pick(['bomb','fire','triple']):'rock';
  const tx=cellX(k.c)+16,ty=cellY(k.r)+16;
  const dx=Math.abs(tx-sp.x),dy=ty-sp.y;
  let th=rand(.62,1.0),v2=0;
  for(let i=0;i<10;i++){const den=2*Math.cos(th)**2*(dy+dx*Math.tan(th));if(den>0){v2=G*dx*dx/den;if(v2<VMAX*VMAX)break}th+=.05}
  const err=Math.max(.01,.042-level*.005),v=Math.sqrt(v2)*(1+rand(-err,err));
  launch(1,-Math.cos(th)*v,-Math.sin(th)*v,ammoAI);
}
function hurtKing(k,why){
  if(k.inv>0||k.hearts<=0||winner>=0)return;
  // online, the shooter's device keeps score and sends it over when the shot is done
  const passive=net&&turn!==net.me,h=k.hearts-1;
  if(!passive)k.hearts--;k.inv=.6;shake=8;
  texts.push({x:cellX(k.c)+16,y:cellY(k.r)-24,s:h>0?(k.side?'Ouch! 👑':'My crown! 😵'):'BONK! 💫',t:1.4,c:k.side?'#ffd84a':'#ff8a80'});
  snd(k.side?660:220,.25,'square',.05,k.side?1.5:.5);
  if(k.hearts<=0){winner=1-k.side;k.ko=1;endT=0;if(net)netSend(getState())}
}
function hitBlock(c,r,dmg){
  const b=blk(c,r);if(!b)return 0;
  const had=b.hp;b.hp-=dmg;
  for(let i=0;i<4;i++)parts.push({x:cellX(c)+rand(4,28),y:cellY(r)+rand(4,28),vx:rand(-120,120),vy:rand(-200,0),g:1,t:.6,max:.6,c:MAT[b.m].c,s:rand(3,7)});
  if(b.hp<=0){
    setBlk(c,r,null);
    for(let i=0;i<8;i++)parts.push({x:cellX(c)+16,y:cellY(r)+16,vx:rand(-180,180),vy:rand(-260,40),g:1,t:.9,max:.9,c:MAT[b.m].c,s:rand(4,9)});
    if(b.m==='glass')snd(1800,.12,'triangle',.03,.6);else noise(.15,.06,b.m==='wood'?900:500);
  }
  return had;
}
function explode(x,y){
  const R=2.4;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=Math.hypot(cellX(c)+16-x,cellY(r)+16-y)/CS;
    if(d<R&&blk(c,r))hitBlock(c,r,Math.max(1,Math.round(8*(1-d/(R+.6)))));
  }
  for(const k of kings)if(Math.hypot(cellX(k.c)+16-x,cellY(k.r)+16-y)<CS*1.9)hurtKing(k);
  for(let i=0;i<30;i++){const a=Math.random()*7,s=rand(60,380);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rand(.3,.7),max:.7,c:pick(['#ffcc33','#ff7a1a','#ff3d1a','#555']),s:rand(5,11)})}
  shake=12;noise(.6,.2,1200);snd(60,.5,'sawtooth',.06,.4);
}
function ignite(x,y){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=blk(c,r);if(!b)continue;
    if(Math.hypot(cellX(c)+16-x,cellY(r)+16-y)>CS*1.7)continue;
    if(b.m==='wood'){b.fire=3.2;b.burnT=.5}else hitBlock(c,r,b.m==='glass'?1:1);
  }
  for(const k of kings)if(Math.hypot(cellX(k.c)+16-x,cellY(k.r)+16-y)<CS*1.5)hurtKing(k);
  for(let i=0;i<20;i++)parts.push({x,y,vx:rand(-160,160),vy:rand(-220,20),t:.6,max:.6,c:pick(['#ffcc33','#ff7a1a']),s:rand(4,9)});
  noise(.4,.1,2000);
}
function projHit(p){
  // returns true when the shot is finished
  if(p.y>=GY){
    if(p.kind==='bomb')explode(p.x,GY-6);else if(p.kind==='fire')ignite(p.x,GY-8);
    else{for(let i=0;i<6;i++)parts.push({x:p.x,y:GY,vx:rand(-90,90),vy:rand(-160,-40),g:1,t:.5,max:.5,c:'#8a6a3a',s:4});snd(90,.12,'triangle',.04)}
    return true;
  }
  if(p.x<-80||p.x>WW+80)return true;
  for(const k of kings){
    if(k.hearts<=0)continue;
    if(Math.hypot(cellX(k.c)+16-p.x,cellY(k.r)+16-p.y)<14+p.r){
      if(p.kind==='bomb')explode(p.x,p.y);else if(p.kind==='fire')ignite(p.x,p.y);else hurtKing(k);
      return true;
    }
  }
  const c=Math.floor(p.x/CS),r=Math.floor((GY-p.y)/CS);
  if(r<0||r>=ROWS||!blk(c,r))return false;
  if(p.kind==='bomb'){explode(p.x,p.y);return true}
  if(p.kind==='fire'){ignite(p.x,p.y);return true}
  const had=hitBlock(c,r,p.dmg);
  shake=Math.max(shake,4);
  if(blk(c,r))return true;          // the block survived: the boulder stops
  p.dmg-=had;if(p.dmg<=0)return true;
  p.vx*=.7;p.vy*=.7;return false;   // smashed through, keep going
}

// ── Update ────────────────────────────────────────────────────────────────────
function gravityStep(){
  let moved=false;
  for(let r=1;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=blk(c,r);if(!b)continue;
    if(!occ(c,r-1)){setBlk(c,r-1,b);setBlk(c,r,null);b.fell++;moved=true}
    else{const k=kingAt(c,r-1);if(k&&b.fell>0)hurtKing(k);if(b.fell>1){noise(.08,.04,400)}b.fell=0}
  }
  for(const k of kings){
    if(k.r>0&&!occ(k.c,k.r-1)){k.r--;k.fell=(k.fell||0)+1;moved=true}
    else{if((k.fell||0)>=3)hurtKing(k);k.fell=0}
  }
  return moved;
}
function update(dt,T){
  if(banner&&(banner.t-=dt)<=0)banner=null;
  for(const t of texts){t.t-=dt;t.y-=26*dt}texts=texts.filter(t=>t.t>0);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.g)q.vy+=700*dt;q.t-=dt}parts=parts.filter(q=>q.t>0);
  shake*=Math.pow(.02,dt);
  catArm[0]=Math.max(0,catArm[0]-dt*2.5);catArm[1]=Math.max(0,catArm[1]-dt*2.5);
  if(mode!=='battle')return;
  for(const k of kings)k.inv-=dt;

  for(const p of projs){
    const steps=Math.max(1,Math.ceil(Math.hypot(p.vx,p.vy)*dt/6));
    for(let s=0;s<steps;s++){
      p.vy+=G*dt/steps;p.x+=p.vx*dt/steps;p.y+=p.vy*dt/steps;
      if(projHit(p)){p.done=true;break}
    }
    p.rot+=dt*8;
    if(p.kind==='fire'&&Math.random()<.7)parts.push({x:p.x,y:p.y,vx:rand(-30,30),vy:rand(-60,0),t:.3,max:.3,c:pick(['#ffcc33','#ff7a1a']),s:6});
    if(p.kind==='bomb'&&Math.random()<.5)parts.push({x:p.x,y:p.y-12,vx:rand(-20,20),vy:-40,t:.3,max:.3,c:'#ffe066',s:3});
  }
  projs=projs.filter(p=>!p.done);

  let burning=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const b=blk(c,r);if(!b||b.fire<=0)continue;
    burning=true;b.fire-=dt;b.burnT-=dt;
    if(Math.random()<.4)parts.push({x:cellX(c)+rand(4,28),y:cellY(r)+rand(0,20),vx:rand(-10,10),vy:-rand(30,80),t:.5,max:.5,c:pick(['#ffcc33','#ff7a1a','#ff3d1a']),s:rand(4,8)});
    if(b.burnT<=0){
      b.burnT=.8;
      for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=blk(c+dc,r+dr);if(n&&n.m==='wood'&&n.fire<=0&&Math.random()<.3){n.fire=3;n.burnT=.8}}
      const k=kingAt(c,r+1)||kingAt(c+1,r)||kingAt(c-1,r);if(k&&Math.random()<.35)hurtKing(k);
      hitBlock(c,r,1);
    }
  }
  if((fallT-=dt)<=0){fallT=.05;falling=gravityStep()}

  if(winner>=0){
    endT+=dt;
    if(endT>1.8&&!document.getElementById('msg').style.display.includes('flex'))battleOver();
    return;
  }
  if(phase==='flying'){
    if(!projs.length&&!falling&&!burning){
      waitT+=dt;
      if(waitT>.7&&mine(turn)){if(net)netSend(getState());nextTurn()}
    }else waitT=0;
  }else if(!twoP&&turn===1&&phase==='aim'){
    aiT-=dt;if(aiT<=0)aiShoot();
  }
}

  showMsg(host?`<h1>🏠 Hosting…</h1><p>Your room code is</p><div class="code">${code}</div><p>Tell your friend to tap 📡 2 Devices → Join a game and type it in.</p><p>⏳ Waiting for your friend…</p>${MENU_BTN}`:`<h1>🔑 Joining ${code}…</h1>${MENU_BTN}`);
  document.getElementById('menuBtn').onclick=showTitle;
  try{n.ws=new WebSocket(`${proto}//${location.host}/ws/castle-siege/${code}${host?'?host=1':''}`)}
  catch(e){joinMenu("Couldn't connect 😕");return}
  n.ws.onmessage=e=>{if(net===n)onNet(JSON.parse(e.data))};
  n.ws.onclose=()=>{if(net===n)lost()};
}
function lost(){
  const was=net&&net.joined;netClose();mode='menu';show(null);banner=null;
  showMsg(`<h1>📡 Disconnected</h1><p>${was?'The other player left the game 😢':"Couldn't connect to the game 😕"}</p><button id="mbtn">2 Devices 📡</button> ${MENU_BTN}`);
  document.getElementById('mbtn').onclick=onlineMenu;document.getElementById('menuBtn').onclick=showTitle;
}
function onNet(m){
  if(m.type==='code_taken'){connect(String(100+((Math.random()*900)|0)),true);return}
  if(m.type==='no_room'){joinMenu(`Nobody is hosting room ${net.code} 🤔 Check the code!`);return}
  if(m.type==='room_full'){joinMenu(`Room ${net.code} already has 2 players.`);return}
  if(m.type==='peer_status'){
    if(m.connected&&!net.joined){net.joined=true;tune([523,659,784],100);newGame(true)}
    else if(!m.connected&&net.joined)lost();
    return;
  }
  if(m.t==='castle'){net.their={round:m.round,d:m.d};checkReady()}
  else if(m.t==='shot'){if(mode==='battle'&&turn!==net.me&&phase==='aim')launch(turn,m.vx,m.vy,m.kind)}
  else if(m.t==='state'&&mode==='battle')setState(m);
}
function checkReady(){
  if(mode!=='build'||!net.ready||!net.their||net.their.round!==net.round)return;
  const o=1-net.me;design[o]=net.their.d;restoreDesign(o);
  startBattle(net.round%2);   // take turns going first each game
}
function getState(){
  const g=[];grid.forEach((b,i)=>{if(b)g.push([i,b.m,b.hp,b.fire])});
  return {t:'state',g,k:kings.map(k=>[k.c,k.r,k.hearts]),w:winner,a:ammo};
}
function setState(m){
  projs=[];grid.fill(null);
  for(const[i,mm,hp,fire]of m.g)grid[i]={m:mm,hp,fire,burnT:.8,fell:0};
  m.k.forEach(([c,r,h],i)=>{const k=kings[i];k.c=c;k.r=r;k.hearts=h});
  ammo=m.a.map(o=>{const a={};for(const k in o)a[k]=o[k]===null?Infinity:o[k];return a});
  if(m.w>=0){if(winner<0){winner=m.w;kings[1-m.w].ko=1;endT=0}}
  else nextTurn();
}
showTitle();

// ── Pointer: building & aiming ────────────────────────────────────────────────
const toWorld=(sx,sy)=>({x:(sx-OX)/SC,y:(sy-OY)/SC});
let painting=null;
function buildAt(sx,sy){
  if(net&&net.ready)return;
  const w=toWorld(sx,sy),c=Math.floor(w.x/CS);let r=Math.floor((GY-w.y)/CS);
  if(sideOf(c)!==bside||r<0||r>=ROWS)return;
  const key=c+','+r;if(painting&&painting.last===key)return;if(painting)painting.last=key;
  const k=kings[bside];
  if(tool==='erase'){const b=blk(c,r);if(b){setBlk(c,r,null);settleNow();snd(260,.06)}return}
  if(tool==='king'){if(blk(c,r))return;k.c=c;k.r=r;settleNow();snd(700,.06);return}
  if(blk(c,r)||(k.c===c&&k.r===r))return;
  const m=MAT[tool];
  while(r>0&&!occ(c,r-1))r--;
  if(occ(c,r))return;
  setBlk(c,r,{m:tool,hp:m.hp,fire:0,burnT:0,fell:0});snd(400+r*30,.06,'triangle',.04);
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  if(mode==='build'){painting={id:e.pointerId,last:null};buildAt(e.clientX,e.clientY);return}
  if(mode==='battle'&&human(turn)&&mine(turn)&&phase==='aim'&&winner<0&&!aim)aim={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(painting&&painting.id===e.pointerId&&tool!=='king')buildAt(e.clientX,e.clientY);
  if(aim&&aim.id===e.pointerId){aim.x=e.clientX;aim.y=e.clientY}
});
for(const ev of ['pointerup','pointercancel'])addEventListener(ev,e=>{
  if(painting&&painting.id===e.pointerId)painting=null;
  if(aim&&aim.id===e.pointerId){
    const v=aimVel();aim=null;
    if(ev==='pointerup'&&v.pow&&mode==='battle'&&human(turn)&&mine(turn)&&phase==='aim'){
      const a=ammo[turn];if(a[sel]<=0)sel='rock';
      launch(turn,v.vx,v.vy,sel);if(a[sel]<=0)sel='rock';renderBattleBar();
    }
  }
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
