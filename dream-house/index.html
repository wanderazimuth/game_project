<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dream House</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#9fd8ff;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
button{font:inherit;cursor:pointer;border:none}
#top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:rgba(40,30,70,.82);color:#fff;z-index:5}
#top a{color:#fff;text-decoration:none;font-size:22px;padding:0 6px}
#top .title{font-weight:800;font-size:17px;margin-right:auto;white-space:nowrap}
.mode{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700;white-space:nowrap}
@media (max-width:520px){#top .title{display:none}#top{justify-content:flex-end}#top a{margin-right:auto}}
#zoom{position:fixed;right:10px;display:none;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:44px;height:44px;border-radius:12px;background:rgba(40,30,70,.85);color:#fff;font-size:24px;font-weight:800}
.mode.on{background:#ffcf4a;color:#3a2a00}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(40,30,70,.9);z-index:5;display:none}
#tabs{display:flex;gap:4px;padding:6px 8px 0}
.tab{background:transparent;color:#cbbff0;padding:6px 12px;border-radius:9px 9px 0 0;font-weight:700;font-size:14px}
.tab.on{background:rgba(255,255,255,.14);color:#fff}
#tray{display:flex;gap:7px;overflow-x:auto;padding:8px;background:rgba(255,255,255,.14);height:92px;align-items:center;
  touch-action:pan-x;scrollbar-width:thin}
.cat{flex:0 0 auto;width:66px;height:76px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11px;color:#333;font-weight:700;border:3px solid transparent}
.cat.on{border-color:#ffcf4a}
.cat canvas{width:56px;height:52px}
.sw{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:3px solid rgba(255,255,255,.4)}
.sw.on{border-color:#ffcf4a}
.pat{flex:0 0 auto;height:44px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.9);color:#333;font-weight:700;font-size:13px;border:3px solid transparent}
.pat.on{border-color:#ffcf4a}
.lbl{flex:0 0 auto;color:#fff;font-size:12px;font-weight:700;opacity:.8;padding:0 2px}
.big{flex:0 0 auto;height:48px;padding:0 14px;border-radius:10px;background:#ffcf4a;color:#3a2a00;font-weight:800;font-size:14px}
.big.red{background:#ff7b7b;color:#400}
#sel{position:fixed;display:none;z-index:6;gap:4px;background:rgba(40,30,70,.92);padding:5px;border-radius:12px}
#sel button{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.15);font-size:20px;color:#fff}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:rgba(40,30,70,.9);color:#fff;
  padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;
  text-align:center;max-width:90vw}
#me{position:fixed;inset:0;z-index:8;background:linear-gradient(160deg,#ffd6e8,#d6e4ff);display:none;overflow-y:auto;touch-action:pan-y}
#meIn{max-width:760px;margin:0 auto;padding:14px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#preview{background:radial-gradient(#fff,#f3e8ff);border-radius:20px;width:220px;height:300px;flex:0 0 auto;box-shadow:0 4px 18px rgba(80,40,120,.2)}
#opts{flex:1 1 300px;max-width:480px}
#opts h2{color:#4a2a7a;margin-bottom:8px}
.row{margin-bottom:10px}
.row b{display:block;color:#4a2a7a;font-size:13px;margin-bottom:4px}
.row .ch{display:flex;gap:6px;flex-wrap:wrap}
.cs{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cs.on{border-color:#4a2a7a}
.ts{padding:6px 10px;border-radius:9px;background:#fff;color:#4a2a7a;font-weight:700;font-size:13px;border:2px solid #fff}
.ts.on{border-color:#4a2a7a;background:#efe4ff}
#name{font:inherit;font-size:18px;font-weight:700;padding:7px 10px;border-radius:10px;border:2px solid #c9b3ec;width:200px;color:#4a2a7a}
#meBtns{display:flex;gap:8px;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <a href="/" title="Back to Arcade">&#8962;</a>
  <span class="title">Dream House</span>
  <button class="mode" id="mBuild">🛠 Build</button>
  <button class="mode" id="mMe">👕 Me</button>
  <button class="mode" id="mPlay">▶ Play</button>
</div>
<div id="bar">
  <div id="tabs">
    <button class="tab" data-tab="furn">Furniture</button>
    <button class="tab" data-tab="walls">Walls</button>
    <button class="tab" data-tab="floors">Floors</button>
    <button class="tab" data-tab="house">House</button>
  </div>
  <div id="tray"></div>
</div>
<div id="sel">
  <button id="sColor" title="Color">🎨</button>
  <button id="sFlip" title="Flip">↔</button>
  <button id="sFront" title="Bring to front">⬆</button>
  <button id="sDel" title="Remove">🗑</button>
</div>
<div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button></div>
<div id="toast"></div>
<div id="me"><div id="meIn">
  <canvas id="preview"></canvas>
  <div id="opts">
    <h2>Make your player</h2>
    <div class="row"><b>Name</b><input id="name" maxlength="12" autocomplete="off"></div>
    <div id="rows"></div>
    <div id="meBtns"><button class="big" id="meRand">🎲 Random</button><button class="big" id="meDone">Done ✔</button></div>
  </div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let X=ctx;   // the context the draw helpers paint on (the game canvas, or a thumbnail)
let W,H;
function resize(){
  const d=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  cv.style.width=W+'px';cv.style.height=H+'px';
}
addEventListener('resize',resize);resize();

// ── House layout (world units; y grows downward, the ground is y=0) ───────────
const ROOM_W=320, ROOMS=3, FLOOR_H=220, SLAB=14, WALL=10, STAIR_W=80, MAX_FLOORS=3;
const HW=ROOM_W*ROOMS;            // house width
const INT_H=FLOOR_H-SLAB;          // inside height of a room
const DOOR_H=150;                  // doorways between rooms
const stand=f=>-f*FLOOR_H-SLAB;    // y the furniture and the player stand on
const MINX=WALL+STAIR_W+4, MAXX=HW-WALL;   // floor furniture stays clear of the stairs

// ── Palettes ─────────────────────────────────────────────────────────────────
const ITEMC=['#8d5a3b','#c8915a','#5d4037','#ecf0f1','#2d3436','#e74c3c','#e67e22','#f1c40f',
  '#27ae60','#16a085','#3498db','#2c3e8f','#9b59b6','#e84393','#fd79a8','#81ecec'];
const WALLC=['#fde2b5','#ffd1dc','#ffe9a8','#d4f5c4','#c6ecff','#e2d4ff','#ffffff','#f0e0d0',
  '#ffb3a7','#a8e6cf','#9ec9ff','#c9a0ff','#5d6d7e','#3d3d5c'];
const PATTERNS=['Plain','Stripes','Dots','Bricks','Panels','Hearts'];
const FLOORS=[
  {n:'Oak',c:'#c8915a',k:'wood'},{n:'Walnut',c:'#7b4a2b',k:'wood'},{n:'Pale wood',c:'#e6c79a',k:'wood'},
  {n:'White tile',c:'#eef2f5',k:'tile'},{n:'Blue tile',c:'#7fb8e6',k:'tile'},{n:'Checkers',c:'#f5f5f5',k:'check'},
  {n:'Red carpet',c:'#c0392b',k:'carpet'},{n:'Blue carpet',c:'#3d5a9e',k:'carpet'},{n:'Green carpet',c:'#4f9a5a',k:'carpet'},
  {n:'Pink carpet',c:'#f29bbd',k:'carpet'},{n:'Stone',c:'#9aa0a6',k:'tile'}];
const ROOFC=['#c0392b','#7f4f24','#2c3e50','#16a085','#8e44ad','#e67e22','#2e86de','#e84393'];
const SIDEC=['#f5e6c8','#ffffff','#d6c3a5','#b8d8e8','#f2c6c2','#cfe8c0','#9b8e7e','#5e6472'];
const BOOKC=['#e74c3c','#3498db','#f1c40f','#27ae60','#9b59b6','#e67e22','#1abc9c','#34495e'];

// ── Small drawing helpers ────────────────────────────────────────────────────
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}
function E(x,y,rx,ry,c){X.fillStyle=c;X.beginPath();X.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);X.fill()}
function P(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)X.lineTo(pts[i],pts[i+1]);X.closePath();X.fill()}
function L(x1,y1,x2,y2,c,w){X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke()}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+amt));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).slice(1);
}
function glow(x,y,r,a){
  const g=X.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,226,150,${a})`);g.addColorStop(1,'rgba(255,226,150,0)');
  X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);
}
function star(x,y,r,c){
  const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  P(p,c);
}

// ── Furniture ────────────────────────────────────────────────────────────────
// Each draw function paints the item with its bottom-left corner at (x,y).
const ITEMS={
  bed:{n:'Bed',w:120,h:62,c:'#3498db',act:'sleep',draw(x,y,w,h,c){
    const wood='#8d5a3b';
    RR(x,y-h,13,h,4,wood);R(x+w-10,y-40,10,40,wood);
    R(x+12,y-24,w-22,12,shade(wood,-20));
    RR(x+10,y-38,w-20,16,5,'#f7f7f7');
    E(x+30,y-41,15,7,'#fff');
    RR(x+46,y-42,w-56,22,6,c);R(x+46,y-42,w-56,5,shade(c,35));
  }},
  sofa:{n:'Sofa',w:120,h:56,c:'#e74c3c',act:'sit',seat:30,draw(x,y,w,h,c){
    R(x+8,y-6,6,6,'#4e342e');R(x+w-14,y-6,6,6,'#4e342e');
    RR(x+6,y-h,w-12,34,10,c);R(x+w/2-1,y-h+6,2,24,shade(c,-25));
    RR(x+4,y-32,w-8,24,6,shade(c,-15));
    RR(x,y-42,18,36,8,shade(c,-5));RR(x+w-18,y-42,18,36,8,shade(c,-5));
  }},
  armchair:{n:'Armchair',w:64,h:58,c:'#16a085',act:'sit',seat:30,draw(x,y,w,h,c){
    R(x+6,y-6,6,6,'#4e342e');R(x+w-12,y-6,6,6,'#4e342e');
    RR(x+6,y-h,w-12,36,10,c);RR(x+4,y-32,w-8,24,6,shade(c,-15));
    RR(x,y-42,16,36,8,shade(c,-5));RR(x+w-16,y-42,16,36,8,shade(c,-5));
  }},
  chair:{n:'Chair',w:38,h:66,c:'#c8915a',act:'sit',seat:34,draw(x,y,w,h,c){
    const d=shade(c,-30);
    R(x+4,y-32,4,32,d);R(x+w-8,y-32,4,32,d);
    RR(x,y-37,w,7,3,c);R(x+2,y-h,6,h-34,c);RR(x,y-h,w-6,8,3,c);RR(x,y-h+16,w-10,5,2,d);
  }},
  table:{n:'Table',w:96,h:44,c:'#c8915a',draw(x,y,w,h,c){
    R(x+6,y-h+7,6,h-7,shade(c,-30));R(x+w-12,y-h+7,6,h-7,shade(c,-30));
    RR(x,y-h,w,8,3,c);
    E(x+w/2,y-h-4,14,5,'#f5f5f5');E(x+w/2-6,y-h-8,5,5,'#e74c3c');E(x+w/2+5,y-h-8,5,5,'#f39c12');E(x+w/2,y-h-11,4,4,'#27ae60');
  }},
  desk:{n:'Computer',w:96,h:80,c:'#5d4037',act:'type',draw(x,y,w,h,c,it,T){
    R(x+4,y-44,6,44,shade(c,-25));RR(x+w-36,y-40,30,40,3,shade(c,-10));R(x+w-25,y-28,8,3,'#ddd');
    RR(x,y-46,w,7,2,c);
    R(x+40,y-52,6,6,'#444');R(x+18,y-49,42,3,'#555');
    RR(x+18,y-h,48,30,3,'#222');
    R(x+21,y-h+3,42,24,it&&it.on?`hsl(${(T*40)%360|0},60%,55%)`:'#4aa3df');
    R(x+25,y-h+8,20,3,'rgba(255,255,255,.7)');R(x+25,y-h+14,30,3,'rgba(255,255,255,.5)');
  }},
  tv:{n:'TV',w:82,h:72,c:'#5d4037',act:'toggle',draw(x,y,w,h,c,it,T){
    RR(x,y-26,w,26,3,c);R(x+w/2-1,y-24,2,22,shade(c,-30));E(x+w/2-6,y-13,2,2,'#ddd');E(x+w/2+6,y-13,2,2,'#ddd');
    RR(x+5,y-h,w-10,46,3,'#111');
    if(it&&it.on){
      R(x+9,y-h+4,w-18,38,`hsl(${(T*50)%360|0},60%,45%)`);
      E(x+w/2+Math.sin(T*2)*14,y-h+20,8,8,'#ffe066');
      R(x+9,y-h+30,w-18,12,'#3fae5a');
    }else R(x+9,y-h+4,w-18,38,'#22303f');
  }},
  lamp:{n:'Lamp',w:32,h:96,c:'#f1c40f',act:'toggle',light:true,draw(x,y,w,h,c,it){
    E(x+w/2,y-3,13,4,'#555');R(x+w/2-2,y-h+28,4,h-30,'#777');
    if(it&&it.on)glow(x+w/2,y-h+30,90,.45);
    P([x+2,y-h+30,x+w-2,y-h+30,x+w-8,y-h,x+8,y-h],it&&it.on?shade(c,50):c);
  }},
  plant:{n:'Plant',w:40,h:66,c:'#d35400',act:'water',draw(x,y,w,h,c,it){
    const s=1+((it&&it.g)||0)*0.22, cx=x+w/2, by=y-26;
    for(let i=0;i<7;i++){
      const a=-Math.PI/2+(i-3)*0.42;
      X.save();X.translate(cx,by);X.rotate(a+Math.PI/2);
      E(0,-20*s,7*s,20*s,i%2?'#2e8b3a':'#3fae4a');X.restore();
    }
    if(it&&it.g>=4)for(let i=0;i<3;i++)E(cx+(i-1)*12*s,by-34*s+Math.abs(i-1)*8,5,5,['#ff6b9d','#ffd93d','#ff6b9d'][i]);
    P([x+8,y,x+w-8,y,x+w-4,y-22,x+4,y-22],c);RR(x+2,y-27,w-4,7,2,shade(c,-20));
  }},
  bookshelf:{n:'Bookshelf',w:72,h:116,c:'#8d5a3b',act:'read',draw(x,y,w,h,c){
    RR(x,y-h,w,h,3,c);R(x+5,y-h+5,w-10,h-10,shade(c,-40));
    const sh=(h-10)/3;
    for(let k=0;k<3;k++){
      const sy=y-h+5+(k+1)*sh;
      let bx=x+7;
      for(let j=0;bx<x+w-12;j++){
        const bw=6+((k*5+j*3)%4)*2, bh=sh-8-((j*7+k)%3)*5;
        R(bx,sy-3-bh,bw,bh,BOOKC[(k*3+j*5)%BOOKC.length]);bx+=bw+1;
      }
      R(x+5,sy-3,w-10,4,c);
    }
  }},
  fridge:{n:'Fridge',w:56,h:116,c:'#ecf0f1',act:'eat',draw(x,y,w,h,c){
    RR(x,y-h,w,h,7,c);R(x,y-h+42,w,3,shade(c,-40));
    RR(x+w-11,y-h+14,4,20,2,'#999');RR(x+w-11,y-h+54,4,34,2,'#999');
    E(x+12,y-h+16,4,4,'#e74c3c');E(x+20,y-h+24,4,4,'#f1c40f');R(x+9,y-h+60,14,10,'#fff');R(x+9,y-h+60,14,3,'#3498db');
  }},
  stove:{n:'Stove',w:60,h:58,c:'#dfe4ea',act:'cook',draw(x,y,w,h,c,it,T){
    RR(x,y-h,w,h,3,c);R(x,y-h,w,6,'#333');
    for(let i=0;i<3;i++)E(x+12+i*18,y-h+12,3,3,'#555');
    RR(x+8,y-h+20,w-16,28,3,'#333');
    if(it&&it.on)RR(x+11,y-h+23,w-22,22,2,`rgba(255,${130+Math.sin(T*8)*30|0},40,.85)`);
    R(x+12,y-h-12,30,12,'#7f8c8d');R(x+8,y-h-12,38,3,'#95a5a6');
  }},
  sink:{n:'Sink',w:76,h:58,c:'#ecf0f1',act:'wash',draw(x,y,w,h,c){
    RR(x,y-h+6,w,h-6,2,c);R(x+w/2-1,y-h+12,2,h-16,shade(c,-40));
    R(x+w/2-8,y-h+18,4,10,'#999');R(x+w/2+4,y-h+18,4,10,'#999');
    RR(x-2,y-h,w+4,8,2,'#b2bec3');
    R(x+w/2-2,y-h-18,4,18,'#aaa');R(x+w/2-2,y-h-18,14,4,'#aaa');
  }},
  tub:{n:'Bathtub',w:116,h:50,c:'#ffffff',act:'bath',seat:22,draw(x,y,w,h,c){
    E(x+14,y-3,6,4,'#d4a537');E(x+w-14,y-3,6,4,'#d4a537');
    RR(x,y-h+8,w,h-12,16,c);R(x-3,y-h+5,w+6,7,shade(c,-25));
    R(x+w-14,y-h-10,4,15,'#aaa');R(x+w-24,y-h-10,14,4,'#aaa');
  }},
  toilet:{n:'Toilet',w:44,h:58,c:'#ffffff',act:'sit',seat:30,draw(x,y,w,h,c){
    RR(x,y-h,18,30,4,c);RR(x+2,y-h+4,14,4,2,shade(c,-25));
    R(x+16,y-24,14,24,shade(c,-12));
    E(x+28,y-28,16,7,c);R(x+12,y-34,w-12,5,shade(c,-30));
  }},
  piano:{n:'Piano',w:96,h:82,c:'#2d3436',act:'piano',draw(x,y,w,h,c){
    R(x+5,y-10,7,10,c);R(x+w-12,y-10,7,10,c);
    RR(x,y-h,w,h-10,4,c);R(x-3,y-h,w+6,7,shade(c,30));
    R(x-4,y-44,w+8,12,shade(c,-15));
    R(x,y-44,w,7,'#fff');
    for(let i=0;i<w;i+=8)R(x+i,y-44,1,7,'#bbb');
    for(let i=4;i<w-4;i+=8)if((i/8|0)%7!==2&&(i/8|0)%7!==6)R(x+i+2,y-44,4,4,'#111');
    R(x+w/2-14,y-h+14,28,18,'#fff');R(x+w/2-11,y-h+18,22,2,'#999');R(x+w/2-11,y-h+23,22,2,'#999');
  }},
  fireplace:{n:'Fireplace',w:88,h:78,c:'#b5543c',act:'toggle',light:true,draw(x,y,w,h,c,it,T){
    RR(x,y-h,w,h,2,c);
    for(let r=0;r<6;r++)for(let k=0;k<5;k++)R(x+2+k*18+(r%2)*9,y-h+10+r*11,16,1,shade(c,-30));
    R(x-5,y-h,w+10,9,'#6d4c41');
    RR(x+18,y-h+24,w-36,h-24,[14,14,0,0],'#2b1d1a');

    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

const floorAt=wy=>Math.max(0,Math.min(S.floors-1,Math.floor(-wy/FLOOR_H)));

function box(it){
  const d=ITEMS[it.t],by=stand(it.f)-(d.wall?it.y:0);
  return {x:it.x,y:by-d.h,w:d.w,h:d.h+(d.rug?6:0),by};
}
function hit(wx,wy,pad=0){
  const order=[...S.items.filter(i=>!ITEMS[i.t].wall&&!ITEMS[i.t].rug).reverse(),
    ...S.items.filter(i=>ITEMS[i.t].wall).reverse(),...S.items.filter(i=>ITEMS[i.t].rug).reverse()];
  for(const it of order){
    if(it.f>=S.floors)continue;
    const b=box(it);
    if(wx>=b.x-pad&&wx<=b.x+b.w+pad&&wy>=b.y-pad&&wy<=b.y+b.h+pad)return it;
  }
  return null;
}
function placeAt(it,wx,wy){
  const d=ITEMS[it.t];
  it.f=floorAt(wy);
  if(d.wall){
    it.x=Math.max(WALL,Math.min(HW-WALL-d.w,wx-d.w/2));
    if(!d.ceil)it.y=Math.max(0,Math.min(INT_H-d.h,stand(it.f)-wy-d.h/2));
  }else it.x=Math.max(MINX,Math.min(MAXX-d.w,wx-d.w/2));
}

});

function routeTo(f,x,item){
  const path=[];let cf=player.f;
  while(cf<f){path.push({walk:WALL+16},{climb:1});cf++}
  while(cf>f){path.push({walk:MINX+8},{climb:-1});cf--}
  path.push({walk:x});
  if(item)path.push({use:item});
  standUp();player.path=path;
}
function playTap(wx,wy){
  if(player.climb)return;
  if(wy>40||wy<-S.floors*FLOOR_H)return;
  const it=hit(wx,wy,6);
  if(it&&ITEMS[it.t].act){
    const d=ITEMS[it.t];
    routeTo(it.f,it.x+d.w/2,it);return;
  }
  const f=floorAt(wy);
  routeTo(f,Math.max(WALL+16,Math.min(HW-WALL-16,wx)));
}

// ── Update ───────────────────────────────────────────────────────────────────
const SPEED=170;
function update(dt,T){
  const st=stand(player.f);
  if(!player.climb)player.y=st;
  player.moving=false;
  if(mode==='play'){
    let kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
    if(kx&&!player.climb){player.path=[];standUp();
      player.x=Math.max(WALL+16,Math.min(HW-WALL-16,player.x+kx*SPEED*dt));player.dir=kx;player.moving=true}
    if(player.climb){
      const c=player.climb;c.t+=dt/1.1;
      const k=Math.min(1,c.t);
      player.x=c.x0+(c.x1-c.x0)*k;player.y=c.y0+(c.y1-c.y0)*k;player.dir=Math.sign(c.x1-c.x0)||1;player.moving=true;
      if(k>=1){player.f=c.f1;player.y=stand(c.f1);player.climb=null;save()}
    }else if(player.path.length&&!kx){
      const s=player.path[0];
      if(s.walk!=null){
        const dx=s.walk-player.x;
        if(Math.abs(dx)<3){player.x=s.walk;player.path.shift()}
        else{player.x+=Math.sign(dx)*Math.min(Math.abs(dx),SPEED*dt);player.dir=Math.sign(dx);player.moving=true}
      }else if(s.climb){
        player.path.shift();
        const up=s.climb>0, f1=player.f+s.climb;
        player.climb={t:0,x0:player.x,y0:stand(player.f),x1:up?MINX+8:WALL+16,y1:stand(f1),f1};
      }else if(s.use){player.path.shift();if(S.items.includes(s.use))use(s.use)}
      if(!player.path.length)save();
    }
  }
  if(player.moving)player.walk+=dt*12;else player.walk=0;
  if(player.say&&(player.say.t-=dt)<=0)player.say=null;
  if(player.act&&player.act.kind==='sleep'&&Math.random()<dt*1.2){const b=box(player.act.it);emit('💤',b.x+30,b.y,1,16)}
  if(player.act&&player.act.kind==='bath'&&Math.random()<dt*3){const b=box(player.act.it);emit('🫧',b.x+b.w/2,b.y+10,1,16)}
  // pets wander while you play
  for(const it of S.items){
    const d=ITEMS[it.t];
    if(!d.pet)continue;
    if(it.happy>0){it.happy-=dt;it.vx=0;continue}
    if(mode!=='play'||(player.act&&player.act.it===it)){it.vx=0;continue}
    if(!it.vx&&Math.random()<dt*.3)it.vx=(Math.random()<.5?-1:1)*(it.t==='dog'?70:45);
    else if(it.vx&&Math.random()<dt*.4)it.vx=0;
    if(it.vx){
      it.x+=it.vx*dt;it.flip=it.vx<0;
      if(it.x<MINX){it.x=MINX;it.vx=-it.vx}
      if(it.x>MAXX-d.w){it.x=MAXX-d.w;it.vx=-it.vx}
    }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.y+=p.vy*dt;p.x+=p.vx*dt;if((p.life-=dt)<=0)parts.splice(i,1)}
  // camera
  const t=camTarget();
  if(!cam.init){Object.assign(cam,t);cam.init=true}
  const k=Math.min(1,dt*6);
  cam.x+=(t.x-cam.x)*k;cam.y+=(t.y-cam.y)*k;cam.s+=(t.s-cam.s)*k;cam.vy=t.vy;
}

// ── Draw ─────────────────────────────────────────────────────────────────────
const STARS=Array.from({length:70},()=>[Math.random(),Math.random()*.7,Math.random()*1.5+.5]);
function drawSky(T){
  const g=X.createLinearGradient(0,0,0,H);
  if(S.night){g.addColorStop(0,'#0b1030');g.addColorStop(1,'#2d3566')}else{g.addColorStop(0,'#7cc8ff');g.addColorStop(1,'#d9f1ff')}
  X.fillStyle=g;X.fillRect(0,0,W,H);
  if(S.night){
    for(const [sx,sy,r] of STARS){X.globalAlpha=.5+.5*Math.sin(T*2+sx*40);E(sx*W,sy*H,r,r,'#fff')}
    X.globalAlpha=1;E(W*.85,H*.17,26,26,'#fff6c8');E(W*.85+10,H*.17-6,22,22,'#151b44');
  }else{
    E(W*.12,H*.16,30,30,'#ffe066');glow(W*.12,H*.16,80,.6);
    for(let i=0;i<4;i++){
      const cx=((T*12*(1+i*.3)+i*W/3.3)%(W+200))-100, cy=H*(.12+i*.07);
      E(cx,cy,34,14,'rgba(255,255,255,.9)');E(cx+22,cy-8,22,14,'rgba(255,255,255,.9)');E(cx-20,cy-4,18,11,'rgba(255,255,255,.9)');
    }
  }
}
function drawWall(r,x,y,w,h){
  R(x,y,w,h,r.w);
  const d=shade(r.w,-18);
  X.save();X.beginPath();X.rect(x,y,w,h);X.clip();
  if(r.p===1)for(let i=x;i<x+w;i+=28)R(i,y,12,h,shade(r.w,14));
  if(r.p===2)for(let j=0,yy=y+14;yy<y+h;yy+=26,j++)for(let i=x+10+(j%2)*13;i<x+w;i+=26)E(i,yy,3.5,3.5,d);
  if(r.p===3)for(let j=0,yy=y;yy<y+h;yy+=16,j++){R(x,yy+14,w,2,d);for(let i=x+(j%2)*20;i<x+w;i+=40)R(i,yy,2,14,d)}
  if(r.p===4){R(x,y+h-60,w,60,shade(r.w,-14));R(x,y+h-62,w,4,shade(r.w,-30));for(let i=x+20;i<x+w;i+=50)R(i,y+h-52,30,44,shade(r.w,-22))}
  if(r.p===5)for(let j=0,yy=y+18;yy<y+h;yy+=34,j++)for(let i=x+14+(j%2)*20;i<x+w;i+=40){E(i-3,yy,4,4,d);E(i+3,yy,4,4,d);P([i-7,yy+1,i+7,yy+1,i,yy+9],d)}
  X.restore();
}
function drawFloor(fl,x,y,w,h){
  const F=FLOORS[fl];
  R(x,y,w,h,F.c);
  if(F.k==='wood'){for(let i=x+((y/7)%30);i<x+w;i+=34)R(i,y,2,h,shade(F.c,-30));R(x,y,w,2,shade(F.c,30))}
  if(F.k==='tile'){for(let i=x;i<x+w;i+=20)R(i,y,1.5,h,shade(F.c,-35));R(x,y,w,2,'#fff')}
  if(F.k==='check'){for(let i=0;i*14<w;i++)R(x+i*14,y+(i%2)*7,14,7,'#222')}
  if(F.k==='carpet'){R(x,y,w,3,shade(F.c,30));for(let i=x+4;i<x+w;i+=9)E(i,y+8,1.2,1.2,shade(F.c,-25))}
  R(x,y+h-3,w,3,shade(F.c,-45));
}
function drawItem(it,T){
  const d=ITEMS[it.t],b=box(it);
  X.save();
  if(it.flip){X.translate(b.x*2+d.w,0);X.scale(-1,1)}
  d.draw(b.x,b.by,d.w,d.h,it.c,it,T);
  X.restore();
}
function drawHouse(T){
  const nF=S.floors, top=-nF*FLOOR_H;
  // lawn, path, sign
  R(-3000,0,HW+6000,900,'#7ec850');R(-3000,0,HW+6000,6,'#5fae3a');
  for(let i=-30;i<HW+40;i+=26)P([i,2,i+5,-8,i+10,2],'#5fae3a');
  E(-70,-60,40,46,'#3fa048');R(-76,-20,12,20,'#7b4a2b');E(-82,-80,26,26,'#4cb556');
  E(HW+70,-40,30,32,'#3fa048');R(HW+66,-12,9,12,'#7b4a2b');
  if(S.name){
    R(HW+130,-44,5,44,'#7b4a2b');RR(HW+108,-78,50,34,4,'#fff3d6');
    X.fillStyle='#5a3418';X.font='bold 11px system-ui';X.textAlign='center';
    X.fillText(S.name.slice(0,12)+"'s",HW+133,-63);X.fillText('House',HW+133,-50);
  }
  // roof + chimney
  R(HW*.72,top-150,34,90,shade(S.roof,-30));R(HW*.72-4,top-156,42,10,shade(S.roof,-45));
  if(S.items.some(i=>i.t==='fireplace'&&i.on))for(let i=0;i<3;i++){const s=(T*.5+i/3)%1;E(HW*.72+17+Math.sin(T+i)*8,top-170-s*80,8+s*14,6+s*10,`rgba(220,220,220,${.6-s*.6})`)}
  P([-36,top+4,HW+36,top+4,HW/2,top-150],S.roof);
  P([-36,top+4,HW+36,top+4,HW+26,top-6,-26,top-6],shade(S.roof,-30));
  // rooms
  for(let f=0;f<nF;f++){
    const yB=-f*FLOOR_H, yT=yB-FLOOR_H;
    for(let r=0;r<ROOMS;r++){
      const room=S.rooms[f*ROOMS+r];
      drawWall(room,r*ROOM_W,yT,ROOM_W,INT_H);
      drawFloor(room.fl,r*ROOM_W,yB-SLAB,ROOM_W,SLAB);
    }
    // hole for the stairs from below
    if(f>0){R(WALL,yB-SLAB,STAIR_W,SLAB,'rgba(0,0,0,.25)')}
    // dividing walls with doorways
    for(let r=1;r<ROOMS;r++){
      const wx=r*ROOM_W;
      R(wx-5,yT,10,INT_H-DOOR_H,S.side);R(wx-5,yT,10,INT_H-DOOR_H,'rgba(0,0,0,.08)');
      R(wx-9,yT+INT_H-DOOR_H-4,18,6,shade(S.side,-35));
    }
    // stairs up to the next floor
    if(f<nF-1){
      const sx=WALL+8, sy=stand(f), ex=MINX, ey=stand(f+1), n=10;
      for(let i=0;i<n;i++){
        const x0=sx+(ex-sx)*i/n, y0=sy+(ey-sy)*(i+1)/n;
        R(x0,y0,(ex-sx)/n+6,sy-y0,'#a1714b');R(x0,y0,(ex-sx)/n+6,3,'#7b4a2b');
      }
      L(sx,sy-40,ex,ey-40,'#5d4037',4);
      for(let i=0;i<=4;i++){const px=sx+(ex-sx)*i/4,py=sy+(ey-sy)*i/4;L(px,py,px,py-40,'#5d4037',2.5)}
    }
  }
  // outer walls
  R(0,top,WALL,-top,S.side);R(HW-WALL,top,WALL,-top,S.side);
  R(0,top,WALL,-top,'rgba(0,0,0,.1)');R(HW-WALL,top,WALL,-top,'rgba(0,0,0,.1)');
  R(-8,top-6,HW+16,8,shade(S.side,-25));
  R(-6,-6,HW+12,8,'#8e8e8e');
}
function inPlayer(it){return player.act&&player.act.it===it}
function drawPlayerAt(T){
  const a=player.act, o={dir:player.dir,walk:player.walk,T,pose:'stand'};
  if(a&&a.kind==='sleep'){
    const it=a.it,d=ITEMS[it.t],b=box(it);
    X.save();
    if(it.flip){X.translate(b.x*2+d.w,0);X.scale(-1,1)}
    X.translate(b.x+104,b.by-46);X.rotate(-Math.PI/2);
    drawPlayer(S.look,0,0,{...o,pose:'sleep'});
    X.restore();
    X.save();if(it.flip){X.translate(b.x*2+d.w,0);X.scale(-1,1)}
    RR(b.x+38,b.by-44,d.w-48,24,6,it.c);R(b.x+38,b.by-44,d.w-48,5,shade(it.c,35));R(b.x+d.w-10,b.by-40,10,40,'#8d5a3b');
    X.restore();
    return;
  }
  if(a&&(a.kind==='sit'||a.kind==='bath')&&!a.noSeat){
    const d=ITEMS[a.it.t],b=box(a.it);
    const sx=b.x+d.w/2+(a.it.t==='toilet'?(a.it.flip?-6:6):0);
    drawPlayer(S.look,sx,b.by-d.seat+16,{...o,pose:'sit',dir:1});
    if(a.kind==='bath'){drawItem(a.it,T);for(let i=0;i<6;i++)E(b.x+16+i*16,b.by-d.h+8+Math.sin(T*3+i)*2,10,7,'rgba(255,255,255,.95)')}
    return;
  }
  if(a&&a.noSeat){const b=box(a.it);drawPlayer(S.look,b.x+ITEMS[a.it.t].w/2,b.by,{...o,dir:1});return}
  drawPlayer(S.look,player.x,player.y,o);
}
function nightShade(T){
  if(!S.night)return;
  for(let f=0;f<S.floors;f++)for(let r=0;r<ROOMS;r++){
    const on=S.items.filter(i=>i.f===f&&i.on&&roomAt(i.x+ITEMS[i.t].w/2)===r);
    const a=on.some(i=>ITEMS[i.t].light)?.12:on.some(i=>i.t==='tv'||i.t==='desk')?.38:.6;  // lights, then screens, light a room
    R(r*ROOM_W,-(f+1)*FLOOR_H,ROOM_W,FLOOR_H,`rgba(12,14,48,${a})`);
  }
}
function drawBubble(txt,x,y){
  X.font='bold 13px system-ui';
  const w=Math.min(X.measureText(txt).width+18,260);
  RR(x-w/2,y-30,w,24,10,'#fff');P([x-6,y-7,x+6,y-7,x,y+1],'#fff');
  X.fillStyle='#333';X.textAlign='center';X.textBaseline='middle';X.fillText(txt,x,y-18,w-12);X.textBaseline='alphabetic';
}
function draw(T){
  const dp=devicePixelRatio||1;
  ctx.setTransform(dp,0,0,dp,0,0);
  X=ctx;
  drawSky(T);
  X.save();
  X.translate(W/2,cam.vy);X.scale(cam.s,cam.s);X.translate(-cam.x,-cam.y);
  drawHouse(T);
  const vis=S.items.filter(i=>i.f<S.floors);
  for(const it of vis)if(ITEMS[it.t].rug)drawItem(it,T);
  for(const it of vis)if(ITEMS[it.t].wall)drawItem(it,T);
  for(const it of vis)if(!ITEMS[it.t].wall&&!ITEMS[it.t].rug&&!(inPlayer(it)&&player.act.kind==='bath'))drawItem(it,T);
  drawPlayerAt(T);
  nightShade(T);
  // selection outline
  if(mode==='build'&&selected){
    const b=box(selected);
    X.strokeStyle='#ffcf4a';X.lineWidth=3/cam.s;X.setLineDash([8/cam.s,5/cam.s]);
    X.strokeRect(b.x-4,b.y-4,b.w+8,b.h+8);X.setLineDash([]);
  }
  // tap target on the floor
  if(mode==='play'&&player.path.length){
    const last=[...player.path].reverse().find(s=>s.walk!=null);
    if(last){
      let ff=player.f;for(const s of player.path)if(s.climb)ff+=s.climb;
      E(last.walk,stand(ff)+2,12,4,'rgba(255,207,74,.7)');
    }
  }
  for(const p of parts){X.globalAlpha=Math.min(1,p.life);X.font=p.size+'px sans-serif';X.textAlign='center';X.fillText(p.txt,p.x,p.y)}
  X.globalAlpha=1;
  X.restore();
  // name tag + speech in screen space so they stay readable when zoomed out
  const [sx,sy]=toScreen(player.x,player.y-(player.act&&player.act.kind==='sleep'?40:(player.act&&player.act.kind!=='stand'?80:100)));
  if(player.act&&player.act.kind!=='stand'&&!player.act.noSeat){
    const b=box(player.act.it);const [bx,by]=toScreen(b.x+b.w/2,b.y-24);
    if(player.say)drawBubble(player.say.txt,bx,by);
  }else if(player.say)drawBubble(player.say.txt,sx,sy);
  else if(mode==='play'&&S.name){
    X.font='bold 12px system-ui';const w=X.measureText(S.name).width+12;
    RR(sx-w/2,sy-14,w,18,8,'rgba(40,30,70,.7)');X.fillStyle='#fff';X.textAlign='center';X.fillText(S.name,sx,sy-1);
  }
  // selected-item toolbar
  if(mode==='build'&&selected&&!drag){
    const b=box(selected);const [tx,ty]=toScreen(b.x+b.w/2,b.y-6);
    selEl.style.display='flex';
    const w=selEl.offsetWidth||190;
    selEl.style.left=Math.max(6,Math.min(W-w-6,tx-w/2))+'px';
    selEl.style.top=Math.max(56,ty-56)+'px';
  }else selEl.style.display='none';
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const T=now/1000;
  update(dt,T);
  if(mode==='me')drawPreview(T);
  else draw(T);
  requestAnimationFrame(frame);
}
setMode(loaded?'play':'me');
if(!loaded)toast('Welcome! First, make your player',3000);
requestAnimationFrame(frame);
</script>
