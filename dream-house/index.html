<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dream House</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#9fd8ff;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
button{font:inherit;cursor:pointer;border:none}
#top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:rgba(40,30,70,.82);color:#fff;z-index:5}
#top a{color:#fff;text-decoration:none;font-size:22px;padding:0 6px}
#top .title{font-weight:800;font-size:17px;margin-right:auto;white-space:nowrap}
.mode{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700;white-space:nowrap}
@media (max-width:520px){#top .title{display:none}#top{justify-content:flex-end}#top a{margin-right:auto}}
#zoom{position:fixed;right:10px;display:none;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:44px;height:44px;border-radius:12px;background:rgba(40,30,70,.85);color:#fff;font-size:24px;font-weight:800}
.mode.on{background:#ffcf4a;color:#3a2a00}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(40,30,70,.9);z-index:5;display:none}
#tabs{display:flex;gap:4px;padding:6px 8px 0}
.tab{background:transparent;color:#cbbff0;padding:6px 12px;border-radius:9px 9px 0 0;font-weight:700;font-size:14px}
.tab.on{background:rgba(255,255,255,.14);color:#fff}
#tray{display:flex;gap:7px;overflow-x:auto;padding:8px;background:rgba(255,255,255,.14);height:92px;align-items:center;
  touch-action:pan-x;scrollbar-width:thin}
.cat{flex:0 0 auto;width:66px;height:76px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11px;line-height:1.05;text-align:center;color:#333;font-weight:700;border:3px solid transparent}
.cat.on{border-color:#ffcf4a}
.cat canvas{width:56px;height:52px}
.sw{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:3px solid rgba(255,255,255,.4)}
.sw.on{border-color:#ffcf4a}
.pat{flex:0 0 auto;height:44px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.9);color:#333;font-weight:700;font-size:13px;border:3px solid transparent}
.pat.on{border-color:#ffcf4a}
.lbl{flex:0 0 auto;color:#fff;font-size:12px;font-weight:700;opacity:.8;padding:0 2px}
.big{flex:0 0 auto;height:48px;padding:0 14px;border-radius:10px;background:#ffcf4a;color:#3a2a00;font-weight:800;font-size:14px}
.big.red{background:#ff7b7b;color:#400}
#sel{position:fixed;display:none;z-index:6;gap:4px;background:rgba(40,30,70,.92);padding:5px;border-radius:12px}
#sel button{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.15);font-size:20px;color:#fff}
#nbBtns{position:fixed;right:12px;bottom:20px;z-index:5;display:none}
#nbBtns button{height:52px;padding:0 16px;border-radius:16px;background:rgba(40,30,70,.88);color:#fff;font-weight:800;font-size:16px}
#visitTag{position:fixed;left:12px;bottom:28px;max-width:calc(100vw - 170px);overflow:hidden;text-overflow:ellipsis;z-index:4;background:#ffcf4a;color:#3a2a00;font-weight:800;
  font-size:14px;padding:6px 14px;border-radius:12px;display:none;white-space:nowrap}
#snow{position:fixed;inset:0;z-index:8;background:rgba(20,30,60,.5);display:none;align-items:center;justify-content:center;padding:16px}
#snow .modalIn{background:#f2f8ff;border-radius:20px;padding:16px;width:min(400px,100%);max-height:88vh;overflow-y:auto;touch-action:pan-y;text-align:center}
#snow h2{color:#2c4a7a;margin-bottom:6px}
#snowC{margin:0 auto;width:180px;height:200px;background:linear-gradient(#cfe6ff,#f6fbff);border-radius:16px}
#snowStep{color:#2c4a7a;font-weight:700;margin:8px 0}
#snowOpts .row{margin-bottom:8px;text-align:left}
#snowOpts b{display:block;color:#2c4a7a;font-size:13px;margin-bottom:4px}
#snowOpts .ch{display:flex;gap:6px;flex-wrap:wrap}
.snowBtns{display:flex;gap:8px;justify-content:center;margin-top:8px}
#farm{position:fixed;inset:0;z-index:8;background:rgba(20,40,20,.45);display:none;align-items:center;justify-content:center;padding:16px}
#farm .modalIn{background:#f4fff0;border-radius:20px;padding:16px;width:min(420px,100%);max-height:85vh;overflow-y:auto;touch-action:pan-y}
#farm h2{color:#2e6b34;margin-bottom:8px}
#farmAll{display:flex;gap:8px;margin-bottom:8px}
#farmAll .big{height:40px;font-size:13px;padding:0 12px}
.bed{background:#e3f5dc;border-radius:12px;padding:10px;margin-bottom:8px;color:#2e6b34;font-weight:700}
.bed .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bed .emo{font-size:28px}
.bed .what{flex:1;min-width:120px}
.bed small{display:block;font-weight:600;color:#5f8f62}
.seed.off{opacity:.3}
.seed{width:44px;height:44px;border-radius:10px;background:#fff;font-size:22px;border:2px solid #cfe8c7}
.grow{height:8px;border-radius:4px;background:#cfe8c7;margin-top:6px;overflow:hidden}
.grow i{display:block;height:100%;background:#5cb85c}
#choose{position:fixed;inset:0;z-index:8;background:rgba(20,15,40,.6);display:none;align-items:center;justify-content:center;padding:16px}
#choose .modalIn{background:#fff;border-radius:20px;padding:18px;width:min(360px,100%)}
#choose h2{color:#4a2a7a;margin-bottom:12px}
#chB{display:flex;flex-direction:column;gap:8px}
#nb{position:fixed;inset:0;z-index:8;background:rgba(20,15,40,.6);display:none;align-items:center;justify-content:center;padding:16px}
#nbIn{background:#fff;border-radius:20px;padding:16px;width:min(420px,100%);max-height:80vh;overflow-y:auto;touch-action:pan-y}
#nbIn h2{color:#4a2a7a;margin-bottom:10px}
.nbRow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#f3ecff;margin-bottom:8px}
.nbRow .who{flex:1;color:#4a2a7a;font-weight:800}
.nbRow .who small{display:block;font-weight:600;color:#7a6a9a}
.nbBtns2{display:flex;flex-direction:column;gap:6px}
.nbBtns2 .big{height:40px;padding:0 14px}
.big.alt{background:#cbbff0;color:#2a1a50}
.big.ring{background:#ff8fb8;color:#4a0020}
.nbNote{color:#7a6a9a;font-size:13px;margin:4px 2px 10px}
#goals{position:fixed;left:8px;top:58px;z-index:4;background:rgba(40,30,70,.85);color:#fff;border-radius:12px;padding:8px 11px;
  font-size:13px;width:min(290px,calc(100vw - 16px));display:none;cursor:pointer}
#goals .hd{font-weight:800;font-size:14px;display:flex;gap:10px;align-items:center}
#goals ul{list-style:none;margin-top:6px}
#goals li{padding:2px 0}
#goals li.done{opacity:.55;text-decoration:line-through}
#goals li.later{opacity:.5}
#goals .hint{display:block;margin-left:22px;font-size:11px;color:#ffcf4a}
.cat .price{font-size:11px;color:#b07a00}
.cat.locked canvas{opacity:.4}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:rgba(40,30,70,.9);color:#fff;
  padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;
  text-align:center;max-width:90vw}
#me{position:fixed;inset:0;z-index:8;background:linear-gradient(160deg,#ffd6e8,#d6e4ff);display:none;overflow-y:auto;touch-action:pan-y}
#meIn{max-width:760px;margin:0 auto;padding:14px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#preview{background:radial-gradient(#fff,#f3e8ff);border-radius:20px;width:220px;height:300px;flex:0 0 auto;box-shadow:0 4px 18px rgba(80,40,120,.2)}
#opts{flex:1 1 300px;max-width:480px}
#opts h2{color:#4a2a7a;margin-bottom:8px}
.row{margin-bottom:10px}
.row b{display:block;color:#4a2a7a;font-size:13px;margin-bottom:4px}
.row .ch{display:flex;gap:6px;flex-wrap:wrap}
.cs{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cs.on{border-color:#4a2a7a}
.ts{padding:6px 10px;border-radius:9px;background:#fff;color:#4a2a7a;font-weight:700;font-size:13px;border:2px solid #fff}
.ts.on{border-color:#4a2a7a;background:#efe4ff}
#name{font:inherit;font-size:18px;font-weight:700;padding:7px 10px;border-radius:10px;border:2px solid #c9b3ec;width:200px;color:#4a2a7a}
#meBtns{display:flex;gap:8px;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <a href="/" title="Back to Arcade">&#8962;</a>
  <span class="title">Dream House</span>
  <button class="mode" id="mBuild">🛠 Build</button>
  <button class="mode" id="mMe">👕 Me</button>
  <button class="mode" id="mPlay">▶ Play</button>
</div>
<div id="bar">
  <div id="tabs">
    <button class="tab" data-tab="furn">Furniture</button>
    <button class="tab" data-tab="yard">Backyard</button>
    <button class="tab" data-tab="front">Front yard</button>
    <button class="tab" data-tab="walls">Walls</button>
    <button class="tab" data-tab="floors">Floors</button>
    <button class="tab" data-tab="house">House</button>
  </div>
  <div id="tray"></div>
</div>
<div id="sel">
  <button id="sColor" title="Color">🎨</button>
  <button id="sFlip" title="Flip">↔</button>
  <button id="sFront" title="Bring to front">⬆</button>
  <button id="sDel" title="Remove">🗑</button>
</div>
<div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button></div>
<div id="toast"></div>
<div id="goals"></div>
<div id="nbBtns"><button id="totBtn">🎃 Trick-or-treat</button> <button id="snowBtn">⛄ Snowman</button> <button id="nbOpen">🏘️ Neighbors</button><button id="nbHome">🏠 Go home</button></div>
<div id="visitTag"></div>
<div id="snow"><div class="modalIn"><h2>⛄ Build a snowman</h2><canvas id="snowC"></canvas><div id="snowStep"></div><div id="snowOpts"></div>
  <div class="snowBtns"><button class="big alt" id="snowCancel">Cancel</button></div></div></div>
<div id="farm"><div class="modalIn"><h2 id="farmT">🌱 Greenhouse</h2><div id="farmAll"></div><div id="farmBeds"></div><button class="big" id="farmClose">Done</button></div></div>
<div id="choose" class="modal"><div class="modalIn"><h2 id="chT"></h2><div id="chB"></div></div></div>
<div id="nb"><div id="nbIn"><h2>🏘️ Visit a neighbor</h2><div id="nbList"></div><button class="big" id="nbClose">Close</button></div></div>
<div id="me"><div id="meIn">
  <canvas id="preview"></canvas>
  <div id="opts">
    <h2>Make your player</h2>
    <div class="row"><b>Name</b><input id="name" maxlength="12" autocomplete="off"></div>
    <div id="rows"></div>
    <div id="meBtns"><button class="big" id="meRand">🎲 Random</button><button class="big" id="meDone">Done ✔</button></div>
  </div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let X=ctx;   // the context the draw helpers paint on (the game canvas, or a thumbnail)
let W,H;
function resize(){
  const d=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  cv.style.width=W+'px';cv.style.height=H+'px';
}
addEventListener('resize',resize);resize();

// ── House layout (world units; y grows downward, the ground is y=0) ───────────
const ROOM_W=320, ROOMS=3, FLOOR_H=220, SLAB=14, WALL=10, STAIR_W=80, MAX_FLOORS=3;
const HW=ROOM_W*ROOMS;            // house width
const INT_H=FLOOR_H-SLAB;          // inside height of a room
const DOOR_H=150;                  // doorways between rooms
const stand=f=>-f*FLOOR_H-SLAB;    // y the furniture and the player stand on
const MINX=WALL+STAIR_W+4, MAXX=HW-WALL;   // floor furniture stays clear of the stairs

// ── Palettes ─────────────────────────────────────────────────────────────────
const ITEMC=['#8d5a3b','#c8915a','#5d4037','#ecf0f1','#2d3436','#e74c3c','#e67e22','#f1c40f',
  '#27ae60','#16a085','#3498db','#2c3e8f','#9b59b6','#e84393','#fd79a8','#81ecec'];
const WALLC=['#fde2b5','#ffd1dc','#ffe9a8','#d4f5c4','#c6ecff','#e2d4ff','#ffffff','#f0e0d0',
  '#ffb3a7','#a8e6cf','#9ec9ff','#c9a0ff','#5d6d7e','#3d3d5c'];
const PATTERNS=['Plain','Stripes','Dots','Bricks','Panels','Hearts'];
const FLOORS=[
  {n:'Oak',c:'#c8915a',k:'wood'},{n:'Walnut',c:'#7b4a2b',k:'wood'},{n:'Pale wood',c:'#e6c79a',k:'wood'},
  {n:'White tile',c:'#eef2f5',k:'tile'},{n:'Blue tile',c:'#7fb8e6',k:'tile'},{n:'Checkers',c:'#f5f5f5',k:'check'},
  {n:'Red carpet',c:'#c0392b',k:'carpet'},{n:'Blue carpet',c:'#3d5a9e',k:'carpet'},{n:'Green carpet',c:'#4f9a5a',k:'carpet'},
  {n:'Pink carpet',c:'#f29bbd',k:'carpet'},{n:'Stone',c:'#9aa0a6',k:'tile'}];
const ROOFC=['#c0392b','#7f4f24','#2c3e50','#16a085','#8e44ad','#e67e22','#2e86de','#e84393'];
const SIDEC=['#f5e6c8','#ffffff','#d6c3a5','#b8d8e8','#f2c6c2','#cfe8c0','#9b8e7e','#5e6472'];
const BOOKC=['#e74c3c','#3498db','#f1c40f','#27ae60','#9b59b6','#e67e22','#1abc9c','#34495e'];

// ── Seasons: each lasts 3 game days ─────────────────────────────────────────
const SEASONS=[
  {n:'Spring',e:'🌸',grass:'#8fd16a',tuft:'#6fbf4f',leaf:'#5cc06a',fx:'petal'},
  {n:'Summer',e:'☀️',grass:'#7ec850',tuft:'#5fae3a',leaf:'#3fa048',fx:null},
  {n:'Fall',e:'🍂',grass:'#c2b450',tuft:'#a89a3a',leaf:'#e67e22',fx:'leaf'},
  {n:'Winter',e:'❄️',grass:'#f2f6fb',tuft:'#dfe8f2',leaf:'#eef3f8',fx:'snow'}];
const SEASON_DAYS=3;
// seasonOff shifts the calendar when you pick a season in Build mode; it carries on from there
const seasonOf=day=>SEASONS[(Math.floor(((day||1)-1)/SEASON_DAYS)+(S.seasonOff||0))%4];
const season=()=>seasonOf(S.day);
const isChristmas=(day=S.day)=>seasonOf(day).n==='Winter'&&(day-1)%SEASON_DAYS===1;
// a tree's leaves for the season: blossoms in spring, apples in summer and fall, snow in winter
function seasonTree(x,y,rx,ry){
  const se=season();
  E(x,y,rx,ry,se.leaf);E(x-rx*.3,y-ry*.35,rx*.6,ry*.55,shade(se.leaf,18));
  if(se.n==='Spring')for(let i=0;i<7;i++)E(x+Math.cos(i*2.4)*rx*.6,y+Math.sin(i*2.4)*ry*.55,3.5,3.5,'#ffb6d1');
  if(se.n==='Winter')E(x,y-ry*.55,rx*.85,ry*.35,'#fff');
}

// ── Small drawing helpers ────────────────────────────────────────────────────
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function RR(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}
function E(x,y,rx,ry,c){X.fillStyle=c;X.beginPath();X.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);X.fill()}
function P(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)X.lineTo(pts[i],pts[i+1]);X.closePath();X.fill()}
function L(x1,y1,x2,y2,c,w){X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke()}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+amt));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).slice(1);
}
function glow(x,y,r,a){
  const g=X.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,226,150,${a})`);g.addColorStop(1,'rgba(255,226,150,0)');
  X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);
}
function star(x,y,r,c){
  const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  P(p,c);
}

// ── Furniture ────────────────────────────────────────────────────────────────
// Each draw function paints the item with its bottom-left corner at (x,y).
const ITEMS={
  crib:{n:'Crib',w:72,h:64,c:'#fd79a8',act:'crib',draw(x,y,w,h,c,it,T){
    const cx=x+w/2;
    L(cx,y-h,cx,y-h+10,'#999',1.5);L(cx-14,y-h+10,cx+14,y-h+10,'#999',1.5);
    for(const [k,col] of [[-14,'#f1c40f'],[0,'#3498db'],[14,'#e74c3c']])star(cx+k,y-h+16+Math.sin(T*2+k)*1.5,4,col);
    R(x+2,y-46,5,46,shade(c,-20));R(x+w-7,y-46,5,46,shade(c,-20));
    R(x+7,y-20,w-14,6,'#fff');
    if(!visiting)S.kids.filter(k=>S.day-k.born<2).slice(0,2).forEach((k,i)=>{   // babies asleep in the crib
      const bx=x+18+i*28;
      E(bx,y-26,7,7,SKINS[k.look.skin]);E(bx-2,y-31,5,3,HAIRC[k.look.hairC]);
      L(bx-3,y-26,bx-1,y-26,'#333',1);L(bx+2,y-26,bx+4,y-26,'#333',1);
      RR(bx+4,y-30,20,10,4,'#9ec9ff');
    });
    for(let i=0;i<8;i++)R(x+9+i*7.5,y-44,2.5,24,c);
    R(x+2,y-46,w-4,5,c);R(x+2,y-16,w-4,5,c);
  }},
  bed:{n:'Bed',w:120,h:62,c:'#3498db',act:'sleep',draw(x,y,w,h,c){
    const wood='#8d5a3b';
    RR(x,y-h,13,h,4,wood);R(x+w-10,y-40,10,40,wood);
    R(x+12,y-24,w-22,12,shade(wood,-20));
    RR(x+10,y-38,w-20,16,5,'#f7f7f7');
    E(x+30,y-41,15,7,'#fff');
    RR(x+46,y-42,w-56,22,6,c);R(x+46,y-42,w-56,5,shade(c,35));
  }},
  sofa:{n:'Sofa',w:120,h:56,c:'#e74c3c',act:'sit',seat:30,draw(x,y,w,h,c){
    R(x+8,y-6,6,6,'#4e342e');R(x+w-14,y-6,6,6,'#4e342e');
    RR(x+6,y-h,w-12,34,10,c);R(x+w/2-1,y-h+6,2,24,shade(c,-25));
    RR(x+4,y-32,w-8,24,6,shade(c,-15));
    RR(x,y-42,18,36,8,shade(c,-5));RR(x+w-18,y-42,18,36,8,shade(c,-5));
  }},
  armchair:{n:'Armchair',w:64,h:58,c:'#16a085',act:'sit',seat:30,draw(x,y,w,h,c){
    R(x+6,y-6,6,6,'#4e342e');R(x+w-12,y-6,6,6,'#4e342e');
    RR(x+6,y-h,w-12,36,10,c);RR(x+4,y-32,w-8,24,6,shade(c,-15));
    RR(x,y-42,16,36,8,shade(c,-5));RR(x+w-16,y-42,16,36,8,shade(c,-5));
  }},
  chair:{n:'Chair',w:38,h:66,c:'#c8915a',act:'sit',seat:34,draw(x,y,w,h,c){
    const d=shade(c,-30);
    R(x+4,y-32,4,32,d);R(x+w-8,y-32,4,32,d);
    RR(x,y-37,w,7,3,c);R(x+2,y-h,6,h-34,c);RR(x,y-h,w-6,8,3,c);RR(x,y-h+16,w-10,5,2,d);
  }},
  table:{n:'Table',w:96,h:44,c:'#c8915a',draw(x,y,w,h,c){

// o: {dir, walk (leg phase), pose:'stand'|'sit'|'sleep', T}
function drawPlayer(L_,x,y,o){
  const skin=SKINS[L_.skin], hc=HAIRC[L_.hairC], tc=CLOTHC[L_.topC], bc=CLOTHC[L_.bottomC], sc=CLOTHC[L_.shoeC];
  const dir=o.dir||1, sit=o.pose==='sit', legLen=sit?12:26, hip=y-legLen-4;
  const top=TOPS[L_.top], bottom=BOTTOMS[L_.bottom], hair=HAIRS[L_.hair], hat=HATS[L_.hat];
  const sw=sit?0:Math.sin(o.walk||0)*0.5;
  const ty=hip-26, hy=ty-15;   // torso top, head center
  // hair behind the head
  if(hair==='Long')RR(x-19,hy-12,38,46,13,hc);
  if(hair==='Bob')RR(x-20,hy-14,40,32,12,hc);
  if(hair==='Ponytail'){E(x-dir*19,hy+4,7,15,hc)}
  if(top==='Hoodie')E(x,ty+2,15,8,shade(tc,-25));
  // legs
  const legC=(top==='Dress'||bottom==='Skirt')?skin:bc;
  for(const s of [-1,1]){
    X.save();X.translate(x+s*5.5,hip);X.rotate(sit?0:s*sw);
    R(-3.5,0,7,legLen,legC);
    if(bottom==='Shorts'&&top!=='Dress'){R(-3.5,0,7,legLen,skin);R(-4,0,8,sit?6:11,bc)}
    if(bottom==='Pants'&&top!=='Dress')R(-4,0,8,legLen,bc);
    RR(-4.5+(dir>0?0:-2),legLen-2,11,6,3,sc);
    X.restore();
  }
  if(bottom==='Skirt'&&top!=='Dress')P([x-12,hip-4,x+12,hip-4,x+16,hip+12,x-16,hip+12],bc);
  // torso + arms
  const sleeve=(top==='Hoodie'||top==='Suit')?22:top==='T-shirt'||top==='Dress'?9:0;
  for(const s of [-1,1]){
    X.save();X.translate(x+s*12,ty+4);X.rotate(sit?s*0.25:-s*sw*0.9+s*0.12);
    R(-3,0,6,20,skin);if(sleeve)R(-3.5,0,7,sleeve,tc);E(0,21,3.8,3.8,skin);
    X.restore();
  }
  if(top==='Dress'){P([x-11,ty+10,x+11,ty+10,x+19,hip+14,x-19,hip+14],tc);RR(x-12,ty,24,16,6,tc)}
  else RR(x-12,ty,24,28,7,tc);
  if(top==='Tank top'){R(x-12,ty,6,6,skin);R(x+6,ty,6,6,skin);RR(x-12,ty+4,24,24,6,tc)}
  if(top==='Hoodie'){RR(x-7,ty+16,14,7,3,shade(tc,-20));L(x-3,ty+2,x-3,ty+10,'#fff',1.4);L(x+3,ty+2,x+3,ty+10,'#fff',1.4)}
  if(top==='Suit'){P([x-6,ty,x+6,ty,x,ty+14],'#fff');P([x-1.5,ty+4,x+1.5,ty+4,x+2.5,ty+16,x,ty+19,x-2.5,ty+16],'#c0392b')}
  if(top==='T-shirt'||top==='Tank top')R(x-12,ty+22,24,6,shade(tc,-18));
  // head
  E(x-17,hy+2,3.5,4.5,skin);E(x+17,hy+2,3.5,4.5,skin);
  E(x,hy,17,17,skin);
  const ex=dir*2, blink=o.pose==='sleep'||((o.T||0)%4)<0.12;
  for(const s of [-1,1]){
    if(blink)L(x+s*6+ex-3,hy+2,x+s*6+ex+3,hy+2,'#333',1.6);
    else{E(x+s*6+ex,hy+1,3.4,3.8,'#fff');E(x+s*6+ex+dir*.6,hy+1.5,2.2,2.6,EYEC[L_.eyeC]);E(x+s*6+ex+dir*.6-.6,hy+.4,.8,.8,'#fff')}
  }
  E(x-10+ex,hy+7,3,1.8,'rgba(255,120,140,.45)');E(x+10+ex,hy+7,3,1.8,'rgba(255,120,140,.45)');
  X.strokeStyle='#8a3b2a';X.lineWidth=1.6;X.beginPath();X.arc(x+ex,hy+6,4.5,0.15*Math.PI,0.85*Math.PI);X.stroke();
  // hair in front
  const cap=()=>{X.fillStyle=hc;X.beginPath();X.arc(x,hy-1,18,Math.PI*1.02,Math.PI*1.98);X.closePath();X.fill()};
  if(hair==='Short'){cap();P([x-17,hy-6,x-6,hy-6,x-12,hy-1],hc);P([x-8,hy-8,x+8,hy-8,x+2,hy-3],hc)}
  if(hair==='Long'||hair==='Bob'||hair==='Ponytail'){cap();RR(x-18,hy-10,5,hair==='Ponytail'?12:24,3,hc);RR(x+13,hy-10,5,hair==='Ponytail'?12:24,3,hc);P([x-14,hy-9,x+10,hy-12,x-4,hy-4],hc)}
  if(hair==='Curly'){for(let i=0;i<9;i++){const a=Math.PI+i*Math.PI/8;E(x+Math.cos(a)*16,hy-2+Math.sin(a)*16,7,7,hc)}}
  if(hair==='Spiky'){cap();for(let i=0;i<5;i++)P([x-16+i*8,hy-8,x-12+i*8,hy-27+(i%2)*4,x-8+i*8,hy-8],hc)}
  if(hair==='Buns'){cap();E(x-14,hy-15,8,8,hc);E(x+14,hy-15,8,8,hc)}
  if(hair==='Mohawk')RR(x-4,hy-28,8,22,3,hc);
  if(hair==='Bald')E(x-6,hy-9,4,2,'rgba(255,255,255,.4)');
  // hat
  const kc=CLOTHC[L_.hatC];
  if(hat==='Cap'){X.fillStyle=kc;X.beginPath();X.arc(x,hy-4,17,Math.PI,0);X.fill();RR(x+(dir>0?4:-26),hy-6,22,5,2,shade(kc,-25))}
  if(hat==='Beanie'){X.fillStyle=kc;X.beginPath();X.arc(x,hy-5,18,Math.PI,0);X.fill();R(x-18,hy-7,36,6,shade(kc,-25));E(x,hy-24,5,5,'#fff')}
  if(hat==='Crown'){P([x-13,hy-12,x+13,hy-12,x+14,hy-28,x+7,hy-20,x,hy-30,x-7,hy-20,x-14,hy-28],'#f1c40f');E(x,hy-17,2.5,2.5,'#e74c3c')}
  if(hat==='Bow'){P([x+6,hy-16,x+18,hy-24,x+18,hy-8],kc);P([x+6,hy-16,x-4,hy-25,x-4,hy-8],kc);E(x+6,hy-16,4,4,shade(kc,-25))}
  if(hat==='Top hat'){R(x-11,hy-44,22,28,kc==='#ffffff'?'#2d3436':'#222');R(x-11,hy-24,22,5,kc);R(x-19,hy-17,38,4,'#222')}
  if(hat==='Cowboy'){E(x,hy-12,27,5,kc);RR(x-11,hy-30,22,19,[8,8,0,0],kc);R(x-11,hy-16,22,3,shade(kc,-35))}
  if(hat==='Flower'){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;E(x+13+Math.cos(a)*5,hy-13+Math.sin(a)*5,4,4,kc)}E(x+13,hy-13,3,3,'#f1c40f')}
  if(hat==='Bunny ears'){for(const s of [-1,1]){E(x+s*8,hy-30,5,15,'#fff');E(x+s*8,hy-29,2.5,11,'#ffb6c9')}}
  // glasses
  const gl=GLASSES[L_.glasses];
  if(gl==='Round'){X.strokeStyle='#333';X.lineWidth=1.6;for(const s of [-1,1]){X.beginPath();X.arc(x+s*6+ex,hy+1,5,0,Math.PI*2);X.stroke()}L(x-1+ex,hy+1,x+1+ex,hy+1,'#333',1.6)}
  if(gl==='Sunglasses'){RR(x-12+ex,hy-3,10,7,3,'#111');RR(x+2+ex,hy-3,10,7,3,'#111');R(x-2+ex,hy-1,4,2,'#111')}
  if(gl==='Stars'){star(x-6+ex,hy+1,6.5,'#ff4fa3');star(x+6+ex,hy+1,6.5,'#ff4fa3')}
}

let AC=null;
function tone(freq,dur=.25,type='sine',vol=.12,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

function thumb(type){
  const d=ITEMS[type],c=document.createElement('canvas'),dp=devicePixelRatio||1;
  c.width=56*dp;c.height=52*dp;
  const g=c.getContext('2d');g.scale(dp,dp);
  const s=Math.min(48/d.w,44/(d.h+(type==='window'?10:0)),1.1);
  g.translate(28-d.w*s/2,48-(d.rug?20:0));g.scale(s,s);
  const prev=X;X=g;
  try{d.draw(0,0,d.w,d.h,d.c,{t:type,on:type==='fireplace',g:0},2)}finally{X=prev}
  return c;
}
const thumbs={};
let wallPick={w:WALLC[0],p:0};
function buildTray(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  tray.innerHTML='';
  const add=(el)=>{tray.appendChild(el);return el};
  const btn=(cls,html,fn,on)=>{const b=document.createElement('button');b.className=cls+(on?' on':'');b.innerHTML=html;b.onclick=fn;return add(b)};
  if(tab==='furn'||tab==='yard'||tab==='front'){
    for(const t of CATALOG){
      if(tab==='furn'?ITEMS[t].out:!(ITEMS[t].out||ITEMS[t].both))continue;
      const d=ITEMS[t], locked=d.price&&!S.owned.includes(t);
      const pick=()=>{tool={kind:'place',t};selected=null;buildTray();toast('Tap your house to put the '+d.n.toLowerCase()+' there')};
      const b=btn('cat'+(locked?' locked':''),'',locked?()=>buy(t,d.price,d.n,pick):pick,tool&&tool.t===t);
      b.appendChild(thumbs[t]=thumbs[t]||thumb(t));
      if(locked)b.insertAdjacentHTML('beforeend',`<span class="price">🔒 🪙${d.price}</span>`);
      else b.appendChild(document.createTextNode(d.n));
    }
  }else if(tab==='walls'){
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Paint'}));
    for(const c of WALLC){const b=btn('sw','',()=>{wallPick.w=c;tool={kind:'wall'};buildTray();toast('Tap a room to paint its walls')},tool&&wallPick.w===c);b.style.background=c}
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Pattern'}));
    PATTERNS.forEach((n,i)=>btn('pat',n,()=>{wallPick.p=i;tool={kind:'wall'};buildTray();toast('Tap a room to paint its walls')},tool&&wallPick.p===i));
  }else if(tab==='floors'){
    FLOORS.forEach((f,i)=>{
      const b=btn('sw','',()=>{tool={kind:'floor',fl:i};buildTray();toast('Tap a room to change its floor')},tool&&tool.fl===i);
      b.style.background=f.k==='check'?'repeating-conic-gradient(#222 0 25%,#f5f5f5 0 50%) 0 0/16px 16px':f.c;b.title=f.n;
    });
  }else{
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Season'}));
    SEASONS.forEach((se,i)=>btn('pat',se.e+' '+se.n,()=>{
      const block=Math.floor((S.day-1)/SEASON_DAYS);
      S.seasonOff=((i-block)%4+4)%4;save();renderGoals();buildTray();
      christmasPresents();
      toast(`${se.e} It's ${se.n.toLowerCase()} now!`+(se.n==='Winter'?' Build a snowman ⛄':se.n==='Fall'?' Pumpkins can grow 🎃':''),3000);
    },season()===se));
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Grandma'}));
    btn('pat','👵 Rampage!',()=>{
      if(visiting||away())return toast('Go home first!');
      rampageArmed=!rampageArmed;buildTray();
      toast(rampageArmed?'👵 Press ▶ Play — Grandma will start rampaging after 5 seconds!':'👵 OK, no rampage',3000);
    },rampageArmed);
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Roof'}));
    for(const c of ROOFC){const b=btn('sw','',()=>{S.roof=c;save();buildTray()},S.roof===c);b.style.background=c}
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Outside'}));
    for(const c of SIDEC){const b=btn('sw','',()=>{S.side=c;save();buildTray()},S.side===c);b.style.background=c}
    add(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Car'}));
    CARS.forEach((car,i)=>{
      const own=!car.price||S.owned.includes('car'+i), set=()=>{S.car.m=i;save();buildTray()};
      btn('pat',car.n+(own?'':' 🔒🪙'+car.price),own?set:()=>buy('car'+i,car.price,car.n,set),S.car.m===i);
    });
    const cb=btn('sw','',()=>{S.car.c=CARC[(CARC.indexOf(S.car.c)+1)%CARC.length];save();buildTray()});
    cb.style.background=S.car.c;cb.title='Car color';
    btn('big','+ Floor',()=>{if(S.floors<MAX_FLOORS){S.floors++;save();toast('New floor added!')}else toast('3 floors is the most')});
    btn('big','− Floor',()=>{
      if(S.floors<=1)return toast('You need at least one floor');
      const top=S.floors-1, n=S.items.filter(i=>i.f===top).length;
      if(n&&!confirm('Remove the top floor and its '+n+' things?'))return;
      S.items=S.items.filter(i=>i.f!==top);S.floors--;if(player.f>=S.floors){player.f=S.floors-1}save();
    });
    btn('big','✨ Starter home',()=>{
      if(S.items.length>6&&!confirm('Replace your furniture with the starter home?'))return;
      S.items=STARTER.map(([t,f,x,y])=>fill({t,f,x,y}));S.floors=Math.max(S.floors,2);save();toast('Here is a starter home — change anything!');
    });
    btn('big red','🧹 Empty house',()=>{if(confirm('Remove all furniture?')){S.items=[];save()}});
  }
}

// ── Camera ───────────────────────────────────────────────────────────────────
const cam={x:HW/2,y:-200,s:.5,init:false};
function camTarget(){
  const topY=-S.floors*FLOOR_H-160, botY=50;
  const viewTop=50, viewBot=H-(mode==='build'?bar.offsetHeight:0);
  const vh=viewBot-viewTop;
  const viewW=W<600?HW+60:HW+460;   // wide screens also show the yard and the car
  const fitS=Math.min((W-16)/viewW,vh/(botY-topY));
  if(mode==='build'&&(tab==='yard'||tab==='front')){
    const yw=tab==='yard'?YARD_W:FRONT_W, cx=tab==='yard'?YARD_L/2:(FRONT_L+FRONT_R)/2;
    const ys=Math.min((W-16)/(yw+80),vh/320)*zoom, mx=Math.max(0,(yw+80)/2-W/2/ys), my=Math.max(0,160-vh/2/ys);
    pan.x=Math.max(-mx,Math.min(mx,pan.x));pan.y=Math.max(-my,Math.min(my,pan.y));
    zoomEl.style.bottom=(H-viewBot+10)+'px';
    return {x:cx+pan.x,y:-120+pan.y,s:ys,vy:viewTop+vh/2};
  }
  if(mode==='play'){
    const s=Math.max(fitS,Math.min(vh/(FLOOR_H*2.1),W/(ROOM_W*2)));
    let x=drive?carX()+CAR_W/2:player.x, y=(drive?(away()?0:CAR_Y):player.y)-INT_H/2+10;
    const L0=inEra?-80:inTot?-100:inMine?-260:inCity||inBeach?-60:YARD_L-40, R0=inEra?ERA_W+60:inTot?TOT_W+60:inMine?MINE_W+60:inCity?CITY_W+60:inBeach?BEACH_W+60:OUT_X+90;
    const halfW=W/2/s;
    if(!drive)x=R0-L0<=halfW*2?(L0+R0)/2:Math.max(L0+halfW,Math.min(R0-halfW,x));
    return {x,y,s,vy:viewTop+vh/2};
  }
  const s=fitS*zoom, cx=W<600?HW/2:HW/2+100, mx=Math.max(0,(HW+460)/2-W/2/s), my=Math.max(0,(botY-topY)/2-vh/2/s);
  pan.x=Math.max(-mx,Math.min(mx,pan.x));pan.y=Math.max(-my,Math.min(my,pan.y));
  zoomEl.style.bottom=(H-viewBot+10)+'px';
  return {x:cx+pan.x,y:(topY+botY)/2+pan.y,s,vy:viewTop+vh/2};
}
const toScreen=(wx,wy)=>[(wx-cam.x)*cam.s+W/2,(wy-cam.y)*cam.s+cam.vy];
const toWorld=(sx,sy)=>[(sx-W/2)/cam.s+cam.x,(sy-cam.vy)/cam.s+cam.y];

// ── Geometry helpers ─────────────────────────────────────────────────────────
const floorAt=wy=>Math.max(0,Math.min(S.floors-1,Math.floor(-wy/FLOOR_H)));
const roomAt=wx=>Math.max(0,Math.min(ROOMS-1,Math.floor(wx/ROOM_W)));
const inFront=it=>it.f===0&&it.x>=FRONT_L-10;
const isOut=it=>it.f===0&&(it.x<0||it.x>=FRONT_L-10);   // in the backyard or the front yard
const FRONT_MAX=w=>FRONT_R-10-w;
function box(it){
  const d=ITEMS[it.t],by=isOut(it)?YARD_Y:stand(it.f)-(d.wall?it.y:0);
  return {x:it.x,y:by-d.h,w:d.w,h:d.h+(d.rug?6:0),by};
}
function hit(wx,wy,pad=0){
  const order=[...S.items.filter(i=>!ITEMS[i.t].wall&&!ITEMS[i.t].rug).reverse(),
    ...S.items.filter(i=>ITEMS[i.t].wall).reverse(),...S.items.filter(i=>ITEMS[i.t].rug).reverse()];
  for(const it of order){
    if(it.f>=S.floors)continue;
    const b=box(it);
    if(wx>=b.x-pad&&wx<=b.x+b.w+pad&&wy>=b.y-pad&&wy<=b.y+b.h+pad)return it;
  }
  return null;
}
function placeAt(it,wx,wy){
  const d=ITEMS[it.t];
  it.f=floorAt(wy);
  if(d.out||(d.both&&(wx<0||wx>=FRONT_L-20))){   // outdoor things go in whichever yard is nearer
    it.f=0;it.x=wx>HW?Math.max(FRONT_L+10,Math.min(FRONT_MAX(d.w),wx-d.w/2)):Math.max(YARD_L+10,Math.min(YARD_MAX(d.w),wx-d.w/2));return
  }
  if(d.wall){
    it.x=Math.max(WALL,Math.min(HW-WALL-d.w,wx-d.w/2));
    if(!d.ceil)it.y=Math.max(0,Math.min(INT_H-d.h,stand(it.f)-wy-d.h/2));
  }else it.x=Math.max(MINX,Math.min(MAXX-d.w,wx-d.w/2));
}

// ── Input ────────────────────────────────────────────────────────────────────
let downAt=null;
cv.addEventListener('pointerdown',e=>{
  if(AC&&AC.state==='suspended')AC.resume();
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  downAt={x:e.clientX,y:e.clientY};
  if(mode==='build'){
    if(tool&&tool.kind==='place'){
      const it=fill({t:tool.t,f:0,x:0});placeAt(it,wx,wy);S.items.push(it);
      selected=it;tool=null;buildTray();pop();save();
      drag={it,dx:0,dy:0};cv.setPointerCapture(e.pointerId);
      return;
    }
    if(tool&&(tool.kind==='wall'||tool.kind==='floor')){
      if(wy>0||wy<-S.floors*FLOOR_H||wx<0||wx>HW)return;
      const r=S.rooms[floorAt(wy)*ROOMS+roomAt(wx)];
      if(tool.kind==='wall'){r.w=wallPick.w;r.p=wallPick.p}else r.fl=tool.fl;
      pop();save();return;
    }
    const it=hit(wx,wy,4);
    selected=it;
    if(it){const b=box(it);drag={it,dx:wx-(b.x+b.w/2),dy:wy-(b.y+b.h/2)}}
    else drag={pan:true,sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};
    cv.setPointerCapture(e.pointerId);
    return;
  }
  if(mode==='play')playTap(wx,wy);
  if(mode==='work'&&work)workTap(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.pan){pan.x=drag.px-(e.clientX-drag.sx)/cam.s;pan.y=drag.py-(e.clientY-drag.sy)/cam.s;return}
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  placeAt(drag.it,wx-drag.dx,wy-drag.dy);
});
cv.addEventListener('pointerup',()=>{if(drag){if(!drag.pan)save();drag=null}});
cv.addEventListener('wheel',e=>{if(mode==='build'){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15))}},{passive:false});
cv.addEventListener('pointercancel',()=>{drag=null});

const keys={};
addEventListener('keydown',e=>{
  if(mode==='me'||e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(mode==='build'&&selected&&(e.code==='Delete'||e.code==='Backspace')){$('sDel').onclick();e.preventDefault()}
  if(mode==='build'&&e.code==='Escape'){selected=null;tool=null;buildTray()}
  if(mode!=='play')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(player.climb||busy())return;
  if(e.code==='ArrowUp'||e.code==='KeyW'){
    if(!inCity&&player.f<S.floors-1&&player.x>0&&player.x<MINX+40){standUp();player.path=[{walk:WALL+16},{climb:1}]}
  }
  if(e.code==='ArrowDown'||e.code==='KeyS'){
    if(!inCity&&player.f>0&&player.x>0&&player.x<MINX+40){standUp();player.path=[{walk:MINX+8},{climb:-1}]}
  }
  if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){
    if(player.act){standUp();return}
    if(player.f===0&&Math.abs(player.x-(carX()+CAR_W/2))<CAR_W/2+20)return carTapped();
    if(inMine){mineSpace();return}
    if(inTot){totSpace();return}
    if(inEra){eraSpace();return}
    if(inBeach){beachSpace();return}
    if(inCity){const sh=CITY_SPOTS().find(c=>Math.abs(player.x-c.door)<60);if(sh)cityAction(sh.id);else say('Walk up to a shop!');return}
    let best=null,bd=60;
    for(const it of S.items){
      if(it.f!==player.f)continue;
      const d=ITEMS[it.t];if(!d.act)continue;
      const dist=Math.abs(it.x+d.w/2-player.x);
      if(dist<bd){bd=dist;best=it}
    }
    if(best)use(best);else say('Nothing to use here — walk up to something!');
  }
});
addEventListener('keyup',e=>{keys[e.code]=false});

function routeTo(f,x,item){
  const path=[];let cf=player.f;
  while(cf<f){path.push({walk:WALL+16},{climb:1});cf++}
  while(cf>f){path.push({walk:MINX+8},{climb:-1});cf--}
  path.push({walk:x});
  if(item)path.push({use:item});
  standUp();player.path=path;
}
const maxX=f=>inBeach?BEACH_W-20:inEra?ERA_W-20:inTot?TOT_W-20:inMine?MINE_W-20:inCity?CITY_W-20:f===0?OUT_X:HW-WALL-16;   // only the ground floor has doors: front door to the car
const minX=f=>inMine?(mine&&mine.floor===1?-60:20):away()?20:f===0?YARD_L+20:WALL+16;  // and back door to the backyard
function playTap(wx,wy){
  if(player.climb||busy())return;
  if(inTot)return totTap(wx,wy);
  if(inEra)return eraTap(wx,wy);
  if(inMine)return mineTap(wx,wy);
  if(inCity)return cityTap(wx,wy);
  if(inBeach)return beachTap(wx,wy);
  if(wy>40||wy<-S.floors*FLOOR_H)return;
  if(wx>=CAR_X-6&&wx<=CAR_X+CAR_W+6&&wy>=CAR_Y-80&&wy<=10)return routeTo(0,CAR_X+60,'car');
  for(const n of people())
    if(Math.abs(wx-n.x)<24&&wy>npcY(n)-100*(n.scale||1)&&wy<npcY(n)+10){talkTo(n);return routeTo(n.f||0,n.x+(player.x<n.x?-44:44))}
  const it=hit(wx,wy,6);
  if(it&&ITEMS[it.t].act){
    const d=ITEMS[it.t];
    routeTo(it.f,it.x+d.w/2,it);return;
  }
  const f=wx<0?0:floorAt(wy);
  routeTo(f,Math.max(minX(f),Math.min(maxX(f),wx)));
}

function timeTravel(to){
  player.path=[];player.act=null;
  [880,660,990,550,1320].forEach((f,i)=>tone(f,.25,'sine',.06,i*.12));
  fade={t:0,dur:2.4,warp:true,mid(){
    inEra=to;guests.length=0;
    if(to){
      era={found:new Set(),creatures:ERAS[to].make().map(c=>({dir:1,walk:0,ph:Math.random()*6,...c})),
        treasures:[480,980,1400,1880].map((x,i)=>({x:x+(i*37)%60,got:false}))};
      player.f=0;player.x=TM_X+120;
    }else{   // home, out back by the time machine
      era=null;const tm=S.items.find(i=>i.t==='timemachine');
      player.f=0;player.x=tm?Math.min(-20,tm.x+ITEMS.timemachine.w+20):-200;
    }
    player.dir=1;cam.init=false;showVisitUI();
  },done(){
    if(to){say(`Whoa! ${ERAS[to].e} ${ERAS[to].n}!`,3);taskEvent('time')}else say('Back home! 🏠',2);
  }};
}
function eraTap(wx,wy){
  if(era.cars&&era.cars.some(c=>Math.abs(wx-c.x)<70&&Math.abs(wy-c.y)<45))return flyToSalvager();
  if(wx<TM_X+100&&wy>-160&&wy<10)return routeTo(0,TM_X+110,'tm');
  for(const c of era.creatures){const b=creatureBox(c);if(wx>b.x0&&wx<b.x1&&wy>b.y0&&wy<b.y1)return meetCreature(c)}
  const t=era.treasures.find(t=>!t.got&&Math.abs(wx-t.x)<34&&wy>-60&&wy<10);
  if(t)return routeTo(0,t.x,'t'+era.treasures.indexOf(t));
  routeTo(0,Math.max(20,Math.min(ERA_W-20,wx)));
}
function flyToSalvager(){

  [1200,1500,1800].forEach((f,i)=>tone(f,.08,'square',.04,i*.08));
  say('Beep beep! 🚗✨ Hop in!',2);

    saveNow();tone(220,.8,'sawtooth',.05);

}
function eraSpace(){
  if(player.x<TM_X+150)return timeMenu();

// ── Trick-or-treating (fall nights) ─────────────────────────────────────────
const TOT_W=2400;
const COSTUMES=[{id:'ghost',e:'👻',n:'Ghost'},{id:'witch',e:'🧙',n:'Witch'},{id:'pumpkin',e:'🎃',n:'Pumpkin'},
  {id:'vampire',e:'🧛',n:'Vampire'},{id:'hero',e:'🦸',n:'Superhero'},{id:'cat',e:'🐱',n:'Black cat'}];
const BONES={id:'bones',name:'Mr. Bones',c:'#5e6472',roof:'#2d3436',treat:'🍬',trick:true,
  look:{skin:0,hair:8,hairC:0,eyeC:4,top:4,topC:11,bottom:0,bottomC:11,shoeC:11,hat:5,hatC:11,glasses:0}};
const PUMPKIN_LADY={id:'pumpkinlady',name:'Pumpkin Lady',c:'#ffe9a8',roof:'#e67e22',treat:'🍩',big:true,
  look:{skin:2,hair:3,hairC:5,eyeC:2,top:2,topC:1,bottom:2,bottomC:1,shoeC:11,hat:0,hatC:0,glasses:1}};
const TREATS={rose:'🍪',max:'🍫',lily:'🍭',kai:'🍬'};
function totHouses(){   // the neighbors' houses down the street (not your spouse's — they live with you)
  const list=MADE_UP.filter(n=>!(S.spouse&&S.spouse.id===n.id)).map(n=>({id:n.id,name:n.name,c:n.side,roof:n.roof,look:n.look,treat:TREATS[n.id]}));
  list.splice(2,0,BONES);list.push(PUMPKIN_LADY);   // the spooky house partway down, the big treats at the end
  return list.map((h,i)=>({...h,x:260+i*(TOT_W-400)/list.length}));
}
$('totBtn').onclick=()=>{
  if(busy()||away()||visiting)return;
  choose('🎃 Pick your costume',COSTUMES.map(c=>[c.e+' '+c.n,()=>startTot(c.id)]));
};
function startTot(costume){
  fade={t:0,dur:1.4,mid(){
    inTot=true;guests.length=0;
    const kids=S.kids.filter(k=>S.day-k.born>=2);
    tot={candy:0,costume,houses:totHouses(),visited:new Set(),door:null,
      kids:kids.map((k,i)=>({id:'tot'+i,name:k.name,look:k.look,costume:COSTUMES[Math.random()*COSTUMES.length|0].id,family:true,
        scale:.7,x:60-i*36,dir:1,walk:0,vx:0,speed:175,minX:20,maxX:TOT_W-20,greeted:true,hi:['Trick or treat! 🎃','I want more candy!','Look at my costume!','This is the best night ever!']}))};
    player.f=0;player.x=90;player.dir=1;player.path=[];player.act=null;cam.init=false;showVisitUI();
  },done(){
    say(tot.kids.length?'Trick or treat! 🎃 Come on, kids!':'Trick or treat! 🎃',2.5);
    tot.kids.forEach((k,i)=>setTimeout(()=>{if(tot)k.say={txt:['Yay! 🍬','Trick or treat!','Candy time!'][i%3],t:2}},700+i*400));
  }};
}
function totTap(wx,wy){
  if(wx<70&&wy>-130&&wy<10)return routeTo(0,40,'home');
  const h=tot.houses.find(h=>wx>=h.x&&wx<=h.x+260&&wy>=-300&&wy<=10);
  if(h)return routeTo(0,h.x+150,'knock:'+h.id);
  routeTo(0,Math.max(20,Math.min(TOT_W-20,wx)));
}
function totSpace(){
  if(player.x<80)return totAction('home');
  const h=tot.houses.find(h=>Math.abs(player.x-(h.x+150))<60);
  if(h)totAction('knock:'+h.id);else say('Walk up to a door!');
}
function totAction(id){
  if(id==='home')return endTot();
  const h=tot.houses.find(h=>'knock:'+h.id===id);
  if(!h||tot.door)return;
  if(tot.visited.has(h.id))return say('We already got candy here!');
  tot.visited.add(h.id);
  const n=(h.big?5:2+(Math.random()*2|0))+tot.kids.length;   // a handful for you, one for each kid
  tot.door={h,t:0,n,say:h.trick?'BOO! 👻 …Ha ha, just kidding! Have some candy!':`Happy Halloween! Here you go ${h.treat}`};
  say('Trick or treat! 🎃',1.2);tot.kids.forEach(k=>k.say={txt:'Trick or treat!',t:1.2});
  tone(200,.08,'square',.06);tone(200,.08,'square',.06,.25);tone(200,.08,'square',.06,.5);   // knock knock knock
  if(tot.visited.size===1)taskEvent('tot');
}
function updateTot(dt){
  if(!inTot||!tot)return;
  tot.kids.forEach((k,i)=>{const tx=player.x-player.dir*(46+i*36);if(Math.abs(tx-k.x)>8)k.goto=tx});   // follow you
  const d=tot.door;
  if(d){
    const was=d.t;d.t+=dt;
    if(was<1&&d.t>=1){
      if(d.h.trick){tone(90,.4,'sawtooth',.07);emit('👻',d.h.x+130,-120,2,30)}
      else tone(660,.12,'triangle',.07);
    }
    if(was<1.8&&d.t>=1.8){tot.candy+=d.n;emit(d.h.treat,player.x,player.y-110,3,24);[784,988,1175].forEach((f,i)=>tone(f,.15,'triangle',.06,i*.08))}
    if(d.t>=4.5)tot.door=null;
  }
}
function endTot(){
  const n=tot.candy;
  fade={t:0,dur:1.4,mid(){
    inTot=false;tot=null;
    S.coins+=n;player.f=0;player.x=HW+40;player.dir=-1;player.path=[];cam.init=false;
    renderGoals();save();
  },done(){
    toast(n?`🍬 What a haul! You got ${n} candies   +🪙${n}`:'Home again! 🏠',4000);say(n?'So much candy! 🍬':'Home sweet home!',2.5);
  }};
}

// Each stage of growing needs one watering; plants never wilt, they just wait for water.
const CROPS={
  carrot:{e:'🥕',n:'Carrot',min:2,coins:3,seasons:['Spring','Fall','Winter']},
  strawberry:{e:'🍓',n:'Strawberry',min:6,coins:8,seasons:['Spring']},
  sunflower:{e:'🌻',n:'Sunflower',min:3,coins:4,seasons:['Summer']},
  tomato:{e:'🍅',n:'Tomato',min:4,coins:5,seasons:['Summer']},
  pumpkin:{e:'🎃',n:'Pumpkin',min:10,coins:15,seasons:['Fall']},
  cabbage:{e:'🥬',n:'Cabbage',min:3,coins:4,seasons:['Fall','Winter']}};
const inSeason=crop=>CROPS[crop].seasons.includes(season().n);
const seasonList=crop=>CROPS[crop].seasons.join(' or ');
const stageMs=p=>CROPS[p.crop].min*60000/3;
const plotsOf=it=>it.plots=it.plots||[{},{},{},{}];
function growPlots(ms){
  let changed=false;
  for(const it of myHouse().items)if(it.t==='greenhouse')for(const p of plotsOf(it)){
    if(!p.crop||!p.wet||p.stage>=3||!inSeason(p.crop))continue;   // out of season, it rests
    p.prog=(p.prog||0)+ms;
    if(p.prog>=stageMs(p)){p.stage++;p.prog=0;p.wet=false;changed=true}
  }
  return changed;
}

let drive=null, work=null;
const carX=()=>(inMine?MINE_CAR:inCity?CITY_CAR:inBeach?BEACH_CAR:CAR_X)+(drive?drive.x:0);
function startWork(){
  if(drive||work)return;

function carTapped(){

  if(visiting)return say('I should go home before I drive anywhere');
  if(away())return choose('🚗 Ready to go?',[['🏠 Drive home',()=>startDrive('home')]]);
  const opts=[];
  if(!workDone())opts.push(['🏢 Go to work',startWork]);
  opts.push(['🏙️ Drive to the city',()=>startDrive('city')]);
  opts.push(['🏖️ Drive to the beach',()=>startDrive('beach')]);
  opts.push(['⛏️ Drive to the mine',()=>startDrive('mine')]);

}
function startDrive(dest){

  standUp();player.path=[];player.f=0;player.x=carX()+60;guests.length=0;
  drive={dir:1,t:0,x:0,dest};say(dest==='city'?'To the city! 🏙️':dest==='beach'?'To the beach! 🏖️':'Heading home!',1.5);

function startJob(){
  const job=JOBS[S.look.job]||JOBS[0];
  work={job,t:0,dur:30,next:.8,targets:[],earned:0,over:false,fx:[]};
  setMode('work');
}
function goHome(){
  work=null;setMode('play');
  drive={dir:-1,t:0,x:1600};
  cam.init=false;   // start the camera on the car instead of swooping over from the work screen
}
function workTap(x,y){
  if(work.over){const b=work.btn;if(b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)goHome();return}
  let best=null,bd=52;
  for(const g of work.targets){if(g.hit)continue;const d=Math.hypot(g.x-x,g.y-y);if(d<bd){bd=d;best=g}}
  if(!best)return;
  best.hit=.001;const v=best.star?3:1;work.earned+=v;
  work.fx.push({x:best.x,y:best.y-34,txt:'+'+v,life:1});
  tone(best.star?1200:600+Math.random()*300,.08,'triangle',.09);
}
function updateTrip(dt){
  if(drive){
    drive.t+=dt;
    if(drive.dir>0){
      drive.x=360*drive.t*drive.t;
      if(drive.t>=2.3){const d=drive.dest;drive=null;if(d==='city')enterCity();else if(d==='mine')enterMine();else if(d==='beach')enterBeach();else if(d==='home')leaveAway();else startJob()}
    }else{
      const k=Math.min(1,drive.t/2.4);
      drive.x=1600*(1-k)*(1-k);
      if(k>=1&&drive.from==='away'){drive=null;player.f=0;player.x=CAR_X-16;player.dir=-1;say('Home sweet home! 🏠',2)}
      else if(k>=1){
        drive=null;player.f=0;player.x=CAR_X-16;player.dir=-1;S.night=true;
        taskEvent('work');renderGoals();
        say('Home again! Evening time 🌙',3);
      }
    }
  }
  if(mode==='work'&&work&&!work.over){
    work.t+=dt;work.next-=dt;
    const lvl=Math.min(10,S.day-1);   // a little faster each day
    if(work.next<=0){
      work.next=Math.max(.3,.8-lvl*.045)*(.7+Math.random()*.6);
      const star=Math.random()<.1;
      work.targets.push({x:60+Math.random()*(W-120),y:150+Math.random()*Math.max(60,H-330),
        e:star?'⭐':work.job.items[Math.random()*work.job.items.length|0],star,life:0,max:Math.max(1.1,2-lvl*.08),hit:0});
    }
    if(work.t>=work.dur){
      work.over=true;work.targets=[];S.coins+=work.earned;save();
      tone(523,.15,'triangle',.1);tone(659,.15,'triangle',.1,.15);tone(784,.3,'triangle',.1,.3);
    }
  }
  if(work){
    for(const g of work.targets){g.life+=dt;if(g.hit)g.hit+=dt}
    work.targets=work.targets.filter(g=>g.hit?g.hit<.6:g.life<g.max);
    for(const f of work.fx){f.life-=dt;f.y-=40*dt}
    work.fx=work.fx.filter(f=>f.life>0);
  }
  if(fade){
    fade.t+=dt;
    if(!fade.midDone&&fade.t>=fade.dur/2){fade.midDone=true;fade.mid()}
    if(fade.t>=fade.dur){const f=fade;fade=null;f.done()}
  }
}

// Go to a neighbor's house (n), or home (null). The screen fades while the houses swap.
function travel(n){
  nbEl.style.display='none';guests.length=0;
  fade={t:0,dur:1.6,mid(){
    if(n){
      const home=visiting?visiting.home:S, pos=visiting?visiting.pos:{px:player.x,pf:player.f};
      if(visiting)for(const k of PERSONAL)home[k]=S[k];
      const items=(n.items||[]).map(i=>Array.isArray(i)?{t:i[0],f:i[1],x:i[2],y:i[3],c:i[4]}:{...i}).filter(i=>ITEMS[i.t]);
      const rooms=n.rooms||[];
      S={...home,floors:Math.max(1,Math.min(MAX_FLOORS,n.floors||1)),roof:n.roof||ROOFC[0],side:n.side||SIDEC[0],
        rooms:Array.from({length:MAX_FLOORS*ROOMS},(_,i)=>({...newRoomFallback(),...rooms[i]})),
        items:items.map(i=>fill({...i,c:i.c||undefined,on:false}))};
      for(const k of PERSONAL)S[k]=home[k];
      visiting={id:n.id,name:n.name,home,pos,npc:{id:n.id,name:n.name,look:{...randomLook(),...n.look},x:HW-130,dir:-1,walk:0,vx:0,
        hi:n.hi||[`Hi ${home.name||'there'}! Welcome to my house!`,'Make yourself at home!','Want to see my backyard?'],greeted:false,say:null}};
    }else{
      const home=visiting.home;for(const k of PERSONAL)home[k]=S[k];
      S=home;visiting=null;
    }
    player.f=0;player.x=FRONT_L-10;player.dir=-1;player.path=[];player.act=null;player.climb=null;
    cam.init=false;showVisitUI();renderGoals();
    if(!visiting)save();
  },done(){
    if(visiting){say('Knock knock! 🚪',2);taskEvent('visit');addHeart(visiting.id,'meet')}else say('Home sweet home! 🏠',2);
  }};
}

async function checkVisits(){
  if(!MY_ID||visiting||away()||mode!=='play'||drive||work||fade)return;
  try{
    const v=await (await fetch('/houses/'+MY_ID+'/visits',{cache:'no-store'})).json();

  }catch(e){}

function updateNpc(n,dt){
  if(n.say&&(n.say.t-=dt)<=0)n.say=null;
  if(n.rampage>0)return updateRampage(n,dt);
  if(n.climb)return npcClimb(n,dt,.9);
  if(n.goto!=null&&n.f>0){   // upstairs and leaving: down the stairs first
    const dx=MINX+8-n.x;
    if(Math.abs(dx)<4){n.x=MINX+8;n.climb=stairsDown(n)}
    else{n.x+=Math.sign(dx)*Math.min(Math.abs(dx),(n.speed||90)*dt);n.dir=Math.sign(dx);n.walk+=dt*12}
    return;
  }
  if(n.life!=null&&!n.leaving&&(n.life-=dt)<=0){n.leaving=true;n.goto=OUT_X+80;n.say={txt:'Bye! Thanks for having me! 👋',t:3}}
  if(n.goto!=null){   // walking in the front door, or out to leave
    const dx=n.goto-n.x;
    if(Math.abs(dx)<3){n.goto=null;n.walk=0;if(n.leaving)n.gone=true}
    else{n.x+=Math.sign(dx)*Math.min(Math.abs(dx),(n.speed||90)*dt);n.dir=Math.sign(dx);n.walk+=dt*12}
    return;
  }
  if(n.rampT!=null&&(n.rampT-=dt)<=0){n.rampT=null;return startRampage(n)}
  const near=player.f===(n.f||0)&&Math.abs(player.x-n.x)<110;
  if(near&&!n.greeted&&player.x<HW){n.greeted=true;n.say={txt:`Hi ${S.name||'there'}! Come on in!`,t:3}}
  if(near||n.say){n.vx=0;n.dir=player.x<n.x?-1:1}
  else if(!n.vx&&Math.random()<dt*.25)n.vx=(Math.random()<.5?-1:1)*60;
  else if(n.vx&&Math.random()<dt*.35)n.vx=0;
  if(n.vx){
    n.x+=n.vx*dt;n.dir=Math.sign(n.vx);n.walk+=dt*12;
    const lo=n.minX??MINX+20, hi=n.maxX??HW-WALL-20;   // townspeople walk the whole street
    if(n.x<lo){n.x=lo;n.vx=-n.vx}
    if(n.x>hi){n.x=hi;n.vx=-n.vx}
  }else n.walk=0;
}

function grandmaStillHere(){
  for(const it of S.items)if(canTip(it)&&!it.tip&&Math.random()<.75)it.tip=(Math.random()<.5?-1:1)*(.4+Math.random()*.9);
  const g=newGrandma();
  guests.push(g);save();
  startRampage(g,"😱 While you were out, Grandma trashed your house — and she's STILL rampaging! Tap her to calm her down!");
}
function calmGrandma(n,e){
  n.rampage=0;n.hop=0;n.vx=0;n.life=20;
  n.say={txt:{'🍵':'Ahh, tea. Much better! 😌','🤗':'Aww, I love you, sweetie! 💕','🧶':'Ooh, knitting! So relaxing…'}[e],t:3.5};
  emit(e,n.x,npcY(n)-120,2,28);emit('💕',n.x,npcY(n)-130,3);
  S.coins+=5;renderGoals();save();tidyUp();taskEvent('family');
  [523,659,784].forEach((f,i)=>tone(f,.2,'sine',.08,i*.12));
  setTimeout(()=>toast('👵 Grandma calmed down! She helped tidy up and gave you 🪙5 for being so sweet 💕',4000),900);
}
// Guests can take the stairs too, the same way you do: up from WALL+16, down from MINX+8.
const stairsUp=n=>({t:0,x0:WALL+16,y0:stand(n.f||0),x1:MINX+8,y1:stand((n.f||0)+1),f1:(n.f||0)+1});
const stairsDown=n=>({t:0,x0:MINX+8,y0:stand(n.f),x1:WALL+16,y1:stand(n.f-1),f1:n.f-1});
function npcClimb(n,dt,dur){
  const c=n.climb, k=Math.min(1,c.t+=dt/dur);
  n.x=c.x0+(c.x1-c.x0)*k;n.cy=c.y0+(c.y1-c.y0)*k;n.dir=Math.sign(c.x1-c.x0)||1;n.walk+=dt*(dur<1?25:12);
  if(k>=1){n.f=c.f1;n.climb=null;n.cy=null}
}
function updateRampage(n,dt){
  n.rampage-=dt;
  if(n.climb){n.hop=0;npcClimb(n,dt,.5);if(!n.climb)n.vx=340}   // stomping up or down the stairs
  else{
    n.walk+=dt*25;n.hop=Math.abs(Math.sin(n.walk*.5))*26;
    n.x+=n.vx*dt;
    const f=n.f||0;
    if(n.vx<0&&n.x<MINX+20){   // at the stairs: always up from the ground floor, then up or down
      if(n.plan==null)n.plan=f<S.floors-1&&(f===0||Math.random()<.5)?1:f>0?-1:0;
      if(n.plan===1){if(n.x<=WALL+16){n.x=WALL+16;n.climb=stairsUp(n);n.plan=null}}
      else if(n.plan===-1){n.x=MINX+8;n.climb=stairsDown(n);n.plan=null}
      else{n.x=MINX+20;n.vx=340;n.plan=null}
    }
    if(n.x>HW-WALL-20){n.x=HW-WALL-20;n.vx=-Math.abs(n.vx)}
    n.dir=Math.sign(n.vx);
    for(const it of S.items)if(it.f===f&&!it.tip&&canTip(it)&&Math.abs(it.x+ITEMS[it.t].w/2-n.x)<24){
      it.tip=(Math.random()<.5?-1:1)*(.4+Math.random()*.9);
      emit('💥',it.x+ITEMS[it.t].w/2,stand(f)-40,1,24);tone(90+Math.random()*60,.15,'sawtooth',.06);
    }
  }
  if(!n.say&&Math.random()<dt*.8)n.say={txt:RAMPAGE_LINES[Math.random()*RAMPAGE_LINES.length|0],t:1.6};
  if(n.rampage<=0){n.rampage=0;n.hop=0;n.vx=0;n.life=6;n.say={txt:'Phew! I need a nap… 😴',t:3};tidyUp()}
}

// ── The beach ────────────────────────────────────────────────────────────────
// Sand on the left, the sea on the right. Walk out into the water to go swimming.
const BEACH_W=2400, BEACH_CAR=40, SHORE=1150, TOWEL_X=360, CASTLE_X=660, TOWER_X=1010;
const seaDepth=x=>Math.max(0,Math.min(46,(x-SHORE)*.25));   // the sea floor slopes down from the shore
const swimming=()=>inBeach&&player.x>SHORE+60;
const BEACH_LINES=['Surf\'s up! 🏄','The water is so nice!','Watch out for crabs! 🦀','I found a shell! 🐚','Did you see the dolphin? 🐬','Sandcastle contest? 🏰'];
function enterBeach(){
  fade={t:0,dur:1.2,mid(){
    inBeach=true;player.f=0;player.x=BEACH_CAR+CAR_W+40;player.dir=1;player.path=[];cam.init=false;
    const r=Math.random, folk=[...TOWN_NAMES].sort(()=>r()-.5).slice(0,2).map((name,i)=>({id:'town-'+name,name,look:randomLook(),
      x:480+i*380,dir:1,walk:0,vx:0,greeted:true,minX:80,maxX:SHORE-40,hi:BEACH_LINES}));
    for(const p of homePeople())folk.push({...p,x:300+r()*600,vx:0,minX:80,maxX:SHORE-40});   // the family comes too
    beach={folk,castle:0,sun:0,swam:false,shells:[...Array(5)].map((_,i)=>({x:280+i*170+r()*80,got:false})),
      ball:{x:1700,vx:0,spin:0},crab:{x:900,vx:30},dol:{t:0,x:1900}};
    showVisitUI();
  },done(){say('The beach! 🏖️ Walk into the water to swim',3);}};
}
function beachTap(wx,wy){
  if(wx>=carX()-6&&wx<=carX()+CAR_W+6&&wy>=-80&&wy<=10)return routeTo(0,BEACH_CAR+60,'car');
  for(const n of beach.folk)if(Math.abs(wx-n.x)<24&&wy>-100&&wy<10){talkTo(n);return routeTo(0,n.x+(player.x<n.x?-44:44))}
  if(beach.fish&&beach.fish.some(f=>Math.abs(wx-f.x)<40&&Math.abs(wy-f.y)<30))return goFishing();
  const i=beach.shells.findIndex(s=>!s.got&&Math.abs(wx-s.x)<30&&wy>-40&&wy<10);
  if(i>=0)return routeTo(0,beach.shells[i].x,'s'+i);
  if(Math.abs(wx-beach.crab.x)<30&&wy>-40&&wy<10)return routeTo(0,beach.crab.x-30,'crab');
  if(Math.abs(wx-TOWEL_X)<90&&wy>-170&&wy<10)return routeTo(0,TOWEL_X,'towel');
  if(Math.abs(wx-CASTLE_X)<70&&wy>-120&&wy<10)return routeTo(0,CASTLE_X-50,'castle');
  routeTo(0,Math.max(20,Math.min(BEACH_W-20,wx)));   // the beach ball gets pushed when you swim into it
}
function goFishing(){
  if(busy())return;
  tone(880,.08,'sine',.06);tone(1100,.1,'sine',.06,.08);
  say('A fish! 🐟',2);
  choose('🐟 You found a fish!',[['🎣 Go play Fish-Off',()=>{
    saveNow();
    fade={t:0,dur:1.2,mid(){location.href='/fish-off/'},done(){}};
  }]]);
}
function beachSpace(){
  const i=beach.shells.findIndex(s=>!s.got&&Math.abs(player.x-s.x)<40);
  if(i>=0)return beachAction('s'+i);
  if(Math.abs(player.x-beach.crab.x)<50)return beachAction('crab');
  if(Math.abs(player.x-TOWEL_X)<70)return beachAction('towel');
  if(Math.abs(player.x-CASTLE_X)<90)return beachAction('castle');
  if(swimming()){emit('💦',player.x,-30,3);say('Splash! 💦',1.5)}else say("Let's go swimming! 🌊 The water is that way →");
}
function beachAction(id){
  if(busy())return;
  if(id==='towel'){
    player.x=TOWEL_X;beach.sun=5;taskEvent('relax');
    return say(S.night?'Look at all the stars ✨':'Ahh, sunshine ☀️😎',3);
  }
  if(id==='crab'){beach.crab.vx=(player.x<beach.crab.x?1:-1)*90;tone(1500,.05,'square',.04);tone(1200,.05,'square',.04,.08);return say('Snip snip! 🦀',2)}
  if(id==='castle'){
    player.dir=1;
    if(beach.castle>=4)return say('My sandcastle is the best! 🏰',2);
    beach.castle++;emit('✨',CASTLE_X,-60,2);tone(500+beach.castle*120,.12,'triangle',.07);
    if(beach.castle<4)return say(['Pat pat pat…','Now some towers!','Almost done!'][beach.castle-1],2);
    S.coins+=3;renderGoals();save();emit('+3 🪙',CASTLE_X,-120,1,16);[659,784,988,1319].forEach((f,i)=>tone(f,.15,'triangle',.07,i*.1));
    return say('My sandcastle is done! 🏰',2.5);
  }
  const s=beach.shells[+id.slice(1)];

// A dark tunnel with rocks to mine and monsters to fight. 12 hits and you wake up in bed.
const MINE_W=3200, MINE_CAR=-200, MAX_HITS=12, SAFE_X=260;   // monsters stay out of the entrance
const ROCKS={stone:{c:'#7f8c8d',coins:1,fx:'🪨'},copper:{c:'#e67e22',coins:2,fx:'🟠'},gold:{c:'#f1c40f',coins:4,fx:'✨'},gem:{c:'#5ef2ff',coins:8,fx:'💎'}};
const MONSTERS={
  slime:{hp:2,speed:45,w:26,see:420},
  bat:{hp:1,speed:85,w:20,see:520},
  spider:{hp:3,speed:65,w:26,see:380},

function mineFloor(floor){
  const r=()=>Math.random(), monsters=[], rocks=[];
  const kinds=floor===1?['slime','slime','bat']:['slime','bat','spider','spider'];
  for(let i=0;i<5+floor*2;i++){const t=kinds[r()*kinds.length|0];monsters.push({t,x:SAFE_X+200+r()*(MINE_W-SAFE_X-400),hp:MONSTERS[t].hp,vx:0,ph:r()*6,hurt:0,dead:0})}
  for(let x=SAFE_X+60;x<MINE_W-200;x+=150+r()*120){
    const roll=r()+floor*.08;
    rocks.push({x,kind:roll>1.02?'gem':roll>.85?'gold':roll>.55?'copper':'stone',hp:3,shake:0});
  }
  return {floor,monsters,rocks};
}
function enterMine(){

}

const ladderDown=()=>MINE_W-140, ladderUp=()=>mine&&mine.floor>1?100:null;
function mineTap(wx,wy){

function swing(){

  player.swing=.3;player.swingCd=.42;tone(200,.06,'square',.04);
  const reach=(x,w)=>{const dx=x-player.x;return Math.abs(dx)<w+34&&(Math.sign(dx)===player.dir||Math.abs(dx)<14)};
  for(const m of mine.monsters)if(!m.dead&&reach(m.x,MONSTERS[m.t].w)){
    m.hp--;m.hurt=.25;m.x+=player.dir*26;tone(500,.06,'square',.05);

  }

  }

function updateMine(dt){
  if(!inMine||!mine)return;
  player.swing=Math.max(0,(player.swing||0)-dt);player.swingCd=Math.max(0,(player.swingCd||0)-dt);
  player.hurt=Math.max(0,(player.hurt||0)-dt);player.hurtCd=Math.max(0,(player.hurtCd||0)-dt);
  if(mode!=='play'||fade||drive)return;
  // walk up to what you tapped, then keep swinging at it
  const t=player.target;
  if(t){
    if(t.hp<=0)player.target=null;
    else{
      const dx=t.x-player.x;player.dir=Math.sign(dx)||player.dir;
      if(Math.abs(dx)>44)player.path=[{walk:t.x-Math.sign(dx)*38}];
      else{player.path=[];swing()}
    }
  }
  for(const m of mine.monsters){
    if(m.dead){m.dead+=dt;continue}
    const M=MONSTERS[m.t], dx=player.x-m.x;
    m.ph+=dt;m.hurt=Math.max(0,m.hurt-dt);
    if(Math.abs(dx)<M.see&&player.x>SAFE_X-40)m.vx=Math.sign(dx)*M.speed;
    else if(Math.random()<dt*.5)m.vx=(Math.random()<.5?-1:1)*M.speed*.4;
    if(m.hurt>0)m.vx=0;
    m.x=Math.max(SAFE_X,Math.min(MINE_W-60,m.x+m.vx*dt));
    if(Math.abs(dx)<M.w&&player.hurtCd<=0&&!(m.t==='bat'&&monY(m)<-95)){   // ouch!
      mine.hits++;player.hurtCd=1;player.hurt=.6;player.target=null;player.path=[];
      player.x=Math.max(20,Math.min(MINE_W-20,player.x+(Math.sign(dx)||1)*40));
      tone(160,.15,'square',.08);emit('💥',player.x,player.y-60,1,20);
      if(mine.hits>=MAX_HITS)return faint();
      say(['Ouch!','Ow!','Hey!','Yikes!'][Math.random()*4|0],1);
    }
  }
  mine.monsters=mine.monsters.filter(m=>!m.dead||m.dead<.35);
  for(const r of mine.rocks)r.shake=Math.max(0,r.shake-dt);
}

const SPEED=170;
function update(dt,T){
  updateTrip(dt);updateWedding(dt);updateCity(dt);updateMine(dt);updateTot(dt);updateEra(dt);updateBeach(dt);
  if(growPlots(dt*1000)){save();renderFarm()}
  updatePups(dt);
  const st=inBeach?seaDepth(player.x):away()?0:player.f!==0?stand(player.f):player.x>HW-WALL?CAR_Y:player.x<WALL?YARD_Y:stand(0);   // a step down outside
  if(!player.climb)player.y=st;
  player.moving=false;
  const spd=SPEED*(swimming()?.6:1);   // swimming is slower than walking
  if(mode==='play'&&!busy()){
    let kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
    if(kx&&!player.climb){player.path=[];player.target=null;standUp();
      player.x=Math.max(minX(player.f),Math.min(maxX(player.f),player.x+kx*spd*dt));player.dir=kx;player.moving=true}
    if(player.climb){
      const c=player.climb;c.t+=dt/1.1;
      const k=Math.min(1,c.t);
      player.x=c.x0+(c.x1-c.x0)*k;player.y=c.y0+(c.y1-c.y0)*k;player.dir=Math.sign(c.x1-c.x0)||1;player.moving=true;
      if(k>=1){player.f=c.f1;player.y=stand(c.f1);player.climb=null;save()}
    }else if(player.path.length&&!kx){
      const s=player.path[0];
      if(s.walk!=null){
        const dx=s.walk-player.x;
        if(Math.abs(dx)<3){player.x=s.walk;player.path.shift()}
        else{player.x+=Math.sign(dx)*Math.min(Math.abs(dx),spd*dt);player.dir=Math.sign(dx);player.moving=true}
      }else if(s.climb){
        player.path.shift();
        const up=s.climb>0, f1=player.f+s.climb;
        player.climb={t:0,x0:player.x,y0:stand(player.f),x1:up?MINX+8:WALL+16,y1:stand(f1),f1};
      }else if(s.use){player.path.shift();if(s.use==='car')carTapped();else if(typeof s.use==='string')(inEra?eraAction:inBeach?beachAction:inTot?totAction:inMine?mineAction:cityAction)(s.use);else if(S.items.includes(s.use))use(s.use)}
      if(!player.path.length)save();
    }
  }
  if(player.moving)player.walk+=dt*12;else player.walk=0;
  if(player.say&&(player.say.t-=dt)<=0)player.say=null;
  if(player.act&&player.act.kind==='sleep'&&Math.random()<dt*1.2){const b=box(player.act.it);emit('💤',b.x+30,b.y,1,16)}
  if(player.act&&player.act.kind==='treehouse'){
    const a=player.act, was=a.t;a.t+=dt;
    if(was<1.3&&a.t>=1.3){
      const b=box(a.it);
      if(S.night){say('Look at all the stars! ✨',3);emit('⭐',b.x+70,b.y+20,3)}else say('My secret hideout!',3);
    }
  }
  if(rocketing()){   // countdown, up and away to the moon, back down
    const a=player.act, was=a.t;a.t+=dt;
    for(const [at,msg] of [[.05,'3…'],[1,'2…'],[2,'1…'],[3,'Blast off! 🚀']])
      if(was<at&&a.t>=at){say(msg,1);tone(at<3?440:110,at<3?.15:1.2,at<3?'square':'sawtooth',.06)}
    if(was<5.3&&a.t>=5.3){tone(523,.2,'triangle',.08);tone(659,.2,'triangle',.08,.2);tone(784,.4,'triangle',.08,.4)}
    if(was<8.5&&a.t>=8.5)tone(140,1.4,'sawtooth',.05);
    if(a.t>=11){const b=box(a.it);player.act=null;player.x=Math.max(YARD_L+20,Math.min(-16,b.x+b.w+14));say('What a trip! 🌕',2.5)}
  }
  if(player.act&&player.act.kind==='slide'){
    const a=player.act, was=a.t;a.t+=dt;
    if(was<1.3&&a.t>=1.3)[880,780,680,580].forEach((n,i)=>tone(n,.12,'sine',.06,i*.12));
    if(a.t>=2.2){const b=box(a.it);player.x=Math.max(YARD_L+20,Math.min(-16,a.it.flip?b.x-12:b.x+b.w+12));player.act=null;say('Again! 😄')}
  }
  if(player.act&&player.act.kind==='swim'&&Math.random()<dt*2){const b=box(player.act.it);emit('💦',player.x,b.y,1,16)}
  if(player.act&&player.act.kind==='bath'&&Math.random()<dt*3){const b=box(player.act.it);emit('🫧',b.x+b.w/2,b.y+10,1,16)}
  for(const n of people())updateNpc(n,dt);
  for(const it of S.items)if(it.tip||it.tipA){it.tipA=(it.tipA||0)+((it.tip||0)-(it.tipA||0))*Math.min(1,dt*10);if(!it.tip&&Math.abs(it.tipA)<.01)it.tipA=0}   // knocked over by Grandma
  for(let i=guests.length-1;i>=0;i--)if(guests[i].gone)guests.splice(i,1);
  if(mode==='play'&&!visiting&&!away()&&!busy()&&S.grannyBack&&!guests.some(g=>g.id==='grandma'))grandmaStillHere();
  if(mode==='play'&&!visiting&&!away()&&!busy()&&!guests.length){   // once a day a neighbor may drop by
    homeTime+=dt;
    if(homeTime>40&&S.granny!==S.day){S.granny=S.day;if(!S.grannyMet||Math.random()<.35)grandmaVisit()}   // some days Grandma comes
    if(homeTime>75&&S.dropIn!==S.day&&!guests.length){S.dropIn=S.day;const pool=MADE_UP.filter(m=>!(S.spouse&&S.spouse.id===m.id)),n=pool[Math.random()*pool.length|0];invite(n,'🔔 Surprise! '+n.name+' dropped by!')}
  }
  // pets wander while you play
  for(const it of S.items){
    const d=ITEMS[it.t];
    if(!d.pet)continue;
    if(it.happy>0){it.happy-=dt;it.vx=0;continue}
    if(it.launch||it.land||it.spaceUntil){it.vx=0;continue}
    if(mode!=='play'||(player.act&&player.act.it===it)){it.vx=0;continue}
    if(!it.vx&&Math.random()<dt*.3)it.vx=(Math.random()<.5?-1:1)*(it.t==='dog'?70:45);
    else if(it.vx&&Math.random()<dt*.4)it.vx=0;
    if(it.vx){
      it.x+=it.vx*dt;it.flip=it.vx<0;
      const front=inFront(it), back=it.x<0;   // pets stay in their own yard (or the house)
      const lo=back?YARD_L+10:front?FRONT_L+10:MINX, hi=back?YARD_MAX(d.w):front?FRONT_MAX(d.w):MAXX-d.w;
      if(it.x<lo){it.x=lo;it.vx=-it.vx}
      if(it.x>hi){it.x=hi;it.vx=-it.vx}
    }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.y+=p.vy*dt;p.x+=p.vx*dt;if((p.life-=dt)<=0)parts.splice(i,1)}
  // camera
  const t=camTarget();
  if(!cam.init){Object.assign(cam,t);cam.init=true}
  const k=Math.min(1,dt*6);
  cam.x+=(t.x-cam.x)*k;cam.y+=(t.y-cam.y)*k;cam.s+=(t.s-cam.s)*k;cam.vy=t.vy;
}

function draw(T){

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const T=now/1000;
  update(dt,T);
  if(snowB)drawSnowPreview(T);
  if(mode==='me')drawPreview(T);
  else draw(T);
  requestAnimationFrame(frame);
}
// The installed app can stay open in the background for days. Coming back to it, reload if the
// arcade has a newer Dream House (the house is saved first, so nothing is lost).
const pageTime=Date.parse(document.lastModified);
async function checkForUpdate(){
  if(document.hidden||busy()||visiting||away()||mode==='me')return;
  try{
    const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
    if(r.ok&&Date.parse(r.headers.get('Last-Modified'))>pageTime+1000){saveNow();location.reload()}
  }catch(e){}
}
addEventListener('visibilitychange',checkForUpdate);
addEventListener('pageshow',e=>{if(e.persisted)checkForUpdate()});
setMode(loaded?'play':'me');
if(loaded)share();
if(!loaded)toast('Welcome! First, make your player',3000);
requestAnimationFrame(frame);
