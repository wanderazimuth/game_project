<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Prairie King</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0e00;touch-action:none}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:none}
#joy-base{
  position:fixed;bottom:30px;left:30px;width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(255,200,80,.35);background:rgba(255,200,80,.06);
  pointer-events:auto;touch-action:none
}
#shoot-base{
  position:fixed;bottom:30px;right:30px;width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(255,100,50,.35);background:rgba(255,100,50,.06);
  pointer-events:auto;touch-action:none
}
.jthumb{
  position:absolute;width:50px;height:50px;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none
}
#joy-thumb{background:rgba(255,200,80,.45);border:2px solid rgba(255,200,80,.9)}
#shoot-thumb{background:rgba(255,100,50,.45);border:2px solid rgba(255,150,80,.9)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="joy-base"><div class="jthumb" id="joy-thumb"></div></div>
  <div id="shoot-base"><div class="jthumb" id="shoot-thumb"></div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const joyBase=document.getElementById('joy-base'),joyThumb=document.getElementById('joy-thumb');
const shootBase=document.getElementById('shoot-base'),shootThumb=document.getElementById('shoot-thumb');
const ui=document.getElementById('ui');
let W,H,bgDots;
function resize(){
  const d=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
  initBg();
}
addEventListener('resize',resize);resize();

// ── Waves ─────────────────────────────────────────────────────────────────────
const WAVES=[
  {total:7,  types:['grunt'],                            rate:1.0},
  {total:10, types:['grunt','runner'],                   rate:1.2},
  {total:13, types:['grunt','runner'],                   rate:1.3},
  {total:16, types:['grunt','runner','heavy'],            rate:1.2},
  {total:20, types:['grunt','runner','heavy'],            rate:1.2},
  {total:24, types:['grunt','runner','heavy','exploder'], rate:1.1},
  {total:26, types:['runner','heavy','exploder'],         rate:1.0},
  {total:28, types:['grunt','runner','heavy','exploder'], rate:0.9},
  {total:30, types:['runner','heavy','exploder'],         rate:0.8},
  {total:36, types:['runner','heavy','exploder'],         rate:0.65},
];

const ET={
  grunt:   {hp:1,spd:62, w:18,h:22,pts:10,drop:0.18},
  runner:  {hp:1,spd:118,w:14,h:18,pts:15,drop:0.14},
  heavy:   {hp:3,spd:44, w:28,h:32,pts:40,drop:0.32},
  exploder:{hp:1,spd:70, w:20,h:24,pts:25,drop:0.22},
};

// ── State ─────────────────────────────────────────────────────────────────────
let state='menu';
let score,lives,waveIdx,waveKills,waveSpawned,spawnT,waveClearT,invTimer;
let pl,bullets,eBullets,enemies,powerups,ptcls;
let faceX=0,faceY=-1;
let lastFire=0,lastTime=0;
const FIRE_CD=210;
const JR=40;

function rnd(a,b){return a+Math.random()*(b-a);}

// ── Background ────────────────────────────────────────────────────────────────
function initBg(){
  bgDots=Array.from({length:280},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*2.2+0.4,
    c:['#b89036','#d4b040','#c0a040','#9a7828','#a88c32'][Math.floor(Math.random()*5)],
  }));
}

// ── Game init ─────────────────────────────────────────────────────────────────
function startGame(){
  score=0;lives=3;waveIdx=0;
  waveKills=0;waveSpawned=0;spawnT=0;waveClearT=0;invTimer=0;
  pl={x:W/2,y:H/2,w:20,h:26,inv:0,alive:true};
  bullets=[];eBullets=[];enemies=[];powerups=[];ptcls=[];
  faceX=0;faceY=-1;lastFire=0;
  ui.style.display='block';
  state='playing';
}

// ── Spawning ──────────────────────────────────────────────────────────────────
function spawnEnemy(){
  const lv=WAVES[waveIdx];
  if(waveSpawned>=lv.total)return;
  const type=lv.types[Math.floor(Math.random()*lv.types.length)];
  const t=ET[type];
  let x,y;
  const edge=Math.floor(Math.random()*4);
  if(edge===0){x=rnd(0,W);y=-40;}
  else if(edge===1){x=rnd(0,W);y=H+40;}
  else if(edge===2){x=-40;y=rnd(0,H);}
  else{x=W+40;y=rnd(0,H);}
  const fireCDs={grunt:3.2,runner:2.2,heavy:1.8,exploder:2.8};
  const fcd=fireCDs[type];
  enemies.push({x,y,type,alive:true,
    hp:t.hp,maxHp:t.hp,w:t.w,h:t.h,pts:t.pts,
    spd:t.spd+rnd(-8,10),drop:t.drop,
    wave:Math.random()*Math.PI*2,
    fireCD:fcd,fireT:Math.random()*fcd,
  });
  waveSpawned++;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function boom(x,y,col,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=rnd(55,155);
    ptcls.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.4,0.85),maxLife:0.85,col});
  }
}

// ── Combat ────────────────────────────────────────────────────────────────────
function checkWaveClear(){
  const lv=WAVES[waveIdx];
  if(waveSpawned<lv.total)return;
  if(enemies.some(e=>e.alive))return;
  if(waveIdx>=WAVES.length-1){
    state='win';ui.style.display='none';setTimeout(()=>showLB(score),1500);
  } else {
    state='waveclear';waveClearT=2.8;
  }
}

function killEnemy(e){
  if(!e.alive)return;
  e.alive=false;
  score+=e.pts;
  const col=e.type==='heavy'?'#3a7c3a':e.type==='exploder'?'#f84':'#6aac4a';
  boom(e.x,e.y,col,e.type==='heavy'?16:10);
  if(e.type==='exploder'){
    boom(e.x,e.y,'#f84',22);boom(e.x,e.y,'#ff8',10);
    // AoE: damage player if nearby
    const dx=pl.x-e.x,dy=pl.y-e.y;
    if(Math.sqrt(dx*dx+dy*dy)<72)hitPlayer();
  }
  if(Math.random()<e.drop)powerups.push({x:e.x,y:e.y,age:0});
  waveKills++;
  checkWaveClear();
}

function hitPlayer(){
  if(invTimer>0||pl.inv>0||!pl.alive)return;
  lives--;
  boom(pl.x,pl.y,'#08f',14);
  if(lives<=0){
    pl.alive=false;
    state='gameover';
    ui.style.display='none';
    setTimeout(()=>showLB(score),1500);
    return;
  }
  pl.inv=1.8;
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBg(){
  ctx.fillStyle='#c9a94e';ctx.fillRect(0,0,W,H);
  for(const d of bgDots){
    ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
  }
  // Wooden fence border
  ctx.fillStyle='#6b3d0a';
  ctx.fillRect(0,0,W,7);ctx.fillRect(0,H-7,W,7);
  ctx.fillRect(0,0,7,H);ctx.fillRect(W-7,0,7,H);
  ctx.fillStyle='#8b5a1a';
  ctx.fillRect(2,2,W-4,3);ctx.fillRect(2,H-5,W-4,3);
  ctx.fillRect(2,2,3,H-4);ctx.fillRect(W-5,2,3,H-4);
  // Fence posts
  ctx.fillStyle='#5a2e08';
  for(let fx=0;fx<W;fx+=48){ctx.fillRect(fx,0,8,18);ctx.fillRect(fx,H-18,8,18);}
  for(let fy=18;fy<H-18;fy+=48){ctx.fillRect(0,fy,18,8);ctx.fillRect(W-18,fy,18,8);}
}

function drawPlayer(){
  const{x,y,w,h,inv}=pl;
  if(inv>0&&Math.floor(inv*10)%2===0)return;
  const gold=invTimer>0;

  // Invincibility aura
  if(gold){
    ctx.strokeStyle=`rgba(255,215,0,${0.4+Math.sin(Date.now()/80)*0.3})`;
    ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,w+10,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();ctx.ellipse(x,y+h/2+3,w/2,5,0,0,Math.PI*2);ctx.fill();

  // Boots
  ctx.fillStyle=gold?'#e8b000':'#2a1a08';
  ctx.fillRect(x-w/2,y+h*0.28,w/2-1,h*0.22);
  ctx.fillRect(x+1,y+h*0.28,w/2-1,h*0.22);
  // Boot spurs
  ctx.fillStyle=gold?'#ffd700':'#888';
  ctx.fillRect(x-w/2-3,y+h*0.42,3,3);ctx.fillRect(x+w/2,y+h*0.42,3,3);

  // Body / shirt
  ctx.fillStyle=gold?'#ffd700':'#2a5aaa';
  ctx.fillRect(x-w/2,y-h*0.1,w,h*0.42);

  // Belt
  ctx.fillStyle=gold?'#cc8800':'#1a1000';
  ctx.fillRect(x-w/2,y+h*0.12,w,4);
  ctx.fillStyle=gold?'#ffd700':'#888';
  ctx.fillRect(x-2,y+h*0.13,4,4); // buckle

  // Hat brim
  ctx.fillStyle=gold?'#ffd700':'#4a2a08';
  ctx.fillRect(x-w*0.72,y-h*0.48,w*1.44,5);
  // Hat crown
  ctx.fillStyle=gold?'#f5c000':'#2a1500';
  ctx.fillRect(x-w*0.38,y-h*1.0,w*0.76,h*0.55);
  // Hat band
  ctx.fillStyle=gold?'#cc8800':'#8B4513';
  ctx.fillRect(x-w*0.38,y-h*0.46,w*0.76,3);
  // Hat star
  ctx.fillStyle=gold?'#fff':'#ffd700';
  ctx.font='bold 8px sans-serif';ctx.textAlign='center';
  ctx.fillText('★',x,y-h*0.56);

  // Face / eyes
  ctx.fillStyle=gold?'rgba(0,0,0,0.3)':'#c8a060';
  ctx.fillRect(x-w*0.35,y-h*0.25,w*0.7,h*0.22);
  ctx.fillStyle=gold?'#ff8800':'#111';
  ctx.fillRect(x-5,y-h*0.18,3,3);ctx.fillRect(x+2,y-h*0.18,3,3);

  // Gun
  ctx.save();ctx.translate(x,y-h*0.05);
  ctx.rotate(Math.atan2(faceY,faceX));
  ctx.fillStyle='#555';ctx.fillRect(4,-2,18,4);
  ctx.fillStyle='#333';ctx.fillRect(20,-3,5,5);
  ctx.restore();
}

function drawEnemy(e){
  if(!e.alive)return;
  const{x,y,w,h,type,hp,maxHp}=e;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath();ctx.ellipse(x,y+h/2+2,w/2,4,0,0,Math.PI*2);ctx.fill();

  if(type==='grunt'){
    // Basic zombie: ragged humanoid shape
    ctx.fillStyle='#4a7c3a';ctx.fillRect(x-w/2,y-h/4,w,h*0.7);
    ctx.fillStyle='#3a5c2a';ctx.fillRect(x-w/2,y-h/2,w,h/4); // head
    // Ragged edges
    ctx.fillStyle='#3a5c2a';ctx.fillRect(x-w/2-3,y-h/4+4,4,h*0.3);ctx.fillRect(x+w/2-1,y-h/4+2,4,h*0.28);
    ctx.fillStyle='#cc1010';ctx.fillRect(x-5,y-h*0.42,3,3);ctx.fillRect(x+2,y-h*0.42,3,3);
    // Outstretched arms
    ctx.fillStyle='#4a7c3a';
    ctx.fillRect(x-w/2-10,y-h*0.15,10,4);ctx.fillRect(x+w/2,y-h*0.15,10,4);
  } else if(type==='runner'){
    // Fast lean zombie: triangular, hunched
    ctx.fillStyle='#8ab030';
    ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6a9020';ctx.fillRect(x-w/3,y-h/4,w*0.66,h*0.3);// body stripe
    ctx.fillStyle='#ee1010';ctx.fillRect(x-3,y-h*0.3,6,6); // glowing eye
    ctx.fillStyle='#ff4444';ctx.fillRect(x-1,y-h*0.28,2,2);
  } else if(type==='heavy'){
    // Big brute zombie: round, dark
    ctx.fillStyle='#2a5c2a';ctx.beginPath();ctx.arc(x,y,w/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a3c1a';ctx.beginPath();ctx.arc(x,y-h/5,w*0.36,0,Math.PI*2);ctx.fill();// head
    ctx.fillStyle='#cc1010';ctx.fillRect(x-7,y-h/3,5,5);ctx.fillRect(x+2,y-h/3,5,5);
    // Arms
    ctx.fillStyle='#2a5c2a';
    ctx.fillRect(x-w/2-12,y-h*0.1,12,8);ctx.fillRect(x+w/2,y-h*0.1,12,8);
    // HP bar
    ctx.fillStyle='#200';ctx.fillRect(x-w/2,y-h/2-10,w,5);
    ctx.fillStyle='#0f0';ctx.fillRect(x-w/2,y-h/2-10,w*(hp/maxHp),5);
    ctx.strokeStyle='#040';ctx.lineWidth=1;ctx.strokeRect(x-w/2,y-h/2-10,w,5);ctx.lineWidth=1;
  } else if(type==='exploder'){
    // Glowing bomb zombie
    const f=0.65+Math.sin(Date.now()/160)*0.35;
    ctx.fillStyle=`rgba(200,90,10,${f})`;ctx.beginPath();ctx.arc(x,y,w/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,60,0,${f})`;ctx.beginPath();ctx.arc(x,y,w/3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,200,50,${f*0.8})`;ctx.beginPath();ctx.arc(x,y,w/6,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#fff';ctx.fillRect(x-4,y-5,3,4);ctx.fillRect(x+1,y-5,3,4);
    ctx.fillStyle='#f00';ctx.fillRect(x-3,y-4,1,2);ctx.fillRect(x+2,y-4,1,2);
  }
}

function drawBullet(b){
  ctx.fillStyle='#ffe040';
  ctx.beginPath();ctx.arc(b.x,b.y,4.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.3;ctx.fillStyle='#fff8a0';
  ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}
function drawEBullet(b){
  ctx.fillStyle='#f03010';
  ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.28;ctx.fillStyle='#ff6040';
  ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function drawPowerup(p){
  const pulse=0.78+Math.sin(p.age*6)*0.22;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.age*1.2);ctx.globalAlpha=pulse;
  // 5-point star
  ctx.fillStyle='#ffd700';ctx.strokeStyle='#ff8800';ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2-Math.PI/2;
    const r=i%2===0?13:6;
    i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.lineWidth=1;ctx.globalAlpha=1;ctx.restore();
}

function drawHUD(){
  // Top bar
  ctx.fillStyle='rgba(0,0,0,0.52)';ctx.fillRect(0,0,W,40);
  ctx.fillStyle='#ffd700';ctx.font='bold 15px monospace';ctx.textAlign='left';
  ctx.fillText('SCORE '+score,14,26);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('WAVE '+(waveIdx+1)+' / '+WAVES.length,W/2,26);
  // Hat icons for lives
  for(let i=0;i<lives;i++){
    const lx=W-18-i*28,ly=20;
    ctx.fillStyle='#4a2a08';ctx.fillRect(lx-10,ly,20,4); // brim
    ctx.fillStyle='#2a1500';ctx.fillRect(lx-6,ly-9,12,10); // crown
    ctx.fillStyle='#8B4513';ctx.fillRect(lx-6,ly-2,12,2); // band
  }
  // Wave clear progress strip
  const lv=WAVES[waveIdx];
  const prog=Math.min(1,waveKills/lv.total);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,H-5,W,5);
  ctx.fillStyle='#4a0';ctx.fillRect(0,H-5,W*prog,5);

  if(invTimer>0){
    ctx.fillStyle='rgba(255,215,0,0.92)';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText('★  INVINCIBLE  '+Math.ceil(invTimer)+'s  ★',W/2,H-16);
  }
}

function drawMenu(){
  drawBg();
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 42px monospace';ctx.fillStyle='#ffd700';
  ctx.fillText('PRAIRIE KING',W/2,H/2-110);
  ctx.font='bold 13px monospace';ctx.fillStyle='#8B4513';
  ctx.fillText('★   P K   ★',W/2,H/2-76);
  ctx.font='13px monospace';ctx.fillStyle='#aaa';
  ctx.fillText('WASD: move    Arrow keys: shoot',W/2,H/2-38);
  ctx.fillText('Left stick: move    Right stick: aim & fire',W/2,H/2-18);
  ctx.font='13px monospace';ctx.fillStyle='#8ab060';
  ctx.fillText('Shoot zombies  ·  Collect ★ for 18s invincibility',W/2,H/2+20);
  ctx.font='bold 18px monospace';ctx.fillStyle='#fff';
  ctx.fillText('TAP OR PRESS SPACE TO START',W/2,H/2+66);
  ctx.font='11px monospace';ctx.fillStyle='#665533';
  ctx.fillText('10 waves  ·  grunts · runners · heavies · exploders',W/2,H/2+96);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 36px monospace';ctx.fillStyle='#f44';ctx.fillText('YOU DIED',W/2,H/2-55);
  ctx.font='21px monospace';ctx.fillStyle='#ffd700';ctx.fillText('Score: '+score,W/2,H/2-14);
  ctx.font='14px monospace';ctx.fillStyle='#888';ctx.fillText('Wave '+(waveIdx+1)+' of '+WAVES.length,W/2,H/2+20);
  ctx.font='16px monospace';ctx.fillStyle='#aaa';ctx.fillText('TAP TO RESTART',W/2,H/2+64);
}

function drawWin(){
  ctx.fillStyle='rgba(0,0,20,0.82)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 32px monospace';ctx.fillStyle='#ffd700';ctx.fillText('PRAIRIE CLEARED!',W/2,H/2-72);
  ctx.font='16px monospace';ctx.fillStyle='#8ab060';ctx.fillText('All 10 waves survived!',W/2,H/2-32);
  ctx.font='22px monospace';ctx.fillStyle='#fff';ctx.fillText('Final Score: '+score,W/2,H/2+8);
  ctx.font='16px monospace';ctx.fillStyle='#aaa';ctx.fillText('TAP TO PLAY AGAIN',W/2,H/2+58);
}

function drawWaveClear(){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 28px monospace';ctx.fillStyle='#2f2';
  ctx.fillText('WAVE '+waveIdx+' CLEAR!',W/2,H/2-22);
  if(waveIdx<WAVES.length-1){
    ctx.font='18px monospace';ctx.fillStyle='#ffd700';
    ctx.fillText('WAVE '+(waveIdx+1)+' INCOMING...',W/2,H/2+22);
  }
}

function updPtcls(dt){
  for(let i=ptcls.length-1;i>=0;i--){
    const p=ptcls[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=0.87;p.vy*=0.87;p.life-=dt;
    if(p.life<=0)ptcls.splice(i,1);
  }
}
function drawPtcls(){
  for(const p of ptcls){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.col;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  }
  ctx.globalAlpha=1;
}

// ── Collision ─────────────────────────────────────────────────────────────────
function rRect(ax,ay,aw,ah,bx,by,bw,bh){
  return ax-aw/2<bx+bw/2&&ax+aw/2>bx-bw/2&&ay-ah/2<by+bh/2&&ay+ah/2>by-bh/2;
}

function collide(){
  // Player bullets vs enemies
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];let hit=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];if(!e.alive)continue;
      if(rRect(b.x,b.y,9,9,e.x,e.y,e.w,e.h)){
        boom(b.x,b.y,'#ff8',4);hit=true;
        e.hp--;
        if(e.hp<=0)killEnemy(e);
        break;
      }
    }
    if(hit)bullets.splice(bi,1);
  }

  if(!pl.alive)return;

  // Player vs enemies
  for(const e of enemies){
    if(!e.alive||state!=='playing')continue;
    if(rRect(pl.x,pl.y,pl.w,pl.h,e.x,e.y,e.w,e.h)){
      if(invTimer>0){killEnemy(e);}
      else if(pl.inv<=0){hitPlayer();}
    }
  }

  // Player vs powerups (invincibility star)
  for(let pi=powerups.length-1;pi>=0;pi--){
    const p=powerups[pi];
    const dx=pl.x-p.x,dy=pl.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<26){
      invTimer=18;
      boom(p.x,p.y,'#ffd700',18);
      powerups.splice(pi,1);
    }
  }

  // Enemy bullets vs player
  for(let bi=eBullets.length-1;bi>=0;bi--){
    const b=eBullets[bi];
    if(rRect(b.x,b.y,10,10,pl.x,pl.y,pl.w,pl.h)){
      eBullets.splice(bi,1);
      hitPlayer();
    }
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;

  if(state==='menu'){drawMenu();return;}

  drawBg();

  if(state==='gameover'){
    for(const e of enemies)drawEnemy(e);
    drawPtcls();drawGameOver();return;
  }
  if(state==='win'){drawWin();return;}

  if(state==='waveclear'){
    for(const p of powerups){p.age+=dt;drawPowerup(p);}
    for(const e of enemies)drawEnemy(e);
    drawPlayer();drawPtcls();drawHUD();drawWaveClear();
    waveClearT-=dt;
    if(waveClearT<=0){
      waveIdx++;waveKills=0;waveSpawned=0;spawnT=0;
      enemies=[];bullets=[];eBullets=[];
      state='playing';
    }
    return;
  }

  // ── Playing ──────────────────────────────────────────────────────────────
  const lv=WAVES[waveIdx];

  // Movement (WASD)
  let mvX=0,mvY=0;
  if(keys['a']||keys['A'])mvX-=1;if(keys['d']||keys['D'])mvX+=1;
  if(keys['w']||keys['W'])mvY-=1;if(keys['s']||keys['S'])mvY+=1;
  if(Math.abs(joyDx)>0.1)mvX=joyDx;if(Math.abs(joyDy)>0.1)mvY=joyDy;
  const mvLen=Math.sqrt(mvX*mvX+mvY*mvY);
  if(mvLen>0){
    pl.x+=(mvX/mvLen)*200*dt;
    pl.y+=(mvY/mvLen)*200*dt;
  }
  pl.x=Math.max(pl.w/2+10,Math.min(W-pl.w/2-10,pl.x));
  pl.y=Math.max(pl.h/2+46,Math.min(H-pl.h/2-10,pl.y));
  if(pl.inv>0)pl.inv-=dt;

  // Shoot direction (Arrow keys or right joystick)
  let sX=0,sY=0;
  if(keys['ArrowLeft'])sX-=1;if(keys['ArrowRight'])sX+=1;
  if(keys['ArrowUp'])sY-=1;if(keys['ArrowDown'])sY+=1;
  if(Math.abs(shootDx)>0.15){sX=shootDx;}if(Math.abs(shootDy)>0.15){sY=shootDy;}
  const sLen=Math.sqrt(sX*sX+sY*sY);
  if(sLen>0.1){
    faceX=sX/sLen;faceY=sY/sLen;
    const now=performance.now();
    if(now-lastFire>=FIRE_CD){
      lastFire=now;
      bullets.push({x:pl.x+faceX*16,y:pl.y+faceY*12,vx:faceX*520,vy:faceY*520});
    }
  } else if(mvLen>0){
    // Update facing to movement direction when not shooting
    faceX=mvX/mvLen;faceY=mvY/mvLen;
  }

  // Invincibility countdown
  if(invTimer>0)invTimer-=dt;

  // Spawn enemies
  spawnT+=dt;
  if(spawnT>=1/lv.rate&&waveSpawned<lv.total){spawnT=0;spawnEnemy();}

  // Update bullets
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(bi,1);
  }

  // Update enemies (walk toward player, with type variations)
  const t=ts/1000;
  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    if(!e.alive){enemies.splice(ei,1);continue;}
    const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(e.type==='runner'){
      const perp=Math.sin(t*3+e.wave)*0.3;
      e.x+=(dx/d+perp*(-dy/d))*e.spd*dt;
      e.y+=(dy/d+perp*(dx/d))*e.spd*dt;
    } else if(e.type==='exploder'){
      const boost=d<120?1.5:1;
      e.x+=dx/d*e.spd*boost*dt;e.y+=dy/d*e.spd*boost*dt;
    } else {
      e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;
    }
    // Enemy fires at player when in range
    if(d<500){
      e.fireT-=dt;
      if(e.fireT<=0){
        e.fireT=e.fireCD;
        const nx=dx/d,ny=dy/d;
        if(e.type==='heavy'){
          // 3-way spread
          const ang=Math.atan2(dy,dx);
          for(const off of[-0.32,0,0.32]){
            eBullets.push({x:e.x,y:e.y,vx:Math.cos(ang+off)*195,vy:Math.sin(ang+off)*195});
          }
        } else {
          const spd=e.type==='runner'?235:e.type==='exploder'?265:175;
          eBullets.push({x:e.x,y:e.y,vx:nx*spd,vy:ny*spd});
        }
      }
    }
  }

  // Update enemy bullets
  for(let bi=eBullets.length-1;bi>=0;bi--){
    const b=eBullets[bi];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)eBullets.splice(bi,1);
  }

  // Update powerups (age only — they sit still)
  for(const p of powerups)p.age+=dt;

  collide();
  // Check wave clear each frame (catches enemies removed off-screen)
  checkWaveClear();
  updPtcls(dt);

  // Draw
  for(const p of powerups)drawPowerup(p);
  for(const b of bullets)drawBullet(b);
  for(const b of eBullets)drawEBullet(b);
  for(const e of enemies)drawEnemy(e);
  drawPlayer();
  drawPtcls();
  drawHUD();
}

requestAnimationFrame(loop);

// ── Controls ──────────────────────────────────────────────────────────────────
const keys={};
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(document.getElementById('lb-overlay').style.display!=='none')return;
  if((e.key===' '||e.key==='Enter')&&(state==='menu'||state==='gameover'||state==='win'))startGame();
});
addEventListener('keyup',e=>{delete keys[e.key];});

// Move joystick
let joyDx=0,joyDy=0,joyId=null;
function joyUpdate(t){
  const rect=joyBase.getBoundingClientRect();
  let dx=t.clientX-(rect.left+rect.width/2),dy=t.clientY-(rect.top+rect.height/2);
  const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  joyThumb.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  joyDx=dx/JR;joyDy=dy/JR;
}
function joyReset(){joyDx=joyDy=0;joyId=null;joyThumb.style.transform='translate(-50%,-50%)';}
joyBase.addEventListener('touchstart',ev=>{ev.preventDefault();if(joyId!==null)return;const t=ev.changedTouches[0];joyId=t.identifier;joyUpdate(t);},{passive:false});
joyBase.addEventListener('touchmove',ev=>{ev.preventDefault();for(const t of ev.changedTouches)if(t.identifier===joyId)joyUpdate(t);},{passive:false});
joyBase.addEventListener('touchend',ev=>{for(const t of ev.changedTouches)if(t.identifier===joyId)joyReset();},{passive:false});
joyBase.addEventListener('touchcancel',joyReset);

// Shoot joystick
let shootDx=0,shootDy=0,shootId=null;
function shootUpdate(t){
  const rect=shootBase.getBoundingClientRect();
  let dx=t.clientX-(rect.left+rect.width/2),dy=t.clientY-(rect.top+rect.height/2);
  const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  shootThumb.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  shootDx=dx/JR;shootDy=dy/JR;
}
function shootReset(){shootDx=shootDy=0;shootId=null;shootThumb.style.transform='translate(-50%,-50%)';}
shootBase.addEventListener('touchstart',ev=>{ev.preventDefault();if(shootId!==null)return;const t=ev.changedTouches[0];shootId=t.identifier;shootUpdate(t);},{passive:false});
shootBase.addEventListener('touchmove',ev=>{ev.preventDefault();for(const t of ev.changedTouches)if(t.identifier===shootId)shootUpdate(t);},{passive:false});
shootBase.addEventListener('touchend',ev=>{for(const t of ev.changedTouches)if(t.identifier===shootId)shootReset();},{passive:false});
shootBase.addEventListener('touchcancel',shootReset);

cv.addEventListener('touchstart',ev=>{
  ev.preventDefault();
  if(document.getElementById('lb-overlay').style.display!=='none')return;
  if(state==='menu'||state==='gameover'||state==='win')startGame();
},{passive:false});

// ── Leaderboard ───────────────────────────────────────────────────────────────
const LB_GAME='prairie-king';
let _lbScore=0;
function showLB(s){
  _lbScore=s;
  document.getElementById('lb-score').textContent='SCORE: '+s.toLocaleString();
  document.getElementById('lb-form').style.display='flex';
  document.getElementById('lb-name').value='';
  document.getElementById('lb-overlay').style.display='flex';
  lbLoad(false);
}
function lbLoad(done){
  fetch('/scores/'+LB_GAME).then(r=>r.json()).then(list=>lbRender(list,done)).catch(()=>lbRender([],done));
}
function lbRender(list,done){
  const el=document.getElementById('lb-rows');
  if(!list.length){el.innerHTML='<div style="color:#554;padding:8px 0;font-size:.8rem">No scores yet — be first!</div>';return;}
  el.innerHTML=list.slice(0,10).map((s,i)=>{
    const hi=done&&s.score===_lbScore;
    return `<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #221800;font-size:.82rem">
      <span style="color:#553;width:20px">${i+1}.</span>
      <span style="flex:1;color:${hi?'#ffd700':'#aaa'}">${s.name}</span>
      <span style="color:${hi?'#ffd700':'#ff0'}">${s.score.toLocaleString()}</span></div>`;
  }).join('');
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lb-btn').addEventListener('click',()=>{
    const name=(document.getElementById('lb-name').value.trim().toUpperCase()||'ANON').slice(0,12);
    fetch('/scores/'+LB_GAME,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score:_lbScore})})
      .then(r=>r.json()).then(list=>{lbRender(list,true);document.getElementById('lb-form').style.display='none';})
      .catch(()=>document.getElementById('lb-form').style.display='none');
  });
  document.getElementById('lb-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lb-btn').click();});
  document.getElementById('lb-again').addEventListener('click',()=>{document.getElementById('lb-overlay').style.display='none';startGame();});
});
</script>
