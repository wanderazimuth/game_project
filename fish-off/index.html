<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fish Off</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b2a40;touch-action:none;font-family:'Courier New',monospace}
canvas{display:block}
.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(4,16,28,.72);z-index:10
}
.card{
  background:#0e2233;border:2px solid #5fc7ff;border-radius:14px;padding:24px 26px;
  width:min(340px,90vw);text-align:center;color:#d8f0ff
}
.card h1{font-size:2.1rem;color:#ffd84a;letter-spacing:2px;margin-bottom:4px}
.card .sub{color:#8fc8e8;font-size:.85rem;margin-bottom:16px}
.card .status{min-height:3.2em;font-size:.95rem;margin-bottom:16px;line-height:1.4}
.card button{
  display:block;width:100%;margin:8px 0;padding:12px;border-radius:10px;cursor:pointer;
  font:bold 1rem 'Courier New',monospace;touch-action:manipulation
}
.btn-main{background:#1f6a2e;border:2px solid #6fdc7f;color:#dfffe4}
.btn-main:disabled{opacity:.4;cursor:default}
.btn-main.on{background:#6fdc7f;color:#0b2a12}
.btn-alt{background:transparent;border:2px solid #4a7a98;color:#9fd0ee}
.card .how{font-size:.75rem;color:#7fa8c0;margin-top:12px;line-height:1.5;text-align:left}
#result-title{font-size:2rem;margin-bottom:8px}
#result-scores{font-size:1.1rem;margin-bottom:14px;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="lobby">
  <div class="card">
    <h1>FISH OFF</h1>
    <div class="sub">2 players · 2 phones · 90 seconds</div>
    <div class="status" id="lobby-status">Connecting…</div>
    <button class="btn-main" id="ready-btn" disabled>READY</button>
    <button class="btn-alt" id="solo-btn">PRACTICE SOLO</button>
    <div class="how">
      Drag in the water to move your hook.<br>
      When a fish bites, HOLD to reel it in.<br>
      Keep the tension in the green or the line snaps — or the fish slips away.<br>
      Deeper fish are worth more. Most points wins!
    </div>
  </div>
</div>

<div class="overlay" id="result">
  <div class="card">
    <div id="result-title"></div>
    <div id="result-scores"></div>
    <button class="btn-main" id="again-btn">REMATCH</button>
    <button class="btn-alt" id="save-btn">SAVE MY SCORE</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const lobbyEl=document.getElementById('lobby'),lobbyStatus=document.getElementById('lobby-status');
const readyBtn=document.getElementById('ready-btn'),soloBtn=document.getElementById('solo-btn');
const resultEl=document.getElementById('result');
const ROUND=90;
const COLORS={player1:'#ff5a4a',player2:'#4aa8ff'};
const NAMES={player1:'RED',player2:'BLUE'};

// Sizes are in pixels scaled by U; positions are fractions of the lake
// (x across, y from surface to bottom) so both phones play the same lake.
const FISH={
  minnow:{name:'Minnow',    pts:10, len:.10,spd:[.10,.16],depth:[.05,.40],str:.45,col:'#a9cfe0',bite:.9, w:5},
  perch: {name:'Perch',     pts:25, len:.15,spd:[.07,.11],depth:[.25,.65],str:.8, col:'#e0b64a',bite:.7, w:4},
  puffer:{name:'Pufferfish',pts:35, len:.13,spd:[.04,.06],depth:[.30,.75],str:.9, col:'#e8cf7a',bite:.6, w:1.2},
  bass:  {name:'Bass',      pts:50, len:.22,spd:[.05,.08],depth:[.45,.90],str:1.15,col:'#5f8f46',bite:.55,w:2.5},
  koi:   {name:'Golden Koi',pts:150,len:.24,spd:[.12,.18],depth:[.60,.95],str:1.6,col:'#ffcc33',bite:.45,w:0},
  boot:  {name:'Old Boot',  pts:5,  len:.16,spd:[0,0],    depth:[.97,.97],str:.1, col:'#6b4a2a',bite:1,  w:0},
};

// ── State ─────────────────────────────────────────────────────────────────────
let W,H,DPR,SURF,BOT,U;
let state='lobby',mode='solo',rng=Math.random;
let timeLeft=ROUND,countT=0,score=0,fish=[],spawnT=0,hook,fight=null,resetT=0;
let pointerDown=false,reeling=false,keys={},ptcls=[],popups=[],toasts=[],bubbles=[],clock=0,lastTime=0;
let net={ws:null,role:null,peer:false,meReady:false,peerReady:false,oppScore:0,oppFinal:null,full:false,offline:false};

function rnd(a,b){return a+Math.random()*(b-a);}
function fx(x){return x*W;}
function fy(y){return SURF+y*(BOT-SURF);}
function myColor(){return COLORS[net.role]||COLORS.player1;}
function oppRole(){return net.role==='player2'?'player1':'player2';}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function resize(){
  DPR=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SURF=Math.round(Math.max(120,H*0.22));
  BOT=H-6;
  U=Math.min(W,H*0.8,560);
}
function rodTip(){return{x:W*0.5+U*0.17,y:SURF-U*0.15};}
function restHook(){const t=rodTip();return{x:t.x/W,y:0.04};}

// ── Round flow ────────────────────────────────────────────────────────────────
function beginRound(seed,m){
  mode=m;rng=mulberry32(seed);
  score=0;timeLeft=ROUND;fish=[];fight=null;resetT=0;ptcls=[];popups=[];toasts=[];
  net.oppScore=0;net.oppFinal=null;net.meReady=false;net.peerReady=false;
  hook={...restHook()};hook.tx=hook.x;hook.ty=hook.y;
  for(let i=0;i<3;i++)fish.push(makeFish('boot',.12+rng()*.76,1));
  for(let i=0;i<8;i++)spawnFish(.05+rng()*.9);
  spawnT=0;
  lobbyEl.style.display='none';resultEl.style.display='none';
  state='countdown';countT=3;
}

function pickType(){
  const types=['minnow','perch','puffer','bass'];
  let total=0;for(const t of types)total+=FISH[t].w;
  let r=rng()*total;
  for(const t of types){r-=FISH[t].w;if(r<0)return t;}
  return 'minnow';
}
function makeFish(type,x,dir){
  const d=FISH[type];
  return{type,x,y:d.depth[0]+rng()*(d.depth[1]-d.depth[0]),
    vx:dir*(d.spd[0]+rng()*(d.spd[1]-d.spd[0])),ph:rng()*6,int:false,cool:0};
}
// Spawning only ever draws from the shared seeded RNG on a fixed beat, so
// both players get the same fish at the same moments.
function spawnFish(x){
  const dir=rng()<0.5?1:-1;
  fish.push(makeFish(pickType(),x??(dir>0?-0.1:1.1),dir));
  if(rng()<0.035){const d2=rng()<0.5?1:-1;fish.push(makeFish('koi',d2>0?-0.12:1.12,d2));}
}

function endRound(){
  state='over';reeling=false;fight=null;
  if(mode==='versus'){
    wsSend({type:'final',score});
    const t0=performance.now();
    const wait=()=>{
      if(net.oppFinal!==null||!net.peer||performance.now()-t0>4000)showResult();
      else setTimeout(wait,150);
    };
    wait();
  }else showResult();
}

function showResult(){
  const t=document.getElementById('result-title'),s=document.getElementById('result-scores');
  if(mode==='versus'){
    const opp=net.oppFinal??net.oppScore;
    const me=NAMES[net.role],them=NAMES[oppRole()];
    if(score>opp){t.textContent='YOU WIN!';t.style.color='#ffd84a';}
    else if(score<opp){t.textContent='YOU LOSE';t.style.color='#ff8a7a';}
    else{t.textContent="IT'S A TIE!";t.style.color='#9fd0ee';}
    s.innerHTML=`<span style="color:${myColor()}">${me} (you): ${score}</span><br>`+
      `<span style="color:${COLORS[oppRole()]}">${them}: ${opp}${net.oppFinal===null?' (left)':''}</span>`;
    document.getElementById('again-btn').textContent='REMATCH';
  }else{
    t.textContent="TIME'S UP!";t.style.color='#ffd84a';
    s.innerHTML='You scored <b style="color:#ffd84a">'+score+'</b>';
    document.getElementById('again-btn').textContent='BACK TO LOBBY';
  }
  resultEl.style.display='flex';
}

function showLobby(){
  state='lobby';fight=null;reeling=false;
  resultEl.style.display='none';lobbyEl.style.display='flex';
  updateLobby();
}

function updateLobby(){
  let txt;
  if(net.offline)txt='Two-player mode needs the arcade server.<br>You can practice solo.';
  else if(net.full)txt='Two players are already fishing.<br>You can practice solo.';
  else if(!net.role)txt='Connecting…';
  else{
    const me=`<b style="color:${myColor()}">${NAMES[net.role]}</b>`;
    const them=`<b style="color:${COLORS[oppRole()]}">${NAMES[oppRole()]}</b>`;
    if(!net.peer)txt=`You are ${me}.<br>Waiting for ${them} — open Fish Off on another phone.`;
    else if(net.meReady&&!net.peerReady)txt=`You're ready!<br>Waiting for ${them}…`;
    else if(!net.meReady&&net.peerReady)txt=`${them} is ready!<br>Press READY to start.`;
    else txt=`You are ${me}. ${them} is here!<br>Both press READY to start.`;
  }
  lobbyStatus.innerHTML=txt;
  readyBtn.disabled=!(net.role&&net.peer);
  readyBtn.classList.toggle('on',net.meReady);
  readyBtn.textContent=net.meReady?'READY ✓':'READY';
}

function tryStart(){
  // player1 hosts: when both are ready it picks the seed for both lakes.
  if(net.role==='player1'&&net.peer&&net.meReady&&net.peerReady&&state==='lobby'){
    const seed=Math.floor(Math.random()*2**31);
    wsSend({type:'start',seed});
    beginRound(seed,'versus');
  }
}

// ── Network ───────────────────────────────────────────────────────────────────
function wsSend(msg){if(net.ws&&net.ws.readyState===WebSocket.OPEN)net.ws.send(JSON.stringify(msg));}
function connect(){
  if(location.protocol==='file:'){net.offline=true;updateLobby();return;}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  let ws;
  try{ws=new WebSocket(`${proto}//${location.host}/ws/fish-off`);}catch(e){net.offline=true;updateLobby();return;}
  net.ws=ws;
  ws.addEventListener('message',ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}onNet(m);});
  ws.addEventListener('close',()=>{
    const was=net.role;
    net.ws=null;net.role=null;net.peer=false;net.peerReady=false;
    if(net.full)return;
    if(state==='play'&&mode==='versus')toast('Connection lost','#ff8a7a');
    updateLobby();
    setTimeout(connect,was?1500:3000);
  });
  ws.addEventListener('error',()=>{});
}
function onNet(m){
  switch(m.type){
    case 'role':net.role=m.role;net.full=false;break;
    case 'room_full':net.full=true;break;
    case 'peer_status':{
      const was=net.peer;net.peer=m.connected;
      if(!net.peer)net.peerReady=false;
      if(net.peer&&!was)wsSend({type:'ready',v:net.meReady});
      if(!net.peer&&was&&state==='play'&&mode==='versus')toast(NAMES[oppRole()]+' left the game','#ff8a7a');
      break;
    }
    case 'ready':net.peerReady=!!m.v;tryStart();break;
    case 'start':if(state==='lobby'||state==='over')beginRound(m.seed,'versus');break;
    case 'catch':
      net.oppScore=m.score;
      if(state==='play'&&m.pts>=50)toast(NAMES[oppRole()]+' caught a '+m.name+'! +'+m.pts,COLORS[oppRole()]);
      break;
    case 'score':net.oppScore=m.score;break;
    case 'final':net.oppFinal=m.score;net.oppScore=m.score;break;
  }
  if(state==='lobby')updateLobby();
}

// ── Update ────────────────────────────────────────────────────────────────────
function hookPx(){return{x:fx(hook.x),y:fy(hook.y)};}
function fishPx(f){return{x:fx(f.x),y:fy(f.y)+Math.sin(clock*2+f.ph)*U*.01};}
function mouthPx(f){const p=fishPx(f),L=U*FISH[f.type].len;return{x:p.x+Math.sign(f.vx||1)*L*.45,y:p.y};}

function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endRound();return;}

  spawnT-=dt;
  while(spawnT<=0){spawnT+=0.9;spawnFish();}

  // Hook control (not while fighting a fish)
  if(!fight&&resetT<=0){
    const k=0.9*dt;
    if(keys['arrowleft']||keys['a'])hook.tx-=k*U/W;
    if(keys['arrowright']||keys['d'])hook.tx+=k*U/W;
    if(keys['arrowup']||keys['w'])hook.ty-=k*U/(BOT-SURF);
    if(keys['arrowdown']||keys['s'])hook.ty+=k*U/(BOT-SURF);
    hook.tx=Math.max(.03,Math.min(.97,hook.tx));hook.ty=Math.max(.02,Math.min(.97,hook.ty));
    const hp=hookPx(),tx=fx(hook.tx),ty=fy(hook.ty),dx=tx-hp.x,dy=ty-hp.y,d=Math.hypot(dx,dy),step=U*0.9*dt;
    if(d>step){hook.x+=dx/d*step/W;hook.y+=dy/d*step/(BOT-SURF);}else{hook.x=hook.tx;hook.y=hook.ty;}
  }
  if(resetT>0){
    resetT-=dt;
    if(resetT<=0){const r=restHook();hook.x=hook.tx=r.x;hook.y=hook.ty=r.y;}
  }

  const hp=hookPx();
  for(const f of fish){
    if(fight&&fight.fish===f)continue;
    const d=FISH[f.type];
    f.cool-=dt;
    if(f.type==='boot'){
      if(!fight&&resetT<=0){const m=mouthPx(f);if(Math.hypot(m.x-hp.x,m.y-hp.y)<U*.06)startFight(f);}
      continue;
    }
    const m=mouthPx(f),dist=Math.hypot(m.x-hp.x,m.y-hp.y);
    if(f.int){
      if(fight||resetT>0||dist>U*.4){f.int=false;f.cool=2;}
      else{
        // swim to the hook
        const p=fishPx(f),dx=hp.x-p.x,dy=hp.y-p.y,dd=Math.hypot(dx,dy)||1,sp=Math.abs(f.vx)*W*1.4;
        f.vx=Math.sign(dx||f.vx)*Math.abs(f.vx);
        f.x+=dx/dd*sp*dt/W;f.y+=dy/dd*sp*dt/(BOT-SURF);
        if(dist<U*.045){startFight(f);continue;}
      }
    }else{
      f.x+=f.vx*dt;
      if(!fight&&resetT<=0&&f.cool<=0&&dist<U*.25&&Math.random()<d.bite*1.4*dt)f.int=true;
    }
  }
  fish=fish.filter(f=>f.x>-0.2&&f.x<1.2);

  if(fight)updFight(dt);
}

function startFight(f){
  for(const o of fish)o.int=false;
  const t=rodTip(),p=fishPx(f);
  const L=Math.hypot(p.x-t.x,p.y-t.y);
  reeling=pointerDown||!!keys[' '];
  fight={fish:f,L,L0:L,ang:Math.atan2(p.y-t.y,p.x-t.x),tension:.25,burstT:rnd(.6,1.6),burst:0,slack:0,boot:f.type==='boot'};
  splash(hookPx().x,hookPx().y,'#cfefff',8);
  popup(fishPx(f).x,fishPx(f).y-U*.08,f.type==='boot'?'SNAG!':'BITE!','#fff');
}

function updFight(dt){
  const F=fight,d=FISH[F.fish.type],t=rodTip(),str=d.str;
  if(!F.boot){
    F.burstT-=dt;
    if(F.burstT<=0){F.burst=0.5;F.burstT=rnd(0.9,2.4)/str;}
  }
  F.burst=Math.max(0,F.burst-dt);
  const b=F.burst>0;
  if(reeling){
    F.L-=U*0.45*(b?0.4:1)*dt;
    F.tension+=(F.boot?0.05:0.22+str*0.18+(b?str*0.55:0))*dt;
  }else{
    F.L+=U*str*0.12*(b?2.2:1)*dt*(F.boot?0:1);
    F.tension-=0.55*dt;
  }
  F.tension=Math.max(0,F.tension);
  // fish thrashes side to side; keep it under the surface
  const wig=Math.sin(clock*(b?14:6)+F.fish.ph)*(b?0.35:0.15);
  let a=F.ang+wig;
  let x=t.x+Math.cos(a)*F.L,y=t.y+Math.sin(a)*F.L;
  y=Math.max(SURF+U*.03,Math.min(BOT-U*.02,y));
  x=Math.max(U*.05,Math.min(W-U*.05,x));
  F.ang=F.ang*0.98+Math.atan2(y-t.y,x-t.x)*0.02;
  F.fish.x=x/W;F.fish.y=(y-SURF)/(BOT-SURF);
  F.fish.vx=Math.abs(F.fish.vx||0.05)*(x>t.x?-1:1)||0.0001;
  const m=mouthPx(F.fish);hook.x=m.x/W;hook.y=(m.y-SURF)/(BOT-SURF);

  if(F.tension>=1){lose('LINE SNAPPED!','#ff6a5a',true);return;}
  if(!F.boot){
    F.slack=F.tension<0.08?F.slack+dt:0;
    if(F.slack>1.3){lose('IT GOT AWAY…','#9fd0ee',false);return;}
    if(F.L>F.L0+U*0.4){lose('IT GOT AWAY…','#9fd0ee',false);return;}
  }
  if(y<=SURF+U*.035&&F.L<Math.hypot(0,SURF-t.y)+U*.12||F.L<U*.12)catchFish();
}

function catchFish(){
  const f=fight.fish,d=FISH[f.type],p=fishPx(f);
  score+=d.pts;
  fish=fish.filter(o=>o!==f);
  fight=null;
  splash(p.x,SURF,'#dff4ff',16);
  if(f.type==='koi')splash(p.x,SURF,'#ffd84a',20);
  popup(p.x,SURF-U*.12,'+'+d.pts+' '+d.name,f.type==='koi'?'#ffd84a':'#fff');
  wsSend({type:'catch',name:d.name,pts:d.pts,score});
  const r=restHook();hook.x=hook.tx=r.x;hook.y=hook.ty=r.y;
}

function lose(text,col,snap){
  const f=fight.fish;
  f.cool=4;f.int=false;
  f.vx=(Math.random()<.5?-1:1)*Math.max(Math.abs(f.vx),FISH[f.type].spd[1]||0.1)*1.5;
  fight=null;
  popup(fx(hook.x),fy(hook.y)-U*.06,text,col);
  if(snap)splash(fx(hook.x),fy(hook.y),'#ff6a5a',8);
  resetT=snap?1.2:0.5;
}

// ── Effects ───────────────────────────────────────────────────────────────────
function splash(x,y,col,n){
  for(let i=0;i<n;i++){const a=-Math.PI*rnd(.1,.9),s=rnd(60,200);
    ptcls.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.8),max:.8,col});}
}
function popup(x,y,text,col){popups.push({x,y,text,col,life:1.4});}
function toast(text,col){toasts.push({text,col,life:3});}
function updFx(dt){
  for(const p of ptcls){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;}
  ptcls=ptcls.filter(p=>p.life>0);
  for(const p of popups){p.y-=30*dt;p.life-=dt;}
  popups=popups.filter(p=>p.life>0);
  for(const t of toasts)t.life-=dt;
  toasts=toasts.filter(t=>t.life>0);
  if(Math.random()<dt*4)bubbles.push({x:Math.random()*W,y:BOT,r:rnd(1.5,4),s:rnd(25,55)});
  for(const b of bubbles)b.y-=b.s*dt;
  bubbles=bubbles.filter(b=>b.y>SURF);
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawScene(){
  // sky
  let g=ctx.createLinearGradient(0,0,0,SURF);
  g.addColorStop(0,'#7cc6f0');g.addColorStop(1,'#cfeeff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,SURF);
  ctx.fillStyle='rgba(255,240,170,0.9)';ctx.beginPath();ctx.arc(W*.85,SURF*.42,U*.07,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<3;i++){
    const cx=((i*0.37+clock*0.004*(i+1))%1.2-0.1)*W,cy=SURF*(.28+i*.12);
    ctx.beginPath();ctx.arc(cx,cy,U*.05,0,7);ctx.arc(cx+U*.05,cy+4,U*.04,0,7);ctx.arc(cx-U*.05,cy+5,U*.035,0,7);ctx.fill();
  }
  // far shore
  ctx.fillStyle='#5f9a5a';ctx.beginPath();ctx.moveTo(0,SURF);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,SURF-U*.04-Math.sin(x*.01)*U*.02-Math.sin(x*.023)*U*.015);
  ctx.lineTo(W,SURF);ctx.fill();
  // the other player's boat, far off on the lake
  if(mode==='versus'&&(state==='play'||state==='countdown')){
    const ox=W*.18,oy=SURF-U*.012;
    ctx.fillStyle='#6b4a2a';ctx.beginPath();ctx.moveTo(ox-U*.05,oy);ctx.lineTo(ox+U*.05,oy);ctx.lineTo(ox+U*.035,oy+U*.02);ctx.lineTo(ox-U*.035,oy+U*.02);ctx.fill();
    ctx.fillStyle=COLORS[oppRole()];ctx.fillRect(ox-U*.012,oy-U*.035,U*.024,U*.035);
    ctx.strokeStyle='#3a2a1a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ox+U*.01,oy-U*.03);ctx.lineTo(ox+U*.06,oy-U*.07);ctx.stroke();
  }
  // water
  g=ctx.createLinearGradient(0,SURF,0,BOT);
  g.addColorStop(0,'#2f9fd0');g.addColorStop(0.5,'#17668f');g.addColorStop(1,'#0a2f4a');
  ctx.fillStyle=g;ctx.fillRect(0,SURF,W,BOT-SURF+10);
  // light rays
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<4;i++){
    const x=((i*0.29+Math.sin(clock*.2+i)*0.03)%1)*W;
    ctx.beginPath();ctx.moveTo(x,SURF);ctx.lineTo(x+U*.08,SURF);ctx.lineTo(x+U*.25,BOT);ctx.lineTo(x+U*.1,BOT);ctx.fill();
  }
  // sand and weeds
  ctx.fillStyle='#c2a66a';ctx.beginPath();ctx.moveTo(0,BOT);
  for(let x=0;x<=W;x+=16)ctx.lineTo(x,BOT-U*.03-Math.sin(x*.03)*U*.01);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.strokeStyle='#2f7a3a';ctx.lineWidth=Math.max(2,U*.012);ctx.lineCap='round';
  for(let i=0;i<9;i++){
    const x=(i+.5)/9*W+Math.sin(i*7)*U*.04,h=U*(.12+(i%3)*.05);
    ctx.beginPath();ctx.moveTo(x,BOT-U*.02);
    ctx.quadraticCurveTo(x+Math.sin(clock*1.2+i)*U*.05,BOT-h*.6,x+Math.sin(clock*1.2+i+1)*U*.03,BOT-h);
    ctx.stroke();
  }
  ctx.lineCap='butt';
  ctx.fillStyle='rgba(220,240,255,0.5)';
  for(const b of bubbles){ctx.beginPath();ctx.arc(b.x+Math.sin(b.y*.05)*3,b.y,b.r,0,7);ctx.fill();}
  // surface line
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=W;x+=10)ctx.lineTo(x,SURF+Math.sin(x*.04+clock*2)*2);
  ctx.stroke();
}

function drawFish(f){
  const d=FISH[f.type],p=fishPx(f),L=U*d.len,dir=Math.sign(f.vx||1);
  ctx.save();ctx.translate(p.x,p.y);
  if(f.type==='boot'){
    ctx.fillStyle=d.col;
    ctx.fillRect(-L*.3,-L*.45,L*.3,L*.45);
    ctx.beginPath();ctx.moveTo(-L*.3,0);ctx.lineTo(L*.4,0);ctx.quadraticCurveTo(L*.45,-L*.2,L*.1,-L*.2);ctx.lineTo(-L*.3,-L*.2);ctx.fill();
    ctx.fillStyle='#3a2a1a';ctx.fillRect(-L*.32,-L*.02,L*.75,L*.06);
    ctx.restore();return;
  }
  ctx.scale(dir,1);
  const fl=Math.sin(clock*10+f.ph)*L*.08;
  if(f.type==='puffer'){
    const r=L*.42;
    ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
    ctx.strokeStyle='#a88a3a';ctx.lineWidth=1.5;
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*r*1.25,Math.sin(a)*r*1.25);ctx.stroke();}
    ctx.fillStyle=d.col;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(-r*1.5,-r*.4+fl);ctx.lineTo(-r*1.5,r*.4+fl);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*.45,-r*.25,r*.2,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(r*.5,-r*.25,r*.1,0,7);ctx.fill();
    ctx.restore();return;
  }
  ctx.fillStyle=d.col;
  ctx.beginPath();ctx.moveTo(-L*.38,0);ctx.lineTo(-L*.55,-L*.2+fl);ctx.lineTo(-L*.55,L*.2+fl);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,L*.42,L*.17,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-L*.1,-L*.15);ctx.lineTo(L*.08,-L*.28);ctx.lineTo(L*.15,-L*.14);ctx.fill();
  if(f.type==='bass'){ctx.fillStyle='rgba(30,50,20,0.5)';ctx.fillRect(-L*.3,-L*.03,L*.6,L*.05);}
  if(f.type==='perch'){ctx.fillStyle='rgba(60,40,10,0.45)';for(let i=0;i<3;i++)ctx.fillRect(-L*.2+i*L*.13,-L*.15,L*.04,L*.3);}
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.ellipse(0,L*.06,L*.3,L*.06,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(L*.26,-L*.04,Math.max(1.5,L*.05),0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(L*.27,-L*.04,Math.max(1,L*.025),0,7);ctx.fill();
  ctx.restore();
  if(f.type==='koi'&&Math.sin(clock*6+f.ph)>.5){
    ctx.fillStyle='#fff';const sx=p.x+rnd(-L*.3,L*.3),sy=p.y+rnd(-L*.15,L*.15),r=U*.012;
    ctx.fillRect(sx-r,sy-.75,r*2,1.5);ctx.fillRect(sx-.75,sy-r,1.5,r*2);
  }
  if(f.int){ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(U*.04)}px monospace`;ctx.textAlign='center';ctx.fillText('?',p.x,p.y-L*.3);}
}

function drawBoat(){
  const cx=W*.5,y=SURF+Math.sin(clock*1.5)*2,c=myColor();
  // fisher
  ctx.fillStyle=c;ctx.fillRect(cx-U*.03,y-U*.13,U*.06,U*.09);
  ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(cx,y-U*.16,U*.032,0,7);ctx.fill();
  ctx.fillStyle=c;ctx.fillRect(cx-U*.045,y-U*.19,U*.09,U*.015);ctx.fillRect(cx-U*.025,y-U*.215,U*.05,U*.03);
  // rod
  const t=rodTip();
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=Math.max(2,U*.008);
  ctx.beginPath();ctx.moveTo(cx+U*.02,y-U*.08);ctx.lineTo(t.x,t.y);ctx.stroke();
  // hull
  ctx.fillStyle='#8a5a2b';
  ctx.beginPath();ctx.moveTo(cx-U*.16,y-U*.04);ctx.lineTo(cx+U*.16,y-U*.04);ctx.lineTo(cx+U*.12,y+U*.03);ctx.lineTo(cx-U*.12,y+U*.03);ctx.closePath();ctx.fill();
  ctx.fillStyle='#6b4420';ctx.fillRect(cx-U*.16,y-U*.045,U*.32,U*.015);
}

function drawLine(){
  const t=rodTip(),h=hookPx();
  const ten=fight?fight.tension:0;
  ctx.strokeStyle=ten>0.8?'#ff5a4a':ten>0.6?'#ffd84a':'rgba(255,255,255,0.8)';
  ctx.lineWidth=fight?1.8:1.2;
  ctx.beginPath();ctx.moveTo(t.x,t.y);
  const sag=fight?Math.max(0,0.3-ten)*U*.4:U*.05;
  ctx.quadraticCurveTo((t.x+h.x)/2,(t.y+h.y)/2+sag,h.x,h.y);ctx.stroke();
  if(!fight){
    ctx.strokeStyle='#ddd';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.x,h.y+U*.025);ctx.arc(h.x-U*.012,h.y+U*.025,U*.012,0,Math.PI);ctx.stroke();
    ctx.fillStyle='#ff7aa8';ctx.beginPath();ctx.arc(h.x-U*.022,h.y+U*.022,U*.008,0,7);ctx.fill();
  }
}

function drawTension(){
  if(!fight)return;
  const bh=Math.min(H*.45,U*.6),bw=Math.max(16,U*.04),x=W-bw-14,y=SURF+(BOT-SURF-bh)/2;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(x-4,y-24,bw+8,bh+32);
  const zone=(a,b,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y+bh*(1-b),bw,bh*(b-a));};
  zone(0,.15,'#3a6a9a');zone(.15,.8,'#2f8a3a');zone(.8,1,'#a8302a');
  const ty=y+bh*(1-Math.min(1,fight.tension));
  ctx.fillStyle='#fff';ctx.fillRect(x-5,ty-2,bw+10,4);
  ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('LINE',x+bw/2,y-10);
  const hint=('ontouchstart' in window)?'HOLD ANYWHERE TO REEL':'HOLD SPACE TO REEL';
  ctx.font=`bold ${Math.max(13,Math.round(U*.035))}px monospace`;
  ctx.fillStyle='rgba(0,0,0,0.5)';const w=ctx.measureText(hint).width+20;
  ctx.fillRect(W/2-w/2,BOT-U*.14,w,U*.06);
  ctx.fillStyle=fight.tension>0.8?'#ff8a7a':fight.tension<0.15?'#9fd0ee':'#dfffe4';
  ctx.fillText(fight.tension>0.8?'EASY! LET GO!':fight.tension<0.15&&!fight.boot?'REEL! IT\'S SLIPPING!':hint,W/2,BOT-U*.1);
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,40);
  ctx.font='bold 16px monospace';ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.fillStyle=myColor();
  ctx.fillText((mode==='versus'?'YOU ':'')+score,12,20);
  ctx.textAlign='center';
  const t=Math.ceil(timeLeft);
  ctx.fillStyle=t<=10&&state==='play'&&Math.floor(clock*4)%2?'#ff5a4a':'#fff';
  ctx.fillText(Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),W/2,20);
  if(mode==='versus'){
    ctx.textAlign='right';ctx.fillStyle=COLORS[oppRole()];
    ctx.fillText(NAMES[oppRole()]+' '+net.oppScore+(net.peer?'':' ✕'),W-12,20);
  }
  ctx.textBaseline='alphabetic';
}

function drawFx(){
  for(const p of ptcls){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life);
    ctx.font=`bold ${Math.max(14,Math.round(U*.045))}px monospace`;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText(p.text,p.x+2,p.y+2);
    ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  toasts.forEach((t,i)=>{
    ctx.globalAlpha=Math.min(1,t.life);
    ctx.font='bold 14px monospace';const w=ctx.measureText(t.text).width+20;
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(W/2-w/2,48+i*30,w,26);
    ctx.fillStyle=t.col;ctx.fillText(t.text,W/2,66+i*30);
  });
  ctx.globalAlpha=1;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;clock+=dt;
  if(state==='countdown'){countT-=dt;if(countT<=0)state='play';}
  else if(state==='play')update(dt);
  updFx(dt);

  drawScene();
  if(state!=='lobby'){
    for(const f of fish)drawFish(f);
    drawLine();
  }
  drawBoat();
  drawFx();
  if(state!=='lobby'){drawHUD();drawTension();}
  if(state==='countdown'){
    ctx.textAlign='center';ctx.font=`bold ${Math.round(U*.25)}px monospace`;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillText(Math.ceil(countT),W/2+4,H/2+4);
    ctx.fillStyle='#ffd84a';ctx.fillText(Math.ceil(countT),W/2,H/2);
    ctx.font='bold 16px monospace';ctx.fillStyle='#fff';
    ctx.fillText(mode==='versus'?'Catch more than '+NAMES[oppRole()]+'!':'Catch as many as you can!',W/2,H/2+U*.08);
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
function setTarget(x,y){
  if(y<SURF)y=SURF;
  hook.tx=Math.max(.03,Math.min(.97,x/W));
  hook.ty=Math.max(.02,Math.min(.97,(y-SURF)/(BOT-SURF)));
}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  pointerDown=true;
  if(fight)reeling=true;else setTarget(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{if(pointerDown&&state==='play'&&!fight)setTarget(e.clientX,e.clientY);});
addEventListener('pointerup',()=>{pointerDown=false;reeling=!!keys[' '];});
addEventListener('pointercancel',()=>{pointerDown=false;reeling=false;});
addEventListener('keydown',e=>{
  if(lbOpen())return;
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k===' ')reeling=true;
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();delete keys[k];if(k===' '&&!pointerDown)reeling=false;});
addEventListener('blur',()=>{keys={};reeling=false;pointerDown=false;});

readyBtn.addEventListener('click',()=>{
  net.meReady=!net.meReady;
  wsSend({type:'ready',v:net.meReady});
  updateLobby();tryStart();
});
soloBtn.addEventListener('click',()=>{
  if(net.meReady){net.meReady=false;wsSend({type:'ready',v:false});}
  beginRound(Math.floor(Math.random()*2**31),'solo');
});
document.getElementById('again-btn').addEventListener('click',showLobby);
document.getElementById('save-btn').addEventListener('click',()=>{resultEl.style.display='none';showLB(score);});

// ── Leaderboard ───────────────────────────────────────────────────────────────
const LB_GAME='fish-off';
let _lbScore=0;
function lbOpen(){const el=document.getElementById('lb-overlay');return el&&el.style.display!=='none';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showLB(s){
  _lbScore=s;
  document.getElementById('lb-score').textContent='SCORE: '+s.toLocaleString();
  document.getElementById('lb-form').style.display='flex';
  document.getElementById('lb-name').value='';
  document.getElementById('lb-overlay').style.display='flex';
  lbLoad(false);
}
function lbLoad(done){
  fetch('/scores/'+LB_GAME).then(r=>r.json()).then(list=>lbRender(list,done)).catch(()=>lbRender([],done));
}
function lbRender(list,done){
  const el=document.getElementById('lb-rows');
  if(!list.length){el.innerHTML='<div style="color:#557;padding:8px 0;font-size:.8rem">No scores yet — be first!</div>';return;}
  el.innerHTML=list.slice(0,10).map((s,i)=>{
    const hi=done&&s.score===_lbScore;
    return `<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #1a3a50;font-size:.82rem">
      <span style="color:#578;width:20px">${i+1}.</span>
      <span style="flex:1;color:${hi?'#ffd84a':'#aac'}">${esc(s.name)}</span>
      <span style="color:${hi?'#ffd84a':'#5fc7ff'}">${Number(s.score).toLocaleString()}</span></div>`;
  }).join('');
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lb-btn').addEventListener('click',()=>{
    const name=(document.getElementById('lb-name').value.trim().toUpperCase()||'ANON').slice(0,12);
    fetch('/scores/'+LB_GAME,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score:_lbScore})})
      .then(r=>r.json()).then(list=>{lbRender(list,true);document.getElementById('lb-form').style.display='none';})
      .catch(()=>document.getElementById('lb-form').style.display='none');
  });
  document.getElementById('lb-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lb-btn').click();});
  document.getElementById('lb-again').addEventListener('click',()=>{document.getElementById('lb-overlay').style.display='none';showLobby();});
});

resize();
addEventListener('resize',resize);
hook={...restHook()};hook.tx=hook.x;hook.ty=hook.y;
showLobby();
connect();
requestAnimationFrame(loop);
</script>

<div id="lb-overlay" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center">
  <div style="background:#0a1a28;border:2px solid #5fc7ff;border-radius:12px;padding:28px 32px;min-width:280px;max-width:90vw;font-family:'Courier New',monospace">
    <div style="color:#ffd84a;font-size:1.1rem;font-weight:bold;text-align:center;margin-bottom:6px">&#127907; FISH OFF &#127907;</div>
    <div id="lb-score" style="color:#5fc7ff;font-size:1.3rem;font-weight:bold;margin-bottom:14px;text-align:center"></div>
    <div id="lb-rows" style="margin-bottom:14px;text-align:left;min-height:40px"></div>
    <div id="lb-form" style="display:flex;gap:8px;margin-bottom:14px">
      <input id="lb-name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false"
        style="flex:1;background:rgba(95,199,255,.1);border:1px solid #5fc7ff;color:#d8f0ff;padding:8px;border-radius:6px;font-family:'Courier New',monospace;font-size:.9rem;outline:none">
      <button id="lb-btn" style="background:rgba(95,199,255,.15);border:1px solid #5fc7ff;color:#d8f0ff;padding:8px 12px;border-radius:6px;font-family:'Courier New',monospace;font-size:.85rem;cursor:pointer;font-weight:bold">OK</button>
    </div>
    <div id="lb-again" style="color:#678;font-size:.8rem;cursor:pointer;padding:4px;text-align:center">&#9654; PLAY AGAIN</div>
  </div>
</div>
</body>
