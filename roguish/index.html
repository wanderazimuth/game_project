<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Roguish</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0b12;color:#e8e2d8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#top{background:#17121e;border-bottom:2px solid #2a2234}
#msgbar{min-height:2.7em;max-height:4.1em;overflow:hidden;padding:5px 10px 3px;font-size:14px;line-height:1.3em;color:#fff;cursor:pointer}
#msgbar .old{color:#8a8296}
#stat{display:flex;align-items:center;gap:6px;padding:3px 8px 6px;font-size:13px;flex-wrap:wrap}
#hp{position:relative;width:118px;height:18px;border-radius:9px;background:#3a1620;overflow:hidden;border:1px solid #000;flex:none}
#hpfill{position:absolute;inset:0;width:100%;background:linear-gradient(#ff6b6b,#c0303c);transition:width .25s}
#hptext{position:absolute;inset:0;text-align:center;font-size:12px;line-height:16px;font-weight:bold;color:#fff;text-shadow:0 1px 1px #000}
.chip{background:#251d2e;border:1px solid #3a2f46;border-radius:8px;padding:1px 6px;white-space:nowrap}
.chip.warn{background:#5a2a10;border-color:#c0602a;color:#ffd0a0}
.chip.bad{background:#6a1420;border-color:#e04848;color:#fff}
#mapwrap{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#centerBtn{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:23px;font-size:22px;display:none;opacity:.9}
#aimbar{position:absolute;left:0;right:0;top:0;display:none;justify-content:center;align-items:center;gap:10px;padding:8px;background:rgba(20,10,30,.88);font-size:15px;color:#ffd84a;flex-wrap:wrap}
#aimbar button{padding:6px 14px}
#tip{position:absolute;display:none;background:rgba(20,14,28,.95);border:1px solid #6a5a80;border-radius:8px;padding:5px 9px;font-size:14px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-190%)}
#side{background:#17121e;border-top:2px solid #2a2234;padding:6px 8px 8px;display:flex;justify-content:center;gap:8px}
#dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;flex:none}
#dpad button{font-size:20px;touch-action:none}
#dpad.off{display:none}
#ctl{flex:1;min-width:0;max-width:480px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
#quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.slot{position:relative;height:46px;border-radius:9px;background:#221a2c;border:2px solid #3a2f46;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.slot img{width:38px;height:38px;image-rendering:pixelated;pointer-events:none}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000}
.slot .pin{position:absolute;left:3px;top:0;font-size:9px}
.slot.empty{opacity:.4;cursor:default}
.slot:active{background:#3a2f46}
#btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:5px}
button{font:inherit;color:#eee;background:#2a2234;border:1px solid #4a3d5a;border-radius:10px;cursor:pointer;touch-action:manipulation}
button:active{background:#3e3250}
#btns button{height:42px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 3px;white-space:nowrap;overflow:hidden}
#actBtn{background:#4a3a14;border-color:#c8a040;color:#ffe9a8;font-weight:bold;font-size:14px!important}
#actBtn:active{background:#6a5420}
@media (orientation:landscape) and (max-height:560px){
  #app{flex-direction:row}
  #side{width:212px;border-top:none;border-left:2px solid #2a2234;flex-direction:column;justify-content:flex-end;align-items:center}
  #ctl{flex:none;width:100%;justify-content:flex-end}
  #dpad{order:1;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  .slot{height:40px}
  #btns{grid-template-columns:1fr 1fr}
  #btns button{height:38px}
  #actBtn{grid-column:1 / span 2;order:-1}
  #msgbar{min-height:2.6em}
}
#modal{position:fixed;inset:0;background:rgba(5,2,10,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#modal.drawer{align-items:flex-end;padding:0}
#modal.drawer .box{border-radius:14px 14px 0 0;max-height:70vh;max-width:100%}
#modal .box{background:#1b1524;border:1px solid #4a3d5a;border-radius:14px;padding:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#modal h2{font-size:16px;color:#ffd84a;margin-bottom:10px}
#modal p{font-size:14px;line-height:1.45em;margin:4px 0}
#modal .sec{color:#9be564;margin-top:12px;font-weight:bold}
#modal .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .row button{padding:10px 16px;font-size:15px}
#modal input{font:inherit;font-size:16px;width:100%;padding:9px;background:#0e0b12;color:#fff;border:1px solid #6a5a80;border-radius:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;text-align:left;font-size:13px;min-height:50px;touch-action:none}
.item img{width:36px;height:36px;image-rendering:pixelated;flex:none;pointer-events:none}
.item span{pointer-events:none}
.item.dim{opacity:.38}
.item.worn{border-color:#c8a040}
.item .tag{display:block;font-size:11px;color:#c8a040}
.sheet{display:flex;gap:14px;align-items:center}
.sheet img{width:72px;height:72px;image-rendering:pixelated;background:#221a2c;border-radius:10px;padding:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:12px}
.acts button{padding:11px 8px;font-size:15px}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
.mini .slot{height:46px}
.mini .slot.hot{border-color:#ffd84a;background:#3e3250}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.menu button{padding:10px;text-align:left;font-size:14px}
.menu button b{color:#ffd84a;margin-right:4px;font-family:monospace}
.dirs{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,54px);gap:6px;justify-content:center}
.dirs button{font-size:22px}
#ghost{position:fixed;width:44px;height:44px;image-rendering:pixelated;pointer-events:none;z-index:30;display:none;transform:translate(-50%,-50%)}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0e0b12;z-index:20;padding:16px;text-align:center}
#title h1{font-size:40px;letter-spacing:.18em;color:#ffd84a;font-weight:900;text-shadow:0 3px 0 #8e2533}
#title .sub{color:#b9b0c8;font-size:14px}
#title canvas{image-rendering:pixelated;width:min(360px,90vw);border-radius:10px;border:2px solid #2a2234}
#title input{font:inherit;font-size:17px;padding:9px;background:#17121e;color:#fff;border:1px solid #6a5a80;border-radius:8px;text-align:center;width:230px}
#title button{padding:11px 24px;font-size:17px}
#title .credit{color:#776d86;font-size:11px;max-width:520px;line-height:1.4em}
#title a{color:#9a90aa}
.stone{margin:0 auto 12px;width:240px;padding:24px 14px 16px;border-radius:120px 120px 8px 8px;background:#4a4556;border:3px solid #7d7a8c;color:#f2eee4;text-align:center;line-height:1.5em;box-shadow:0 6px 0 #2b2733}
.stone .rip{font-size:22px;letter-spacing:.2em;font-weight:bold;margin-bottom:6px}
.won{color:#ffd84a;font-size:20px;text-align:center;margin-bottom:8px;font-weight:bold}
pre.mono,.mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="top">
      <div id="msgbar" title="Tap for the message log"></div>
      <div id="stat"></div>
    </div>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="aimbar"><span id="aimtext"></span><button id="aimCancel">✖ Cancel</button></div>
      <div id="tip"></div>
      <button id="centerBtn" title="Back to you">◎</button>
    </div>
  </div>
  <div id="side">
    <div id="dpad"></div>
    <div id="ctl">
      <div id="quick"></div>
      <div id="btns">
        <button id="packBtn">🎒 Pack</button>
        <button id="actBtn"></button>
        <button id="menuBtn">☰ Menu</button>
      </div>
    </div>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<img id="ghost" alt="">
<div id="title"></div>
<script>const ROGUE_SAVE_KEY = 'roguish-save-v2';   // v2: the 42×40 map (a v1 game was 80×22)
try { localStorage.removeItem('roguish-save-v1'); } catch (e) { }</script>
<script src="rogue.js"></script>
<script src="sprites.js"></script>
<script>
'use strict';
// Roguish: started as a copy of Rogue+, with its own copy of rogue.js, so its rules can change
// while Rogue and Rogue+ stay true to the original. Drawn with pixel art and played with taps,
// swipes, pinch zoom and a quick-use bar.

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
};
const prefs = Object.assign({ classic: false, buzz: true, dpad: true }, store.get('roguish-prefs', {}));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

// ── Input: every key, tap and button goes into one queue the game reads from ──
const keyq = [];
let keyWaiter = null;
function pushKey(k) { if (keyWaiter) { const w = keyWaiter; keyWaiter = null; w(k); } else keyq.push(k); }
function nextKey() { return keyq.length ? Promise.resolve(keyq.shift()) : new Promise(r => { keyWaiter = r; }); }

const KEYMAP = { ArrowLeft: 'h', ArrowDown: 'j', ArrowUp: 'k', ArrowRight: 'l', Home: 'y', PageUp: 'u', End: 'b', PageDown: 'n', Escape: '\x1b' };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ($('title').style.display !== 'none') return;
  if (menuOpen) { if (e.key === 'Escape') closeModal(); return; }
  let k = KEYMAP[e.key];
  if (k && e.shiftKey && 'hjklyubn'.includes(k)) k = k.toUpperCase();
  if (!k && e.ctrlKey) { if (e.key.toLowerCase() === 'p') k = '^P'; else if ('hjklyubn'.includes(e.key.toLowerCase())) k = '^' + e.key.toLowerCase(); }
  if (!k && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) k = e.key;
  if (!k) return;
  e.preventDefault();
  travel = null;
  pushKey(k);
});

// An item action (from the pack or the quick bar) presses the command key and answers
// the "which object?" question that follows with this item.
let pending = null;
function doItem(cmd, obj) {
  if (!Rogue.isPlaying()) return;
  travel = null;
  pending = { cmd, letter: obj.packch, armed: false };
  pushKey(cmd);
}

// ── Pictures for things ─────────────────────────────────────────────────────
const tintOf = name => {
  if (COLOR_NAMES[name]) return COLOR_NAMES[name];
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) & 0xffffff;
  return '#' + (h | 0x404040).toString(16).padStart(6, '0').slice(-6);
};
// [sprite, tint] for an item of this type and kind
function itemArt(type, which) {
  const G = Rogue.G;
  switch (type) {
    case '!': return ['potion', tintOf(G.p_colors[which])];
    case '?': return ['scroll'];
    case ':': return [which === 1 ? 'fruit' : 'ration'];
    case ')': return [WEAPON_SPRITE[which] || 'sword'];
    case ']': return ['armor', ARMOR_TINT[which] || '#9aa0b0'];
    case '=': return ['ring', tintOf(G.r_stones[which])];
    case '/': return [G.ws_type[which] === 'staff' ? 'staff' : 'wand', tintOf(G.ws_made[which])];
    case '*': return ['gold'];
    case ',': return ['amulet'];
  }
  return null;
}
const KINDS = { '!': 14, ':': 2, ')': 9, ']': 8, '=': 14, '/': 14 };
// what a thing on the map looks like; a xeroc pretending to be an item gets a believable look too
function mapItemArt(ch, y, x) {
  const o = Rogue.G.lvl_obj.find(o => o.pos.y === y && o.pos.x === x);
  const which = o && o.type === ch ? o.which : ((y * 131 + x * 71 + Rogue.G.level * 17) % (KINDS[ch] || 1));
  return itemArt(ch, which);
}
const iconCache = new Map();
function iconURL(art) {
  const key = art.join('|');
  if (!iconCache.has(key)) iconCache.set(key, sprite(art[0], art[1]).toDataURL());
  return iconCache.get(key);
}
const objIcon = o => iconURL(itemArt(o.type, o.which) || ['scroll']);

// ── The map ─────────────────────────────────────────────────────────────────
const cv = $('map'), ctx = cv.getContext('2d');
const COLS = Rogue.NUMCOLS, ROWS = Rogue.NUMLINES - 2;   // screen lines 1 to ROWS are the dungeon
const TERRAIN = '.#+-|%^';
const ITEMS = '*!?:)]=/,';
const MON_COLORS = ['#ff6b6b', '#ff9f43', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#b5179e', '#e9c46a', '#90e0ef', '#ff8fab'];
const CLASSIC = { '@': '#ffd84a', '-': '#c8a26a', '|': '#c8a26a', '.': '#5c5c5c', '#': '#9a9a9a', '+': '#c87533', '%': '#3cff6e',
  '^': '#ff4fd8', '*': '#ffd700', '!': '#ff7ad9', '?': '#f4f4f4', ':': '#b9f27a', ')': '#7ad7ff', ']': '#9fc0ff', '=': '#ffb347',
  '/': '#d29bff', ',': '#fff27a' };
let W = 0, H = 0, TS = 32;            // TS: size of one square on screen
const cam = { x: 40, y: 11, follow: true };
let seen = new Array(COLS * (ROWS + 1)).fill('');   // the floor, walls and doors you've seen, for under monsters
let lastLevel = -1, heroCell = null, face = 1;
const heroVis = { x: 0, y: 0 };
const monVis = new WeakMap();         // monster → where it's drawn (it slides there)
let shownMons = new Set();
let floats = [], poofs = [], hurtFlash = 0, lastHp = null;
let overlayMarks = null, aiming = false;

function layout() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  TS = clampTS(store.get('roguish-zoom', 0) || defaultTS());
}
const fitTS = () => Math.min(W / COLS, H / ROWS);
const defaultTS = () => Math.max(fitTS(), Math.min(40, Math.max(26, W / 13)));
const clampTS = t => Math.max(fitTS(), Math.min(84, t));
addEventListener('resize', () => { layout(); });

// keep the camera over the map; a map smaller than the screen sits in the middle
function clampCam() {
  const hw = W / 2 / TS, hh = H / 2 / TS;
  cam.x = COLS <= 2 * hw ? COLS / 2 : Math.max(hw, Math.min(COLS - hw, cam.x));
  cam.y = ROWS <= 2 * hh ? ROWS / 2 : Math.max(hh, Math.min(ROWS - hh, cam.y));
}
const toScreen = (cx, cy) => [(cx - cam.x) * TS + W / 2, (cy - cam.y) * TS + H / 2];   // cy counts from map row 0
const toCell = (sx, sy) => [Math.floor((sx - W / 2) / TS + cam.x), Math.floor((sy - H / 2) / TS + cam.y) + 1];

function resetView() {
  seen = new Array(COLS * (ROWS + 1)).fill(''); shownMons = new Set(); floats = []; poofs = [];
  const h = Rogue.hero(); heroVis.x = h.x; heroVis.y = h.y; heroCell = h.y * COLS + h.x;
  cam.follow = true; cam.x = h.x + .5; cam.y = h.y - .5; lastLevel = Rogue.G.level; lastHp = null;
}

let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (t - lastT) / 1000 || 0); lastT = t;
  if (!Rogue.G || $('title').style.display !== 'none') return;
  draw(dt, t / 1000);
}
requestAnimationFrame(frame);

function draw(dt, now) {
  const G = Rogue.G, h = Rogue.hero(), scr = Rogue.scr;
  if (G.level !== lastLevel) resetView();
  const ease = 1 - Math.exp(-dt * 22);
  // the hero slides from square to square; a jump (teleport, new level) snaps
  if (Math.abs(h.x - heroVis.x) > 2.5 || Math.abs(h.y - heroVis.y) > 2.5) { heroVis.x = h.x; heroVis.y = h.y; }
  if (h.x < heroVis.x - .01) face = -1; else if (h.x > heroVis.x + .01) face = 1;
  heroVis.x += (h.x - heroVis.x) * ease; heroVis.y += (h.y - heroVis.y) * ease;
  if (h.y * COLS + h.x !== heroCell) { heroCell = h.y * COLS + h.x; cam.follow = true; }
  if (cam.follow) {
    const tx = heroVis.x + .5, ty = heroVis.y - .5, k = 1 - Math.exp(-dt * 10);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  }
  clampCam();
  $('centerBtn').style.display = cam.follow ? 'none' : 'block';

  ctx.fillStyle = '#0e0b12'; ctx.fillRect(0, 0, W, H);
  const [c0, r0] = toCell(0, 0), [c1, r1] = toCell(W, H);
  const x0 = Math.max(0, c0), x1 = Math.min(COLS - 1, c1), y0 = Math.max(1, r0), y1 = Math.min(ROWS, r1);
  const P = Rogue.P, cansee = Rogue.cansee;
  const creatures = [];
  if (prefs.classic) ctx.font = `bold ${Math.floor(TS * .8)}px "DejaVu Sans Mono",Menlo,Consolas,monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    let ch = scr[y][x];
    const mark = overlayMarks && overlayMarks.get(y * COLS + x);
    if (mark) ch = mark;
    if (TERRAIN.includes(ch) && Rogue.chat(y, x) === ch) seen[y * COLS + x] = ch;
    if (ch === ' ') continue;
    const [sx, sy] = toScreen(x, y - 1);
    if (prefs.classic) { drawClassic(ch, sx, sy, Rogue.sout[y][x]); continue; }
    const isMon = ch >= 'A' && ch <= 'Z', isHero = ch === '@' && y === h.y && x === h.x;
    const bolt = '-|/\\'.includes(ch) && Rogue.chat(y, x) !== ch && !mark;
    // ground first
    let ground = TERRAIN.includes(ch) && !bolt ? ch : seen[y * COLS + x] || ((P(y, x).fl & 0x80) ? '#' : '.');
    if (isHero) { const u = Rogue.chat(y, x); if (TERRAIN.includes(u) && !(u === '^' && !(P(y, x).fl & 0x10))) ground = u; }
    drawGround(ground, x, y, sx, sy);
    if (ITEMS.includes(ch)) { const art = mapItemArt(ch, y, x); if (art) ctx.drawImage(sprite(art[0], art[1]), sx, sy, TS, TS); }
    else if (isHero) { const u = Rogue.chat(y, x), art = ITEMS.includes(u) ? itemArt(u, (Rogue.G.lvl_obj.find(o => o.pos.y === y && o.pos.x === x) || {}).which) : null; if (art) ctx.drawImage(sprite(art[0], art[1]), sx, sy, TS, TS); }
    else if (bolt) drawBolt(ch, sx, sy, now);
    else if (!isMon && ch !== '@' && !TERRAIN.includes(ch)) {   // detect-magic marks and the like
      ctx.font = `bold ${Math.floor(TS * .7)}px monospace`; ctx.fillStyle = '#ffd84a'; ctx.fillText(ch, sx + TS / 2, sy + TS / 2);
    }
    if (mark) { ctx.strokeStyle = `rgba(255,216,74,${.5 + .4 * Math.sin(now * 6)})`; ctx.lineWidth = 2; ctx.strokeRect(sx + 1, sy + 1, TS - 2, TS - 2); }
    if (!isHero && !mark && !cansee(y, x)) { ctx.fillStyle = 'rgba(8,5,14,.5)'; ctx.fillRect(sx, sy, TS + .5, TS + .5); }
    if (isMon || (ch === '@' && !isHero)) creatures.push([ch, y, x]);
  }
  if (!prefs.classic) {
    drawCreatures(creatures, ease, now, G);
    drawHero(now);
    drawEffects(dt);
  }
  if (aiming) drawAim(now);
  if (hurtFlash > 0) {
    hurtFlash -= dt;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(200,20,30,0)'); g.addColorStop(1, `rgba(200,20,30,${Math.max(0, hurtFlash) * 1.4})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  watchHero();
}
const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;
function drawGround(ch, x, y, sx, sy) {
  const v = hash(x, y) % 6;
  let t;
  switch (ch) {
    case '.': t = tile('floor', v); break;
    case '#': t = tile('passage', v); break;
    case '-': case '|': t = tile('wall', v); break;
    case '+': t = tile('door'); break;
    case '%': t = tile('stairs'); break;
    case '^': t = tile('trap', v); break;

  return `<div class="slot" data-slot="${i}" title="${esc(Rogue.inv_name(s.o, false))}"><img src="${objIcon(s.o)}" alt="">${s.pinned ? '<span class="pin">📌</span>' : ''}${s.o.count > 1 ? `<span class="n">${s.o.count}</span>` : ''}${isWorn(s.o) ? '<span class="n">✓</span>' : ''}</div>`;
}
let quickSig = '', quickNow = [];

  const sig = JSON.stringify(pins) + slots.map(s => s ? s.o.packch + s.o.type + s.o.which + s.o.count + isWorn(s.o) + s.pinned : '-').join();
  if (sig === quickSig) return;
  quickSig = sig; quickNow = slots;
  $('quick').innerHTML = slots.map(slotHTML).join('');
}
// tapping a slot does the obvious thing with it
function quickUse(o) {
  const G = Rogue.G;
  switch (o.type) {
    case ':': return doItem('e', o);
    case '!': return doItem('q', o);
    case '?': return doItem('r', o);
    case '/': return doItem('z', o);
    case ')': return o === G.cur_weapon ? itemSheet(o, true) : doItem([3, 6, 7].includes(o.which) ? 't' : 'w', o);
    case ']': return doItem(o === G.cur_armor ? 'T' : 'W', o);
    case '=': return doItem(o === G.cur_ring[0] || o === G.cur_ring[1] ? 'R' : 'P', o);
  }
  itemSheet(o, true);
}

function itemSheet(o, standalone) {
  const pinned = pins.findIndex(p => p && p.c === o.packch && p.t === o.type && p.w === o.which);
  const acts = (ACTS[o.type] || (() => []))(o).filter(Boolean);
  openModal(`<div class="sheet"><img src="${objIcon(o)}" alt=""><div><h2 style="margin:0">${esc(Rogue.inv_name(o, false))}</h2>
<p style="color:#9a90aa">${isWorn(o) ? 'In use' : 'In your pack'} · ${esc(o.packch)})</p></div></div>
<div class="acts">${acts.map(([k, l]) => `<button data-act="${k}">${l}</button>`).join('')}
<button data-pin="1">${pinned >= 0 ? '📌 Unpin from quick bar' : '📌 Pin to quick bar'}</button></div>
<div class="row"><button data-back="1">${standalone ? 'Close' : '◀ Back'}</button></div>`);
  menuOpen = standalone;
  return new Promise(res => {
    mbox.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { if (standalone) closeModal(); res(['act', b.dataset.act]); if (standalone) doItem(b.dataset.act, o); });

// the pack: a grid of pictures; tap one for what you can do, or drag it onto the quick bar
async function packScreen() {
  for (;;) {
    const pack = Rogue.G.pack, slots = quickSlots();
    openModal(`<h2>🎒 Your pack</h2>
<p style="font-size:12px;color:#9a90aa;margin-bottom:6px">Quick bar — drag an item onto a slot to pin it there, tap a 📌 slot to unpin</p>
<div class="mini">${slots.map(slotHTML).join('')}</div>
<div class="items">${pack.length ? pack.map((o, i) => itemButton(o, false, `data-i="${i}"`)).join('') : '<p>You are empty handed</p>'}</div>
<div class="row"><button data-close="1">Close</button></div>`);
    const res = await new Promise(resolve => {
      mbox.querySelector('[data-close]').onclick = () => resolve(['close']);
      mbox.querySelectorAll('.mini .slot').forEach(el => el.onclick = () => {
        const i = +el.dataset.slot; if (pins[i]) { pins[i] = null; savePins(); renderQuick(); resolve(['again']); }
      });
      waitKey(resolve);
      mbox.querySelectorAll('.item').forEach(el => dragOrTap(el, pack[+el.dataset.i], resolve));
    });
    keyWaiter = null;   // stop listening for Escape here, so the next key goes to the game
    if (res[0] === 'close' || res[0] === 'esc') { closeModal(); return; }
    if (res[0] === 'sheet') {
      const r = await itemSheet(res[1], false);
      if (r[0] === 'act') { closeModal(); pending = { cmd: r[1], letter: res[1].packch, armed: false }; pushKey(r[1]); return; }
    }
  }
}
// Escape (or tapping outside) closes whichever pack screen is up
let keyResolve = null;
function waitKey(resolve) {
  keyResolve = resolve;
  (async () => { const k = await modalKey(() => false); if (keyResolve === resolve) resolve(['esc']); })();
}
function dragOrTap(el, o, resolve) {
  const ghost = $('ghost');
  el.addEventListener('pointerdown', e => {
    const x0 = e.clientX, y0 = e.clientY; let dragging = false;
    try { el.setPointerCapture(e.pointerId); } catch (err) { }
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 10) { dragging = true; ghost.src = objIcon(o); ghost.style.display = 'block'; }
      if (!dragging) return;
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      mbox.querySelectorAll('.mini .slot').forEach(s => { const r = s.getBoundingClientRect(); s.classList.toggle('hot', ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom); });
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      ghost.style.display = 'none';
      if (!dragging) { if (ev.type === 'pointerup') resolve(['sheet', o]); return; }
      const hot = mbox.querySelector('.mini .slot.hot');
      if (hot) {
        const i = +hot.dataset.slot;
        pins = pins.map(p => p && p.c === o.packch && p.t === o.type && p.w === o.which ? null : p);
        pins[i] = pinOf(o); savePins(); renderQuick(); resolve(['again']);
      }
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

// Going down is for good (stairs only lead up once you have the Amulet), and the big button,
// the pad's middle and a tap on yourself all go down on stairs: ask first.
async function sureToGoDown() {
  const h = Rogue.hero();
  if (Rogue.G.amulet || Rogue.chat(h.y, h.x) !== '%') return true;
  openModal(`<h2>Go down to level ${Rogue.G.level + 1}?</h2><p>You can't come back to this level: stairs only lead up once you have the Amulet of Yendor.</p>
<div class="row"><button data-k="y">⬇ Go down</button><button data-k="n">Stay here</button></div>`);
  const k = await modalKey(k => k === 'y' || k === 'n' || k === '>');
  closeModal();
  return k === 'y' || k === '>';
}

  help: () => UI.showPanel(`<h2>How to play Roguish</h2><p>Find the Amulet of Yendor on level 26 or deeper, then climb all the way back up with it. It began as the original 1980 Rogue with pictures and phone controls, and its rules are changing: Rogue+ is the true-to-the-original version.</p>

const titleEl = $('title');
function titleArt() {
  const c = document.createElement('canvas'); c.width = 16 * 12; c.height = 16 * 5;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 12; x++) {
    const wall = y === 0 || y === 4 || x === 0 || x === 11;
    g.drawImage(wall ? tile('wall', (x + y) % 6) : tile('floor', (x * 3 + y) % 6), x * 16, y * 16);
  }
  g.drawImage(tile('door'), 11 * 16, 2 * 16); g.drawImage(tile('stairs'), 9 * 16, 3 * 16);
  const put = (n, x, y, t) => g.drawImage(sprite(n, t), x * 16, y * 16);
  put('hero', 2, 2); put('B', 4, 1); put('D', 7, 2); put('gold', 3, 3); put('potion', 9, 1, '#e02828');
  put('S', 5, 3); put('amulet', 10, 2); put('scroll', 6, 1);
  return c;
}
